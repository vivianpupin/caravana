<title>As Aventuras da Caravana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* Uma tela só: o placar dos dois times fica sempre no alto, com a corrida até 1 milhão; embaixo, o palco onde os desafios vão aparecendo.
   Cores de templo indiano: fundo marrom de madeira escura, vermelho de sindoor nas molduras, amarelo de cúrcuma nos destaques. */
:root{
  --night:#2a130b;       /* marrom bem escuro (fundo) */
  --night-2:#3e1d10;
  --panel:#55291a;       /* marrom dos cartões */
  --panel-2:#73391f;
  --red:#d8392a;         /* vermelho das molduras */
  --gold:#f7b82d;        /* amarelo dos destaques */
  --gold-soft:#ffe3a3;
  --ink:#fff4e4;
  --muted:#dcb79a;
  --t0:#ff5240;          /* Time 1: vermelho */
  --t1:#ffd23f;          /* Time 2: amarelo */
  --right:#4fd17f;
  --wrong:#ff3048;
  --paper:#fbf4e2;       /* folha do Imagem e Ação */
  --pen:#1b1640;
  --display:"Yatra One", Georgia, "Times New Roman", serif;
  --body:"Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;
  background-image:radial-gradient(120% 70% at 50% -10%, var(--night-2) 0%, var(--night) 70%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px}
#app{
  max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px 24px;
}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.05}
h2{font-size:26px;color:var(--gold)}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
.eyebrow{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}

/* ===== Cabeçalho ===== */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head h1{font-size:22px;color:var(--gold)}
.head h1 small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gear{width:46px;height:46px;border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--gold-soft)}
.gear svg{width:24px;height:24px}

/* ===== Placar ===== */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{
  position:relative;border-radius:18px;background:var(--panel);padding:12px 12px 14px;border:3px solid transparent;min-width:0;
  display:flex;flex-direction:column;gap:4px;transition:border-color .2s, box-shadow .2s;
}
.team.on{border-color:var(--team);box-shadow:0 0 22px -6px var(--team)}
.team .nm{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1;color:var(--gold);overflow-wrap:anywhere;text-wrap:balance}
.team .vl{font-family:var(--display);font-size:34px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.team .un{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .track{height:10px;border-radius:6px;background:var(--night);overflow:hidden;margin-top:6px}
.team .track i{display:block;height:100%;background:var(--team);border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.team .tag{position:absolute;top:-11px;right:10px;background:var(--team);color:var(--night);font-size:11px;font-weight:700;letter-spacing:.1em;padding:2px 8px;border-radius:999px}
.team .wins{font-size:12px;color:var(--gold-soft);font-weight:600}
.goal{text-align:center;font-size:13px;color:var(--muted)}
.goal b{color:var(--gold-soft)}
.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.15);color:var(--gold)}}

/* ===== Palco ===== */
.stage{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.hero{
  flex:1;border-radius:24px;background:var(--panel);border:3px solid var(--red);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:26px 18px;text-align:center;min-height:300px;
}
.hero .who{font-family:var(--display);font-size:46px;line-height:1.05;color:var(--gold)}
.hero .kind{font-family:var(--display);font-size:42px;line-height:1.05;color:var(--gold)}
.hero svg.big{width:64px;height:64px;color:var(--gold)}
.hero ul{margin:0;padding-left:20px;text-align:left;display:flex;flex-direction:column;gap:6px;max-width:34ch}
.hero li::marker{color:var(--gold)}
.hero li b{color:var(--gold-soft)}
.spin{font-family:var(--display);font-size:42px;color:var(--gold);min-height:2.3em;display:flex;align-items:center;justify-content:center}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 20px;border-radius:16px;
  font-weight:700;font-size:19px;text-align:center;transition:transform .08s ease;width:100%;
}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--night);box-shadow:0 6px 0 #a8701a}
.btn.team{background:var(--team);color:var(--night);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn.ok{background:var(--right);color:var(--night);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn.soft{background:var(--panel-2);color:var(--ink)}
.btn.ghost{border:2px solid var(--panel-2);color:var(--ink);min-height:50px;font-size:17px}
.btn.big{min-height:68px;font-size:23px}
.btn.link{min-height:40px;font-size:15px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.35;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px;width:100%}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}

/* ===== Cronômetro ===== */
.timer{display:flex;align-items:center;gap:10px}
.timer .bar{flex:1;height:10px;border-radius:6px;background:var(--panel);overflow:hidden}
.timer .bar i{display:block;height:100%;width:100%;background:var(--gold);border-radius:6px;transition:width 1s linear, background .3s}
.timer .bar i.hot{background:var(--wrong)}
.timer .sec{font-weight:700;font-size:22px;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.timer .sec.hot{color:var(--wrong);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}

/* ===== Pergunta ===== */
.qbox{padding:18px;border-radius:18px;background:var(--panel);border:2px solid var(--red)}
.qbox .tag{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.qbox .tag span:last-child{color:var(--team)}
.qbox .q{font-size:21px;font-weight:600;line-height:1.3;margin-top:6px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  --edge:var(--gold);display:block;width:100%;padding:2px;min-height:58px;background:var(--edge);
  clip-path:polygon(18px 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 18px 100%, 0 50%);
}
.opt .in{
  display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 26px;text-align:left;
  background:var(--night-2);font-size:18px;font-weight:500;line-height:1.25;
  clip-path:polygon(17px 0, calc(100% - 17px) 0, 100% 50%, calc(100% - 17px) 100%, 17px 100%, 0 50%);
}
.opt .lt{flex:none;font-family:var(--display);font-size:22px;color:var(--gold);width:1.1em}
.opt.sel .in{background:var(--gold);color:var(--night)}
.opt.sel .lt{color:var(--night)}
.opt.suspense .in{animation:blink .32s steps(2) infinite}
@keyframes blink{50%{background:var(--night-2);color:var(--ink)}}
.opt.right{--edge:var(--right)}
.opt.right .in{background:var(--right);color:var(--night);animation:none}
.opt.right .lt{color:var(--night)}
.opt.wrong{--edge:var(--wrong)}
.opt.wrong .in{background:var(--wrong);color:var(--ink);animation:none}
.opt.wrong .lt{color:var(--ink)}
.opt.elim{opacity:.22;pointer-events:none}
.opt.elim .in span:last-child{text-decoration:line-through}
.helps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{border-radius:14px;background:var(--panel);padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600}
.help svg{width:22px;height:22px;color:var(--gold)}
.help small{color:var(--muted);font-weight:500}
.help[disabled]{opacity:.3;pointer-events:none}

/* ===== Cartas de palavra (mímica, canta, batata) ===== */
.minihead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.minihead .chip{border-radius:999px;padding:6px 12px;background:var(--panel);font-weight:700;font-size:14px;color:var(--team);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minihead .sair{font-weight:700;color:var(--muted);padding:6px 2px;font-size:15px;flex:none}
.wordcard{
  flex:1;min-height:200px;border-radius:24px;background:var(--panel);border:3px solid var(--red);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px 18px;text-align:center;
}
.wordcard .cat{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.wordcard .word{font-family:var(--display);font-size:44px;line-height:1.05;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere}
.wordcard .word.long{font-size:31px}
.wordcard.todos{border-color:var(--t1);background:color-mix(in srgb, var(--t1) 16%, var(--panel))}
.counter{display:flex;justify-content:center;gap:24px;font-weight:600;color:var(--muted);text-align:center}
.counter b{display:block;font-family:var(--display);font-weight:400;font-size:38px;color:var(--right);line-height:1}

/* ===== Imagem e Ação ===== */
.paper{position:relative;flex:1;min-height:300px;border-radius:18px;background:var(--paper);overflow:hidden;touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pen{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);background:var(--c)}
.pen.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.tools .sp{flex:1}
.tool{border-radius:12px;background:var(--panel);padding:8px 12px;font-weight:700;font-size:14px;min-height:40px}
.peek{position:absolute;left:12px;top:12px;right:12px;border-radius:12px;background:var(--pen);color:var(--paper);padding:10px 14px;font-weight:700;text-align:center}

/* ===== Batata quente ===== */
.bomb{display:flex;justify-content:center}
.bomb svg{width:150px;height:150px}
.bomb.lit svg{animation:shake var(--spd, .6s) ease-in-out infinite}
@keyframes shake{25%{transform:rotate(-7deg) scale(1.04)}75%{transform:rotate(7deg) scale(1.04)}}
.holder{font-family:var(--display);font-size:38px;color:var(--gold);text-align:center;line-height:1.05}

/* ===== Folha (sobreposição) ===== */
.sheet-wrap{
  position:fixed;inset:0;z-index:20;background:rgba(24,9,4,.74);display:flex;align-items:flex-end;justify-content:center;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));padding-top:calc(12px + env(safe-area-inset-top, 0px));
  animation:fade .15s ease;
}
@keyframes fade{from{opacity:0}}
.sheet{
  width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--night-2);border-radius:24px;padding:22px 18px 18px;
  display:flex;flex-direction:column;gap:14px;border:2px solid var(--red);animation:rise .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes rise{from{transform:translateY(40px)}}
.sheet h2{font-size:32px;text-align:center}
.sheet .huge{font-family:var(--display);font-size:50px;line-height:1;text-align:center;color:var(--gold)}
.sheet .ok{color:var(--right)}
.sheet .bad{color:var(--wrong)}
.sheet .answer{background:var(--panel);border-radius:14px;padding:12px 14px;text-align:center;font-weight:600}
.sheet .answer small{display:block;font-weight:500;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.ring{font-family:var(--display);font-size:84px;line-height:1;text-align:center;color:var(--gold)}
.ring.hot{color:var(--wrong)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pcard{
  aspect-ratio:2/3;max-width:100%;border-radius:12px;background:var(--panel-2);border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:44px;color:var(--gold);
  background-image:repeating-linear-gradient(45deg, transparent 0 8px, rgba(246,185,49,.13) 8px 10px);transition:transform .35s;
}
.pcard.up{background:var(--gold);color:var(--night);transform:rotateY(360deg)}
.pcard[disabled]{pointer-events:none}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%;background:var(--night);border:2px solid var(--panel-2);border-radius:12px;padding:12px 14px;font-size:17px;color:var(--ink);font-family:var(--body);
}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border-radius:999px;padding:8px 14px;background:var(--panel);font-weight:600;font-size:15px}
.chips button.on{background:var(--gold);color:var(--night)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--panel);font-weight:600;width:100%;text-align:left}
.toggle .pill{border-radius:999px;padding:4px 12px;font-size:14px;background:var(--night);color:var(--muted)}
.toggle .pill.on{background:var(--right);color:var(--night)}
.card{background:var(--panel);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.mine{display:flex;flex-direction:column;gap:8px}
.mine .it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--night);border-radius:12px;padding:10px 12px}
.mine .it p{font-size:15px;min-width:0;overflow-wrap:anywhere}
.mine .it small{color:var(--right);font-weight:600}
.mine .it button{color:var(--wrong);font-weight:700;font-size:14px;padding:6px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:40;
  background:var(--gold);color:var(--night);font-weight:700;padding:10px 18px;border-radius:999px;animation:rise .2s ease;white-space:nowrap;
}
@media (max-width:380px){
  .team .vl{font-size:28px}
  .qbox .q{font-size:19px}.opt .in{font-size:16.5px}
  .hero .who,.hero .kind{font-size:36px}
  .wordcard .word{font-size:36px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none!important;transition:none!important}
}
</style>

let ac = null, ruido = null;
function audio() {

function tom(f, dur, tipo = "sine", vol = 0.18, quando = 0, ate = null) {

  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}

const SOM = {

  certa() { [523, 659, 784, 1047].forEach((f, i) => tom(f, 0.35, "triangle", 0.2, i * 0.11)); tom(1568, 0.6, "triangle", 0.12, 0.45); },
  ponto() { tom(880, 0.12, "triangle", 0.18); tom(1320, 0.25, "triangle", 0.16, 0.09); },
  errada() { tom(330, 0.35, "sawtooth", 0.14, 0, 220); tom(220, 0.7, "sawtooth", 0.14, 0.32, 110); },
  vinheta() { [392, 523, 659, 784].forEach((f, i) => tom(f, 0.22, "square", 0.07, i * 0.09)); tom(1047, 0.5, "triangle", 0.14, 0.38); },

let DZ = { fase: "palavra", carta: null, todos: false, tracos: [], cor: "" };
const CORES = ["#1b1640", "#e23b3b", "#2a6fdb", "#1f9d55", "#f08a00"];
function desenhoComeca() {

function dzDesenhar() { DZ.fase = "desenho"; render(); SOM.vinheta(); relogio(TEMPO_DESENHO, dzTempo); }
let ctx2 = null, papel = null, traco = null;
function montarPapel() {
  const cv = document.getElementById("tela"); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  ctx2 = cv.getContext("2d"); ctx2.setTransform(dpr, 0, 0, dpr, 0, 0); ctx2.lineCap = "round"; ctx2.lineJoin = "round";
  papel = cv; redesenhar();
  const pt = (e) => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height]; };
  cv.onpointerdown = (e) => { e.preventDefault(); cv.setPointerCapture(e.pointerId); traco = { cor: DZ.cor, pts: [pt(e)] }; DZ.tracos.push(traco); redesenhar(); };
  cv.onpointermove = (e) => { if (!traco) return; e.preventDefault(); traco.pts.push(pt(e)); redesenhar(); };
  cv.onpointerup = cv.onpointercancel = () => { traco = null; };
}
function redesenhar() {
  if (!ctx2 || !papel) return;
  const w = papel.clientWidth, h = papel.clientHeight;
  ctx2.clearRect(0, 0, w, h);
  for (const t of DZ.tracos) {
    ctx2.strokeStyle = t.cor; ctx2.lineWidth = 5; ctx2.beginPath();
    t.pts.forEach(([x, y], k) => (k ? ctx2.lineTo(x * w, y * h) : ctx2.moveTo(x * w, y * h)));
    if (t.pts.length === 1) ctx2.lineTo(t.pts[0][0] * w + 0.1, t.pts[0][1] * h);
    ctx2.stroke();
  }
}
function dzAcerto(k) {

function dzTempo() {

  contagem(5, document.getElementById("conta"));
}

/* ================== FOLHAS (pop-ups) ================== */
let folhaAberta = null, contaFolha = null;
function folha(html, opts = {}) {
  fecharFolha();
  const w = document.createElement("div");
  w.className = "sheet-wrap"; w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  if (opts.fora) w.addEventListener("click", (e) => { if (e.target === w) opts.fora(); });
  document.body.appendChild(w); folhaAberta = w;
  const b = w.querySelector("button.btn"); if (b) b.focus({ preventScroll: true });
}
function fecharFolha() { if (folhaAberta) { folhaAberta.remove(); folhaAberta = null; } clearInterval(contaFolha); }
function contagem(seg, el) {
  clearInterval(contaFolha); let n = seg; el.textContent = n;
  contaFolha = setInterval(() => {
    n--; el.textContent = Math.max(n, 0); el.classList.toggle("hot", n <= 5);
    if (n > 0) SOM.tiqueForte(n);
    if (n <= 0) { clearInterval(contaFolha); SOM.errada(); }
  }, 1000);
}
function toast(t) {
  const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d);
  setTimeout(() => d.remove(), 1800);
}

/* ================== CLIQUES ================== */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, p = b.dataset.p !== undefined ? +b.dataset.p : null;
  switch (a) {
    case "sortear": sortear(); break;
    case "valendo": valendo(); break;
    case "seguir": seguir(); break;
    case "sair": sair(); break;
    case "marcar": marcar(p); break;
    case "confirmar": confirmar(); break;
    case "desmarcar": desmarcar(); break;
    case "roubar": roubar(p); break;
    case "ajCartas": ajCartas(); break;
    case "virar": virar(b); break;
    case "voltarPergunta": fecharFolha(); pausar(false); render(); break;
    case "ajPular": ajPular(); break;
    case "mmAcerto": mmAcerto(); break;
    case "mmPular": mmPular(); break;
    case "dzTrocar": DZ.carta = tirar(DESENHO, "desenho"); SOM.carta(); render(); break;
    case "dzDesenhar": dzDesenhar(); break;
    case "dzCor": DZ.cor = b.dataset.c; document.querySelectorAll(".pen").forEach((x) => x.classList.toggle("on", x === b)); break;
    case "dzDesfazer": DZ.tracos.pop(); redesenhar(); break;
    case "dzLimpar": DZ.tracos = []; redesenhar(); break;
    case "dzEspiar": {
      const pp = document.getElementById("papel"); if (!pp || pp.querySelector(".peek")) break;
      const d = document.createElement("div"); d.className = "peek"; d.textContent = DZ.carta.palavra; pp.appendChild(d);
      setTimeout(() => d.remove(), 1800); break;
    }
    case "dzAcerto": dzAcerto(p); break;
    case "dzRoubo": dzRoubo(p === 1); break;
    case "btPassa": btPassa(); break;
    case "btTravou": explodir(); break;
    case "ctCantou": ctCantou(p); break;
    case "opcoes": opcoes(); break;
    case "fecharOpcoes": fecharOpcoes(); break;
    case "unidade": document.getElementById("un").value = b.dataset.u; document.querySelectorAll(".chips button").forEach((x) => x.classList.toggle("on", x === b)); break;
    case "tSom": lerOpcoes(); S.som = !S.som; salvar(); opcoes(); break;
    case "tVoz": lerOpcoes(); S.voz = !S.voz; salvar(); opcoes(); break;
    case "pedirZerar": pedirZerar(); break;
    case "outraUnidade": S.unidade = sortearUnidade(S.unidade); SOM.carta(); salvar(); render(); break;
    case "zerar": fecharFolha(); novaAventura(); toast("Placar zerado"); break;
    case "novaAventura": fecharFolha(); novaAventura(); break;
    case "minhas": lerOpcoes(); pararTudo(); S.fase = "espera"; S.tela = "minhas"; salvar(); render(); window.scrollTo(0, 0); break;
    case "voltarJogo": S.tela = "jogo"; salvar(); render(); window.scrollTo(0, 0); break;
    case "apagarMinha": S.usadas = S.usadas.filter((id) => !id.startsWith("m")); S.minhas.splice(+b.dataset.k, 1); salvar(); render(); break;
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "formMinha") return;
  e.preventDefault();
  const v = (id) => document.getElementById(id).value.trim();
  const m = { q: v("mq"), r: [v("mr0"), v("mr1"), v("mr2"), v("mr3")], nivel: +v("mn") };
  if (!m.q || m.r.some((x) => !x)) return;
  S.minhas.push(m); salvar(); render(); toast("Pergunta guardada");
});
window.addEventListener("resize", () => { if (S.fase === "desenho" && DZ.fase === "desenho") montarPapel(); });

/* ================== CONFETE ================== */
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let pedacos = [], animando = false;
function confete(muito, time) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const css = getComputedStyle(document.documentElement), g = (n) => css.getPropertyValue(n).trim();
  const cores = time === undefined ? [g("--gold"), g("--gold-soft"), g("--t0"), g("--t1"), g("--ink")]
    : [g("--gold"), g("--gold-soft"), g("--t" + time), g("--t" + time), g("--ink")];
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const n = muito ? 260 : 110;
  for (let i = 0; i < n; i++) pedacos.push({
    x: Math.random() * cv.width, y: -Math.random() * cv.height * 0.5, w: (6 + Math.random() * 8) * devicePixelRatio, h: (8 + Math.random() * 10) * devicePixelRatio,
    vy: (2 + Math.random() * 4) * devicePixelRatio, vx: (Math.random() - 0.5) * 3 * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cores[i % cores.length],
  });
  if (!animando) { animando = true; requestAnimationFrame(passo); }
}
function passo() {
  cx.clearRect(0, 0, cv.width, cv.height);
  pedacos = pedacos.filter((p) => p.y < cv.height + 40);
  for (const p of pedacos) {
    p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); cx.restore();
  }
  if (pedacos.length) requestAnimationFrame(passo); else { animando = false; cx.clearRect(0, 0, cv.width, cv.height); }
}



/* ================== INÍCIO ================== */
function boot(d) {
  if (d && d.S) S = Object.assign(novoEstado(), d.S); else carregar();
  if (!S.unidade || ["estrelas", "flores de marigold"].includes(S.unidade)) S.unidade = sortearUnidade();   // opções que saíram da lista
  // ao reabrir, o desafio que estava no meio não continua sozinho: volta para o placar
  S.fase = "espera"; S.tela = S.tela === "minhas" ? "minhas" : "jogo";
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
