<title>As Aventuras da Caravana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* Palco de programa de auditório à noite: anel de lâmpadas douradas sobre índigo, alternativas em losango como no Show do Milhão.
   Tela única, botões grandes para tocar com o carro andando. Visual escuro de propósito (é um palco). */
:root{
  --night:#130e36;
  --night-2:#221a5c;
  --panel:#2c2378;
  --panel-2:#3a2f96;
  --gold:#f6b931;
  --gold-soft:#ffe09a;
  --ink:#fff8ea;
  --muted:#b8b0e8;
  --t0:#ff8a1f;          /* Time 1: açafrão */
  --t1:#27d3c0;          /* Time 2: azul-pavão */
  --right:#35d67f;
  --wrong:#ff4d5e;
  --paper:#fbf4e2;       /* folha do Imagem e Ação */
  --pen:#1b1640;
  --display:"Yatra One", Georgia, "Times New Roman", serif;
  --body:"Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;
  background-image:radial-gradient(120% 70% at 50% -10%, var(--night-2) 0%, var(--night) 70%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px}
#app{
  max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px 28px;
}
.screen{display:flex;flex-direction:column;gap:18px;flex:1}
.eyebrow{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.05}
h2{font-size:24px;color:var(--gold)}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ===== Capa com lâmpadas ===== */
.marquee{
  position:relative;text-align:center;padding:30px 18px 26px;border-radius:22px;
  background:linear-gradient(180deg, var(--panel) 0%, var(--night-2) 100%);
  display:flex;flex-direction:column;gap:8px;align-items:center;
}
.marquee::before{
  content:"";position:absolute;inset:6px;border-radius:17px;pointer-events:none;
  background:
    radial-gradient(circle, var(--gold-soft) 2.2px, transparent 3px) 0 0/18px 18px repeat-x,
    radial-gradient(circle, var(--gold-soft) 2.2px, transparent 3px) 0 100%/18px 18px repeat-x,
    radial-gradient(circle, var(--gold-soft) 2.2px, transparent 3px) 0 0/18px 18px repeat-y,
    radial-gradient(circle, var(--gold-soft) 2.2px, transparent 3px) 100% 0/18px 18px repeat-y;
  animation:bulbs 1.2s steps(2) infinite;
}
@keyframes bulbs{50%{opacity:.45}}
.marquee h1{font-size:34px;color:var(--ink)}
.marquee h1 span{display:block;font-size:68px;color:var(--gold);text-shadow:0 0 24px rgba(246,185,49,.45)}
.marquee .lead{max-width:30ch;color:var(--muted)}

/* ===== Cartões e formulários ===== */
.card{background:var(--panel);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%;background:var(--night);border:2px solid var(--panel-2);border-radius:12px;padding:12px 14px;font-size:17px;color:var(--ink);font-family:var(--body);
}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:baseline}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 20px;border-radius:16px;
  font-weight:700;font-size:19px;text-align:center;transition:transform .08s ease, filter .15s;
}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--night);box-shadow:0 6px 0 #b9831a}
.btn.gold:active{box-shadow:0 2px 0 #b9831a;transform:translateY(4px)}
.btn.team{background:var(--team);color:var(--night);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn.ok{background:var(--right);color:var(--night);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn.soft{background:var(--panel-2);color:var(--ink)}
.btn.ghost{border:2px solid var(--panel-2);color:var(--ink);min-height:50px;font-size:17px}
.btn.big{min-height:68px;font-size:23px}
.btn.link{min-height:44px;font-size:15px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.35;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;text-align:left}
.rules li::marker{color:var(--gold)}
.rules b{color:var(--gold-soft)}

.champ{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.champ .tm{background:var(--night);border-radius:14px;padding:12px 14px;border-left:6px solid var(--team);text-align:left}
.champ .tm strong{display:block;font-family:var(--display);font-weight:400;font-size:30px;color:var(--team);line-height:1.1}
.champ .tm span{font-size:14px;color:var(--muted)}

/* ===== Cardápio de jogos ===== */
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:18px;
  background:var(--panel);border:2px solid var(--panel-2);min-height:150px;
}
.game svg{width:34px;height:34px;color:var(--gold)}
.game h3{font-size:21px;color:var(--ink)}
.game p{font-size:14px;color:var(--muted);line-height:1.3}
.game .pr{margin-top:auto;font-size:13px;font-weight:700;color:var(--gold-soft)}
.game.roleta{background:var(--gold);border-color:var(--gold)}
.game.roleta svg,.game.roleta h3,.game.roleta p,.game.roleta .pr{color:var(--night)}

/* ===== Placar (topo do jogo) ===== */
.topbar{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:stretch}
.score{
  border-radius:14px;padding:8px 12px;background:var(--panel);border:2px solid transparent;min-width:0;
  display:flex;flex-direction:column;justify-content:center;
}
.score .nm{font-size:13px;font-weight:600;color:var(--team);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .vl{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.score.on{border-color:var(--team);box-shadow:0 0 18px -4px var(--team)}
.menu-btn{width:52px;border-radius:14px;background:var(--panel);font-size:26px;line-height:1;font-weight:700;color:var(--gold-soft)}

/* ===== Escada de prêmios ===== */
.ladder{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.ladder div{
  border-radius:8px;padding:6px 2px;text-align:center;background:var(--panel);color:var(--muted);
  font-size:11px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums;
}
.ladder div b{display:block;font-size:15px;color:var(--ink)}
.ladder div.done{background:color-mix(in srgb, var(--gold) 30%, var(--panel));color:var(--gold-soft)}
.ladder div.now{background:var(--gold);color:var(--night)}
.ladder div.now b{color:var(--night)}
.stakes{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.stakes b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ===== Cronômetro ===== */
.timer{display:flex;align-items:center;gap:10px}
.timer .bar{flex:1;height:10px;border-radius:6px;background:var(--panel);overflow:hidden}
.timer .bar i{display:block;height:100%;width:100%;background:var(--gold);border-radius:6px;transition:width 1s linear, background .3s}
.timer .bar i.hot{background:var(--wrong)}
.timer .sec{font-weight:700;font-size:22px;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.timer .sec.hot{color:var(--wrong);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}

/* ===== Pergunta ===== */
.qbox{
  position:relative;padding:20px 18px;border-radius:18px;background:var(--panel);
  border:2px solid color-mix(in srgb, var(--gold) 55%, transparent);
}
.qbox .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.qbox .q{font-size:22px;font-weight:600;line-height:1.3;margin-top:6px;text-wrap:pretty}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  --edge:var(--gold);
  position:relative;display:block;width:100%;padding:2px;min-height:60px;
  background:var(--edge);
  clip-path:polygon(18px 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 18px 100%, 0 50%);
}
.opt .in{
  display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 26px;text-align:left;
  background:var(--night-2);font-size:18px;font-weight:500;line-height:1.25;
  clip-path:polygon(17px 0, calc(100% - 17px) 0, 100% 50%, calc(100% - 17px) 100%, 17px 100%, 0 50%);
}
.opt .lt{flex:none;font-family:var(--display);font-size:22px;color:var(--gold);width:1.1em}
.opt.sel .in{background:var(--gold);color:var(--night)}
.opt.sel .lt{color:var(--night)}
.opt.suspense .in{animation:blink .32s steps(2) infinite}
@keyframes blink{50%{background:var(--night-2);color:var(--ink)}}
.opt.right{--edge:var(--right)}
.opt.right .in{background:var(--right);color:var(--night);animation:none}
.opt.right .lt{color:var(--night)}
.opt.wrong{--edge:var(--wrong)}
.opt.wrong .in{background:var(--wrong);color:var(--ink);animation:none}
.opt.wrong .lt{color:var(--ink)}
.opt.elim{opacity:.22;pointer-events:none}
.opt.elim .in span:last-child{text-decoration:line-through}

.helps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.help{
  border-radius:14px;background:var(--panel);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:12.5px;font-weight:600;line-height:1.1;text-align:center;color:var(--ink);min-height:72px;
}
.help svg{width:26px;height:26px;color:var(--gold)}
.help .left{font-size:11px;color:var(--muted)}
.help[disabled]{opacity:.3;pointer-events:none}

/* ===== Vez do time ===== */
.vez{justify-content:center;text-align:center;align-items:center;gap:20px}
.vez .teamname{font-size:56px;color:var(--team);text-shadow:0 0 30px color-mix(in srgb, var(--team) 50%, transparent)}
.vez .stack,.vez .champ,.vez .card{width:100%}

/* ===== Mímica, Canta e cartas de palavra ===== */
.minihead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.minihead .sair{font-weight:700;color:var(--muted);padding:8px 4px;font-size:15px}
.minihead .chip{border-radius:999px;padding:6px 12px;background:var(--panel);font-weight:700;font-size:14px;color:var(--team);white-space:nowrap}
.wordcard{
  flex:1;min-height:240px;border-radius:24px;background:var(--panel);border:3px solid var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 18px;text-align:center;
}
.wordcard .cat{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.wordcard .word{font-family:var(--display);font-size:46px;line-height:1.05;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere}
.wordcard .word.long{font-size:32px}
.wordcard.todos{border-color:var(--t1);background:color-mix(in srgb, var(--t1) 16%, var(--panel))}
.counter{display:flex;justify-content:center;gap:24px;font-weight:600;color:var(--muted)}
.counter b{display:block;font-family:var(--display);font-weight:400;font-size:40px;color:var(--right);line-height:1}

/* ===== Imagem e Ação (desenho) ===== */
.drawwrap{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.paper{position:relative;flex:1;min-height:320px;border-radius:18px;background:var(--paper);overflow:hidden;touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pen{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);background:var(--c)}
.pen.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.tools .sp{flex:1}
.tool{border-radius:12px;background:var(--panel);padding:8px 12px;font-weight:700;font-size:14px;min-height:40px}
.peek{position:absolute;left:12px;top:12px;right:12px;border-radius:12px;background:var(--pen);color:var(--paper);padding:10px 14px;font-weight:700;text-align:center}

/* ===== Batata quente ===== */
.bomb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.bomb svg{width:170px;height:170px}
.bomb.lit svg{animation:shake var(--spd, .6s) ease-in-out infinite}
@keyframes shake{25%{transform:rotate(-7deg) scale(1.04)}75%{transform:rotate(7deg) scale(1.04)}}
.holder{font-family:var(--display);font-size:40px;color:var(--team);text-align:center;line-height:1.05}

/* ===== Roleta ===== */
.spin{font-family:var(--display);font-size:44px;text-align:center;color:var(--gold);min-height:2.3em;display:flex;align-items:center;justify-content:center}

/* ===== Folha (sobreposição) ===== */
.sheet-wrap{
  position:fixed;inset:0;z-index:20;background:rgba(8,5,28,.72);display:flex;align-items:flex-end;justify-content:center;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));padding-top:calc(12px + env(safe-area-inset-top, 0px));
  animation:fade .15s ease;
}
@keyframes fade{from{opacity:0}}
.sheet{
  width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--night-2);border-radius:24px;padding:22px 18px 18px;
  display:flex;flex-direction:column;gap:14px;border:2px solid var(--panel-2);animation:rise .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes rise{from{transform:translateY(40px)}}
.sheet h2{font-size:32px;text-align:center}
.sheet .center{text-align:center}
.sheet .huge{font-family:var(--display);font-size:54px;line-height:1;text-align:center;color:var(--gold)}
.sheet .ok{color:var(--right)}
.sheet .bad{color:var(--wrong)}
.sheet .answer{background:var(--panel);border-radius:14px;padding:12px 14px;text-align:center;font-weight:600}
.sheet .answer small{display:block;font-weight:500;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pcard{
  aspect-ratio:2/3;max-width:100%;border-radius:12px;background:var(--panel-2);border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:44px;color:var(--gold);
  background-image:repeating-linear-gradient(45deg, transparent 0 8px, rgba(246,185,49,.13) 8px 10px);
  transition:transform .35s;
}
.pcard.up{background:var(--gold);color:var(--night);transform:rotateY(360deg)}
.pcard[disabled]{pointer-events:none}

.votes{display:flex;flex-direction:column;gap:8px}
.vote{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:stretch}
.vote button.add{
  position:relative;overflow:hidden;text-align:left;border-radius:12px;background:var(--panel);padding:12px 14px;font-weight:600;min-height:52px;
}
.vote button.add i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb, var(--gold) 38%, transparent);transition:width .2s}
.vote button.add span{position:relative;display:flex;justify-content:space-between;gap:8px}
.vote button.sub{border-radius:12px;background:var(--panel);font-size:24px;font-weight:700;color:var(--muted)}

.ring{font-family:var(--display);font-size:88px;line-height:1;text-align:center;color:var(--gold)}
.ring.hot{color:var(--wrong)}

.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--night);font-weight:600;width:100%;text-align:left}
.sheet .toggle{background:var(--panel)}
.toggle .pill{border-radius:999px;padding:4px 12px;font-size:14px;background:var(--panel-2);color:var(--muted)}
.toggle .pill.on{background:var(--right);color:var(--night)}

.mine{display:flex;flex-direction:column;gap:8px}
.mine .it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--night);border-radius:12px;padding:10px 12px}
.mine .it p{font-size:15px;min-width:0;overflow-wrap:anywhere}
.mine .it small{color:var(--right);font-weight:600}
.mine .it button{color:var(--wrong);font-weight:700;font-size:14px;padding:6px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:40;
  background:var(--gold);color:var(--night);font-weight:700;padding:10px 18px;border-radius:999px;animation:rise .2s ease;
}
@media (max-width:380px){
  .marquee h1 span{font-size:56px}
  .qbox .q{font-size:20px}.opt .in{font-size:16.5px}
  .vez .teamname{font-size:44px}
  .game h3{font-size:19px}
  .wordcard .word{font-size:38px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none!important;transition:none!important}
}
</style>

  if (v >= 1e6) { const n = v / 1e6; return "₹" + f(n) + (n < 2 ? " milhão" : " milhões"); }
  if (v >= 1000) return "₹" + f(v / 1000) + " mil";
  return "₹" + f(v);
}
function curto(v) { return v >= 1e6 ? [v / 1e6, "milhão"] : [v / 1000, "mil"]; }
function falaValor(v) { return rs(v).replace("₹", "") + (v >= 1e6 ? " de rupias" : " rupias"); }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const L = ["A", "B", "C", "D"];
const outro = () => 1 - S.vez;
const T = (i) => S.times[i];
const cor = (i) => `var(--t${i})`;
function embaralhar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ================== SORTEIO ================== */
function todas() {
  const minhas = (S.minhas || []).map((m, i) => [m.nivel, "Da turma", m.q, m.r[0], m.r[1], m.r[2], m.r[3], "m" + i]);
  return BANCO.map((b, i) => [...b.slice(0, 7), "b" + i]).concat(minhas);
}
function sortear(nivel) {
  const lista = todas();
  let livres = lista.filter((x) => x[0] === nivel && !S.usadas.includes(x[7]));
  if (!livres.length) {
    const ids = lista.filter((x) => x[0] === nivel).map((x) => x[7]);
    S.usadas = S.usadas.filter((id) => !ids.includes(id));
    livres = lista.filter((x) => x[0] === nivel);
  }
  const daTurma = livres.filter((x) => x[1] === "Da turma");
  const pool = daTurma.length && Math.random() < 0.3 ? daTurma : livres;
  const p = pool[Math.floor(Math.random() * pool.length)];
  S.usadas.push(p[7]);
  return { id: p[7], tema: p[1], q: p[2], r: [p[3], p[4], p[5], p[6]], ordem: embaralhar([0, 1, 2, 3]), elim: [], marcada: null, estado: "" };
}
// cartas dos outros jogos: não repetem até acabar o baralho
function tirar(baralho, nome) {
  const itens = Array.isArray(baralho) ? baralho.map((p) => ["", p]) : Object.entries(baralho).flatMap(([c, ps]) => ps.map((p) => [c, p]));
  const usadas = (S.usadasMini[nome] = S.usadasMini[nome] || []);
  let livres = itens.filter((x) => !usadas.includes(x[1]));
  if (!livres.length) { usadas.length = 0; livres = itens; }
  const x = livres[Math.floor(Math.random() * livres.length)];
  usadas.push(x[1]);
  return { cat: x[0], palavra: x[1] };
}

/* ================== SOM ================== */
let ac = null, ruido = null;
function audio() {
  if (!S.som) return null;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
  } catch (e) { return null; }
  return ac;
}
function tom(f, dur, tipo = "sine", vol = 0.18, quando = 0, ate = null) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + quando, o = a.createOscillator(), g = a.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t);
  if (ate) o.frequency.exponentialRampToValueAtTime(ate, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function batida(quando, vol = 0.5, corte = 900, dur = 0.2) {
  const a = audio(); if (!a) return;
  if (!ruido) {
    ruido = a.createBuffer(1, a.sampleRate * 1.2, a.sampleRate);
    const d = ruido.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = a.createBufferSource(), g = a.createGain(), fl = a.createBiquadFilter(), t = a.currentTime + quando;
  fl.type = "lowpass"; fl.frequency.value = corte; s.buffer = ruido;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl).connect(g).connect(a.destination); s.start(t); s.stop(t + dur + 0.05);
  tom(90, Math.min(dur, 0.15), "sine", vol * 0.5, quando, 50);
}
const SOM = {
  tique(n) { tom(n % 2 ? 1250 : 950, 0.05, "square", 0.05); },
  tiqueForte(n) { tom(n % 2 ? 1500 : 1150, 0.07, "square", 0.09); },
  suspense() { let t = 0, gap = 0.2; while (t < 1.9) { batida(t, 0.35 + t * 0.15); t += gap; gap = Math.max(0.05, gap * 0.86); } },
  certa() { [523, 659, 784, 1047].forEach((f, i) => tom(f, 0.35, "triangle", 0.2, i * 0.11)); tom(1568, 0.6, "triangle", 0.12, 0.45); },
  ponto() { tom(880, 0.12, "triangle", 0.18); tom(1320, 0.25, "triangle", 0.16, 0.09); },
  errada() { tom(330, 0.35, "sawtooth", 0.14, 0, 220); tom(220, 0.7, "sawtooth", 0.14, 0.32, 110); },
  vinheta() { [392, 523, 659, 784].forEach((f, i) => tom(f, 0.22, "square", 0.07, i * 0.09)); tom(1047, 0.5, "triangle", 0.14, 0.38); },
  milhao() { const n = [523, 659, 784, 1047, 784, 1047, 1319, 1568]; n.forEach((f, i) => tom(f, 0.3, "triangle", 0.2, i * 0.13)); for (let i = 0; i < 8; i++) batida(i * 0.13, 0.3); },
  roubada() { for (let i = 0; i < 6; i++) tom(i % 2 ? 660 : 880, 0.14, "square", 0.08, i * 0.15); },
  carta() { tom(700, 0.12, "triangle", 0.15, 0, 1400); },
  clique() { tom(600, 0.04, "triangle", 0.08); },
  pavio() { tom(1800, 0.03, "square", 0.04); },
  bum() { batida(0, 1, 500, 1.1); tom(120, 0.9, "sawtooth", 0.25, 0, 30); },
  roleta(i) { tom(500 + (i % 6) * 90, 0.05, "triangle", 0.1); },
};
function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function falar(txt) {
  if (!S.voz || !S.som) return;
  try {
    const u = new SpeechSynthesisUtterance(txt); u.lang = "pt-BR"; u.rate = 1.02; u.pitch = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

/* ================== CRONÔMETRO (o tique-taque) ================== */
let clk = { id: null, resta: 0, total: 0, pausado: false };
function relogio(total, fim) {
  pararRelogio();
  clk = { id: null, resta: total, total, pausado: false };
  pintarTempo();
  clk.id = setInterval(() => {
    if (clk.pausado) return;
    clk.resta--; pintarTempo();
    if (clk.resta <= 10 && clk.resta > 0) SOM.tiqueForte(clk.resta); else if (clk.resta > 0) SOM.tique(clk.resta);
    if (clk.resta <= 0) { pararRelogio(); fim && fim(); }
  }, 1000);
}
function pararRelogio() { clearInterval(clk.id); clk.id = null; }
function pausar(v) { clk.pausado = v; }
function pintarTempo() {
  const bar = document.querySelector(".timer .bar i"), sec = document.querySelector(".timer .sec");
  if (!bar || !clk.total) return;
  const hot = clk.resta <= 10;
  if (!bar.dataset.ok) { bar.dataset.ok = 1; bar.style.transition = "none"; bar.style.width = (100 * clk.resta / clk.total) + "%"; bar.offsetWidth; bar.style.transition = ""; }
  bar.style.width = (100 * clk.resta / clk.total) + "%"; bar.classList.toggle("hot", hot);
  sec.textContent = clk.resta; sec.classList.toggle("hot", hot);
}
const barraTempo = (total) => `<div class="timer" aria-label="Tempo restante"><div class="bar"><i></i></div><span class="sec">${total}</span></div>`;

function roubar(p) {
  fecharFolha();
  const c = S.atual, o = outro(), valor = PREMIOS[S.degrau];
  const garantido = S.degrau > 0 ? PREMIOS[S.degrau - 1] : 0, metade = Math.floor(garantido / 2);
  const roubou = p >= 0 && c.ordem[p] === 0;
  T(S.vez).pontos += metade;
  if (roubou) T(o).pontos += valor;
  c.estado = "revelada"; salvar(); render();
  if (roubou) { SOM.certa(); confete(false, o); falar(T(o).nome + " roubou!"); }
  else if (p >= 0) SOM.errada();
  folha(`<h2 class="${roubou ? "ok" : "bad"}">${roubou ? `${esc(T(o).nome)} roubou!` : "Ninguém acertou"}</h2>
    <div class="answer"><small>A resposta certa era</small>${esc(c.r[0])}</div>
    ${roubou ? `<p class="center">+ <b class="num">${rs(valor)}</b> para o ${esc(T(o).nome)}</p>` : ""}
    <p class="center muted">O ${esc(T(S.vez).nome)} leva ${metade ? `<b class="num">${rs(metade)}</b>, metade do que tinha garantido` : "nada desta vez"}.</p>

function virar(btn) {

function dzDesenhar() { DZ.fase = "desenho"; render(); SOM.vinheta(); relogio(TEMPO_DESENHO, dzTempo); }
let ctx2 = null, papel = null, traco = null;
function montarPapel() {
  const cv = document.getElementById("tela"); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  ctx2 = cv.getContext("2d"); ctx2.setTransform(dpr, 0, 0, dpr, 0, 0); ctx2.lineCap = "round"; ctx2.lineJoin = "round";
  papel = cv; redesenhar();
  const pt = (e) => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height]; };
  cv.onpointerdown = (e) => { e.preventDefault(); cv.setPointerCapture(e.pointerId); traco = { cor: DZ.cor, pts: [pt(e)] }; DZ.traços.push(traco); redesenhar(); };
  cv.onpointermove = (e) => { if (!traco) return; e.preventDefault(); traco.pts.push(pt(e)); redesenhar(); };
  cv.onpointerup = cv.onpointercancel = () => { traco = null; };
}
function redesenhar() {
  if (!ctx2 || !papel) return;
  const w = papel.clientWidth, h = papel.clientHeight;
  ctx2.clearRect(0, 0, w, h);
  for (const t of DZ.traços) {
    ctx2.strokeStyle = t.cor; ctx2.lineWidth = 5; ctx2.beginPath();
    t.pts.forEach(([x, y], k) => (k ? ctx2.lineTo(x * w, y * h) : ctx2.moveTo(x * w, y * h)));
    if (t.pts.length === 1) ctx2.lineTo(t.pts[0][0] * w + 0.1, t.pts[0][1] * h);
    ctx2.stroke();
  }
}

/* ================== FIM DE CADA VEZ E DO TRAJETO ================== */
function comecarTrajeto() {
  if (S.jogando) return;
  if (S.fim) { S.times.forEach((t) => { t.pontos = 0; t.aj = AJUDAS(); }); S.trajeto++; S.quemComeca = 1 - S.quemComeca; S.fim = null; }
  S.jogando = true; S.vez = S.quemComeca; S.degrau = 0; S.atual = null; S.ultimo = "";
}
function comecar() {
  lerConfig(); audio(); telaAcesa(); comecarTrajeto();
  if (S.jogo === "quiz" && S.atual) { S.tela = "pergunta"; salvar(); render(); return retomar(); }
  if (S.tela !== "vez" && S.ultimo) { S.tela = "vez"; salvar(); render(); return; }
  salvar(); roleta();
}
function escolherJogo(j) {
  lerConfig(); audio(); telaAcesa(); comecarTrajeto();
  S.ultimo = j;
  S.jogo = j;
  if (j === "quiz" && S.atual) { S.tela = "pergunta"; salvar(); render(); return retomar(); }
  S.tela = "vez"; salvar(); render(); window.scrollTo(0, 0); SOM.vinheta();
  falar(JOGOS[j].nome + "! " + (JOGOS[j].dois ? "Começa o " : "Vez do ") + T(S.vez).nome);
}

}
function sairMini() {
  fecharFolha(); pararRelogio(); clearTimeout(BT.id);
  if (S.tela === "pergunta") S.atual = null;
  S.tela = "vez"; salvar(); render();
}
function roleta() {
  lerConfig(); audio();
  // não repete o mesmo desafio duas vezes seguidas
  const nomes = Object.keys(JOGOS), opcoes = nomes.filter((k) => k !== S.ultimo), alvo = opcoes[Math.floor(Math.random() * opcoes.length)];
  folha(`<p class="eyebrow center">Roleta da Aventura · vez do ${esc(T(S.vez).nome)}</p><div class="spin" id="spin"></div>`);
  let i = 0, gap = 60;
  const gira = () => {
    const el = document.getElementById("spin"); if (!el) return;
    const k = gap > 260 ? alvo : nomes[i % nomes.length];
    el.textContent = JOGOS[k].nome; SOM.roleta(i); i++;
    if (gap > 260) { SOM.certa(); setTimeout(() => { fecharFolha(); escolherJogo(alvo); }, 900); return; }
    gap *= 1.12; setTimeout(gira, gap);
  };
  gira();
}
function pedirFim() {
  pausar(true);
  folha(`<h2>Encerrar o trajeto?</h2><p class="center muted">Vence o time com mais rupias e ele ganha um ponto no Campeonato da Caravana.</p>
    <button class="btn gold big" data-a="encerrar">Encerrar e ver o vencedor</button>
    <button class="btn ghost" data-a="fechar">Continuar jogando</button>`, { fora: () => pausar(false) });
}
function encerrar() {
  fecharFolha(); pararRelogio(); clearTimeout(BT.id);
  if (S.tela === "pergunta" && S.atual && !S.atual.estado && S.degrau > 0) T(S.vez).pontos += PREMIOS[S.degrau - 1];
  const p = [T(0).pontos, T(1).pontos], v = p[0] === p[1] ? -1 : p[0] > p[1] ? 0 : 1;
  if (v >= 0) T(v).trajetos++;
  S.fim = { vencedor: v, pontos: p, trajeto: S.trajeto };
  S.jogando = false; S.atual = null; S.tela = "fim"; salvar(); render(); window.scrollTo(0, 0);
  SOM.milhao(); confete(true, v >= 0 ? v : undefined);
  falar(v >= 0 ? T(v).nome + " venceu o trajeto!" : "Empate!");
}
function telaFim() {
  const f = S.fim || { vencedor: -1, pontos: [0, 0] };
  const v = f.vencedor;
  return `<div class="screen vez" style="--team:${v >= 0 ? cor(v) : "var(--gold)"}">
    <p class="eyebrow">Fim do trajeto ${f.trajeto || ""}</p>
    ${v >= 0 ? `<h1 class="teamname">${esc(T(v).nome)}</h1><p>venceu este trajeto com <b class="num">${rs(f.pontos[v])}</b>!</p>` : `<h1 class="teamname">Empate!</h1><p>Os dois times terminaram com o mesmo valor.</p>`}
    <div class="champ">${[0, 1].map((i) => `<div class="tm" style="--team:${cor(i)}"><span>${esc(T(i).nome)}</span><strong class="num">${rs(f.pontos[i])}</strong><span>${T(i).trajetos} ${T(i).trajetos === 1 ? "trajeto vencido" : "trajetos vencidos"} no campeonato</span></div>`).join("")}</div>
    <div class="stack">
      <button class="btn gold big" data-a="novoTrajeto">Novo trajeto</button>
      <button class="btn link" data-a="inicio">Voltar ao início</button>
    </div>
  </div>`;
}
function novoTrajeto() {
  fecharFolha(); pararRelogio(); clearTimeout(BT.id);
  S.times.forEach((t) => { t.pontos = 0; t.aj = AJUDAS(); });
  S.trajeto++; S.quemComeca = 1 - S.quemComeca; S.jogando = false; S.atual = null; S.degrau = 0; S.fim = null;
  S.tela = "inicio"; salvar(); render(); window.scrollTo(0, 0);
}
function pedirZerar() {
  folha(`<h2>Zerar o campeonato?</h2><p class="center muted">Os trajetos vencidos e o placar voltam a zero. As perguntas da turma continuam guardadas.</p>
    <button class="btn gold" data-a="zerar">Sim, zerar tudo</button>
    <button class="btn ghost" data-a="fechar">Cancelar</button>`, { fora: () => {} });
}
function zerar() {
  const k = S;
  S = novoEstado();
  Object.assign(S, { minhas: k.minhas, usadas: k.usadas, usadasMini: k.usadasMini, tempo: k.tempo, som: k.som, voz: k.voz });
  S.times.forEach((t, i) => (t.nome = k.times[i].nome));
  fecharFolha(); salvar(); render(); toast("Campeonato zerado");
}

/* ================== PERGUNTAS DA TURMA ================== */
function telaMinhas() {
  const lista = S.minhas.map((m, k) => `<div class="it"><p>${esc(m.q)}<br><small>✓ ${esc(m.r[0])}</small></p><button data-a="apagarMinha" data-k="${k}" aria-label="Apagar pergunta">Apagar</button></div>`).join("");
  return `<div class="screen">
    <p class="eyebrow">Show da Travessia</p>
    <h1 style="font-size:40px;color:var(--gold)">Perguntas da turma</h1>
    <p class="muted">Crie perguntas sobre a própria Caravana: quem é quem, o que aconteceu nos dias, curiosidades dos viajantes. Elas entram no sorteio do Show da Travessia e ficam guardadas neste celular.</p>
    <form class="card" id="formMinha">
      <div class="field"><label for="mq">Pergunta</label><textarea id="mq" required maxlength="200" placeholder="Ex.: Quantos países a Vivian já visitou?"></textarea></div>
      <div class="field"><label for="mr0">Resposta certa</label><input id="mr0" required maxlength="80" autocomplete="off"></div>
      <div class="field"><label for="mr1">Resposta errada 1</label><input id="mr1" required maxlength="80" autocomplete="off"></div>
      <div class="field"><label for="mr2">Resposta errada 2</label><input id="mr2" required maxlength="80" autocomplete="off"></div>
      <div class="field"><label for="mr3">Resposta errada 3</label><input id="mr3" required maxlength="80" autocomplete="off"></div>
      <div class="field"><label for="mn">Dificuldade</label><select id="mn"><option value="1">Fácil (₹1 mil a ₹10 mil)</option><option value="2" selected>Média (₹50 mil a ₹250 mil)</option><option value="3">Difícil (₹500 mil e ₹1 milhão)</option></select></div>
      <button class="btn gold" type="submit">Guardar pergunta</button>
    </form>
    ${S.minhas.length ? `<section class="stack"><h2>Guardadas (${S.minhas.length})</h2><div class="mine">${lista}</div></section>` : `<p class="muted">Nenhuma pergunta da turma ainda.</p>`}
    <button class="btn soft" data-a="inicio">Voltar ao início</button>
  </div>`;
}
function apagarMinha(k) {
  S.usadas = S.usadas.filter((id) => !id.startsWith("m"));
  S.minhas.splice(k, 1); salvar(); render();
}

/* ================== FOLHAS (pop-ups) ================== */
let folhaAberta = null, contaFolha = null;
function folha(html, opts = {}) {
  fecharFolha();
  const w = document.createElement("div");
  w.className = "sheet-wrap"; w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  if (opts.fora) w.addEventListener("click", (e) => { if (e.target === w) { fecharFolha(); opts.fora(); } });
  document.body.appendChild(w); folhaAberta = w;
  const b = w.querySelector("button"); if (b) b.focus({ preventScroll: true });
}
function fecharFolha() { if (folhaAberta) { folhaAberta.remove(); folhaAberta = null; } clearInterval(contaFolha); }
function contagem(seg, el, fim) {
  clearInterval(contaFolha); let n = seg; el.textContent = n;
  contaFolha = setInterval(() => {
    n--; el.textContent = Math.max(n, 0); el.classList.toggle("hot", n <= 5);
    if (n > 0) SOM.tiqueForte(n);
    if (n <= 0) { clearInterval(contaFolha); SOM.errada(); fim && fim(); }
  }, 1000);
}
function toast(t) {
  const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d);
  setTimeout(() => d.remove(), 1800);
}
function lerConfig() {
  const t0 = document.getElementById("t0"), t1 = document.getElementById("t1");
  if (t0) T(0).nome = t0.value.trim() || "Time 1";
  if (t1) T(1).nome = t1.value.trim() || "Time 2";
  const tm = document.getElementById("tm"); if (tm) S.tempo = +tm.value;
}

/* ================== CLIQUES ================== */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, p = b.dataset.p !== undefined ? +b.dataset.p : null;
  switch (a) {
    case "comecar": comecar(); break;
    case "roleta": roleta(); break;
    case "valendo": valendo(); break;
    case "marcar": marcar(p); break;
    case "confirmar": confirmar(); break;
    case "desmarcar": desmarcar(); break;
    case "continuar": fecharFolha(); proxima(); break;
    case "parar": parar(); break;
    case "pedirParar": pedirParar(); break;
    case "naoParar": fecharFolha(); pausar(false); break;
    case "passar": passar(); break;
    case "roubar": roubar(p); break;
    case "aj-cartas": ajCartas(); break;
    case "aj-guru": ajGuru(); break;
    case "aj-voz": ajVoz(); break;
    case "aj-pular": ajPular(); break;
    case "virar": virar(b); break;
    case "votar": votos[p]++; SOM.clique(); pintarVotos(); break;
    case "desvotar": votos[p] = Math.max(0, votos[p] - 1); pintarVotos(); break;
    case "voltarJogo": voltarJogo(); break;
    case "menu": menu(); break;
    case "sairQuiz": sairMini(); break;
    case "tSom": lerConfig(); S.som = !S.som; salvar(); render(); break;
    case "tVoz": lerConfig(); S.voz = !S.voz; salvar(); render(); break;
    case "tSomM": S.som = !S.som; salvar(); menu(); break;
    case "tVozM": S.voz = !S.voz; salvar(); menu(); break;
    case "mmAcerto": mmAcerto(); break;
    case "mmPular": mmPular(); break;
    case "dzTrocar": DZ.carta = tirar(DESENHO, "desenho"); SOM.carta(); render(); break;
    case "dzDesenhar": dzDesenhar(); break;
    case "dzCor": DZ.cor = b.dataset.c; document.querySelectorAll(".pen").forEach((x) => x.classList.toggle("on", x === b)); break;
    case "dzDesfazer": DZ.traços.pop(); redesenhar(); break;
    case "dzLimpar": DZ.traços = []; redesenhar(); break;
    case "dzEspiar": {
      const pp = document.getElementById("papel"); if (!pp || pp.querySelector(".peek")) break;
      const d = document.createElement("div"); d.className = "peek"; d.textContent = DZ.carta.palavra; pp.appendChild(d);
      setTimeout(() => d.remove(), 1800); break;
    }
    case "dzAcerto": dzAcerto(p); break;
    case "dzRoubo": dzRoubo(p === 1); break;
    case "btTrocar": BT.cat = tirar(BATATA, "batata").palavra; SOM.carta(); render(); break;
    case "btAcender": btAcender(); break;
    case "btPassa": btPassa(); break;
    case "btTravou": BT.explode = 0; explodir(); break;
    case "ctCantou": ctCantou(p); break;
    case "sairMini": sairMini(); break;
    case "pedirFim": pedirFim(); break;
    case "encerrar": encerrar(); break;
    case "novoTrajeto": novoTrajeto(); break;
    case "pedirZerar": lerConfig(); pedirZerar(); break;
    case "zerar": zerar(); break;
    case "fechar": fecharFolha(); pausar(false); break;
    case "minhas": lerConfig(); S.tela = "minhas"; salvar(); render(); window.scrollTo(0, 0); break;
    case "apagarMinha": apagarMinha(+b.dataset.k); break;
    case "inicio": fecharFolha(); pararRelogio(); clearTimeout(BT.id); S.tela = "inicio"; salvar(); render(); window.scrollTo(0, 0); break;
  }
});
document.addEventListener("change", (e) => { if (["t0", "t1", "tm"].includes(e.target.id)) { lerConfig(); salvar(); } });
document.addEventListener("submit", (e) => {
  if (e.target.id !== "formMinha") return;
  e.preventDefault();
  const v = (id) => document.getElementById(id).value.trim();
  const m = { q: v("mq"), r: [v("mr0"), v("mr1"), v("mr2"), v("mr3")], nivel: +v("mn") };
  if (!m.q || m.r.some((x) => !x)) return;
  S.minhas.push(m); salvar(); render(); toast("Pergunta guardada");
});
window.addEventListener("resize", () => { if (S.tela === "desenho" && DZ.fase === "desenho") montarPapel(); });

/* ================== CONFETE ================== */
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let pedacos = [], animando = false;
function confete(muito, time) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const css = getComputedStyle(document.documentElement), g = (n) => css.getPropertyValue(n).trim();
  const cores = time === undefined ? [g("--gold"), g("--gold-soft"), g("--t0"), g("--t1"), g("--ink")]
    : [g("--gold"), g("--gold-soft"), g("--t" + time), g("--t" + time), g("--ink")];
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const n = muito ? 260 : 110;
  for (let i = 0; i < n; i++) pedacos.push({
    x: Math.random() * cv.width, y: -Math.random() * cv.height * 0.5, w: (6 + Math.random() * 8) * devicePixelRatio, h: (8 + Math.random() * 10) * devicePixelRatio,
    vy: (2 + Math.random() * 4) * devicePixelRatio, vx: (Math.random() - 0.5) * 3 * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cores[i % cores.length],
  });
  if (!animando) { animando = true; requestAnimationFrame(passo); }
}
function passo() {
  cx.clearRect(0, 0, cv.width, cv.height);
  pedacos = pedacos.filter((p) => p.y < cv.height + 40);
  for (const p of pedacos) {
    p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); cx.restore();
  }
  if (pedacos.length) requestAnimationFrame(passo); else { animando = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

/* ================== INÍCIO ================== */
function boot(d) {
  if (d && d.S) S = Object.assign(novoEstado(), d.S); else carregar();
  if (S.atual && S.atual.estado === "suspense") { S.atual.estado = ""; S.atual.marcada = null; }
  // ao reabrir, os jogos de tempo não continuam sozinhos: volta para o início com o placar guardado
  if (!["inicio", "fim", "minhas"].includes(S.tela)) S.tela = "inicio";
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
