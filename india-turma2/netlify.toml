# Site da Caravana do Céu · TURMA 2 (caravanaindiaturma2.netlify.app)
# No Netlify, este site usa a pasta india-turma2 como "Base directory".
[build]
  publish = "app"
  # Cada publicação gasta créditos do Netlify: só publica quando a mensagem do commit tiver [publicar-turma2].
  # O [publicar] da Turma 1 não publica este site, e o [publicar-turma2] não publica o site da Turma 1.
  ignore = "git log -1 --pretty=%B | grep -qF '[publicar-turma2]' && exit 1 || exit 0"
[build.environment]
  # a apiKey do Firebase no config.js é pública (identifica o banco, não abre nada sem login):
  # avisa a verificação de segredos da Netlify para não barrar a publicação por causa dela
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAq5lqUHmm8yu7pyDowLnpyO-Dv1bJWzsA"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]
[[headers]]
  for = "/versao.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
# Login do Google pelo próprio endereço do app (o iPhone bloqueia o login quando ele volta de outro site)
[[redirects]]
  from = "/__/auth/*"
  to = "https://caravana2-1a1fd.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/__/firebase/*"
  to = "https://caravana2-1a1fd.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true
# Bilhete de embarque de cada viajante: /embarque/ana-paula/07 abre a mesma página com o nome
[[redirects]]
  from = "/embarque/*"
  to = "/embarque.html"
  status = 200
