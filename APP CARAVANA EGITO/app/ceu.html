<title>O Céu de Nut</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#070A16;color:var(--papel);font:14px/1.5 var(--f-ui);user-select:none;-webkit-user-select:none}
#fundo{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 120%,#24305A 0%,#0E1430 45%,#060914 100%)}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
video.on{opacity:.75}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}

.topo h1{margin:2px 0 0;font:500 24px/1.1 var(--f-tit);color:#F6E6BF;letter-spacing:.04em}
.topo p{margin:4px 0 0;font:italic 13px var(--f-txt);color:#CFC2A2}
.base{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:10px 12px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:linear-gradient(rgba(6,9,20,0),rgba(6,9,20,.92) 40%)}

<script>
const $ = id => document.getElementById(id);
const RAD = Math.PI / 180, DEG = 180 / Math.PI;

};
// estrelas com história própria (ao tocar)

  "Sírius": ["Sopdet", "Sírius · Ísis", "A estrela mais brilhante do céu. Sopdet era a deusa da estrela que trazia a cheia do Nilo e o ano-novo egípcio."],
