<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>O Segredo do Velho Mundo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Special+Elite&display=swap">
<style>
/* O gibi da Caravana: um gibi de papel na mesa, folheado com o dedo (a página vira pela lombada esquerda) */
:root{
  --mesa:#1F160D; --papel:#E9D6A8; --tinta:#1E140B; --ouro:#E9B949; --vermelho:#B5402A;
  --f-gibi:"Bangers",Impact,"Arial Narrow",sans-serif; --f-nota:"Special Elite","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--mesa);color:var(--papel);overflow:hidden;font:15px/1.4 var(--f-nota);user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% 40%,rgba(30,20,11,.45) 0%,rgba(18,12,6,.85) 75%),linear-gradient(rgba(18,12,6,.35),rgba(18,12,6,.35)),url(img/fundo-livro-portas.webp) center/cover #120C06}
.palco{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.topo{width:min(100%,520px);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.topo button{border:0;background:none;color:#C8B48A;font:14px var(--f-nota);padding:6px 2px;cursor:pointer}
.topo button:disabled{opacity:.25}
.pag{font:20px var(--f-gibi);letter-spacing:.06em;color:var(--ouro);text-shadow:2px 2px 0 var(--tinta)}
.simb{display:flex;align-items:center;gap:6px;color:#C8B48A;font-size:12px}
.simb svg{width:30px;height:28px}

/* o livro */
.livro{position:relative;height:min(84vh,calc((100vw - 12px) * 1.4));aspect-ratio:1/1.4;perspective:2200px;touch-action:none}
.folha{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;will-change:transform}
.folha.anima{transition:transform .75s cubic-bezier(.25,.8,.25,1)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:2px 6px 6px 2px;
  background:#1F160D;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#1F160D}
.face.verso{transform:rotateY(180deg);background:
  radial-gradient(ellipse at 40% 50%,rgba(120,80,30,.12),transparent 60%),
  repeating-linear-gradient(0deg,rgba(90,60,20,.05) 0 1px,transparent 1px 4px),#E2CC9B;border-radius:6px 2px 2px 6px}
.face.verso::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 70%,rgba(0,0,0,.18))}
/* lombada: sombra do vinco perto da borda esquerda e luz que corre durante a virada */
.face.frente::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(0,0,0,.08) 4%,transparent 9%)}
.face .luz{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent 30%,rgba(255,240,200,.25) 60%,rgba(0,0,0,.25))}
.folha.virando .luz{opacity:1}
.pilha{position:absolute;inset:0;border-radius:2px 6px 6px 2px;background:#1F160D;box-shadow:0 20px 50px rgba(0,0,0,.6)}

/* enigmas sobre a página do Dia 1 */
.alvo{position:absolute;z-index:4;border:0;background:transparent;cursor:pointer;border-radius:4px}
.alvo::after{content:"TOQUE PARA DECIFRAR";position:absolute;left:50%;bottom:6%;transform:translateX(-50%);white-space:nowrap;
  font:clamp(9px,2.4vw,12px)/1 var(--f-gibi);letter-spacing:.08em;color:var(--tinta);background:var(--ouro);padding:4px 6px 2px;border:2px solid var(--tinta);animation:pisca 1.8s ease-in-out infinite}
.alvo.ok::after{content:none}
.alvo .carimbo{position:absolute;pointer-events:none;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0;
  font:clamp(16px,5vw,26px)/1 var(--f-gibi);letter-spacing:.06em;color:var(--vermelho);border:3px double var(--vermelho);padding:4px 8px 2px;background:rgba(233,214,168,.85)}
.alvo.ok .carimbo{animation:carimba .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes carimba{to{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
@keyframes pisca{50%{opacity:.45}}
.dica{font:12px var(--f-nota);color:#C8B48A;text-align:center;min-height:1.3em;margin:0;flex:1;animation:pisca 2.4s ease-in-out infinite}
.setas{width:min(100%,520px);display:flex;align-items:center;gap:8px}
.setas button{font:17px/1 var(--f-gibi);letter-spacing:.06em;color:var(--tinta);background:var(--ouro);border:2px solid #000;box-shadow:3px 3px 0 #000;padding:9px 12px 7px;cursor:pointer;flex:none}
.setas button:disabled{opacity:.25;box-shadow:none}
.setas button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}

/* janela do enigma */
.janela{position:fixed;inset:0;z-index:20;display:grid;place-items:end center;background:rgba(10,6,2,.55);padding:16px}
.janela[hidden]{display:none}
.caixa{width:min(100%,460px);background:var(--papel);color:var(--tinta);border:4px solid var(--tinta);box-shadow:6px 6px 0 var(--tinta);padding:16px;display:flex;flex-direction:column;gap:10px;
  margin-bottom:max(10px,env(safe-area-inset-bottom));animation:sobe .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
.caixa h2{margin:0;font:400 26px/1 var(--f-gibi);letter-spacing:.05em;color:var(--vermelho)}
.caixa p{margin:0;font:600 16px/1.35 "Arial Narrow",var(--f-nota)}
.op{font:21px/1 var(--f-gibi);letter-spacing:.05em;color:var(--tinta);background:#F3E3BA;border:3px solid var(--tinta);box-shadow:4px 4px 0 var(--tinta);padding:11px 12px 9px;text-align:left;cursor:pointer}
.op:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--tinta)}
.op.erro{background:#D9A99A;animation:treme .4s}
.op.certa{background:var(--ouro)}
@keyframes treme{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.caixa .msg{min-height:1.3em;font:13px var(--f-nota);color:#6B4A20}
.fecha{align-self:flex-end;border:0;background:none;font:14px var(--f-nota);color:#6B4A20;cursor:pointer}

/* última página: contracapa */
.contra{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,#3B2A17,#1A120A);color:var(--papel)}
.contra h2{margin:0;font:400 clamp(28px,8vw,40px)/1 var(--f-gibi);letter-spacing:.04em;color:var(--ouro);text-shadow:3px 3px 0 #000}
.contra p{margin:0;max-width:28ch}
.contra .grande svg{width:96px;height:90px;filter:drop-shadow(0 0 14px rgba(233,185,73,.6))}
.contra button{font:22px/1 var(--f-gibi);letter-spacing:.06em;color:var(--tinta);background:var(--ouro);border:3px solid #000;box-shadow:5px 5px 0 #000;padding:13px 18px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.folha.anima{transition-duration:.01s}}
</style>
</head><body>
<div class="palco">
  <div class="topo">
    <button id="volta" type="button">‹ voltar</button>
    <span class="simb" title="Cada enigma acende uma parte do símbolo"><svg viewBox="0 0 60 56" aria-hidden="true" id="simbolo"></svg><span id="pecas">0 de 3</span></span>
    <span class="pag" id="pag">CAPA</span>
  </div>
  <div class="livro" id="livro"><div class="pilha"></div></div>
  <div class="setas"><button type="button" id="ant" aria-label="Página anterior">‹ anterior</button><p class="dica" id="dica"></p><button type="button" id="prox" aria-label="Próxima página">próxima ›</button></div>
</div>
<div class="janela" id="janela" hidden><div class="caixa" role="dialog" aria-modal="true" aria-labelledby="enigma-t">
  <h2 id="enigma-t">Enigma</h2><p id="enigma-p"></p><div id="enigma-ops" style="display:grid;gap:8px"></div>
  <p class="msg" id="enigma-msg" aria-live="polite"></p><button class="fecha" type="button" id="fecha">fechar</button>
</div></div>
<script>
// páginas do gibi (as imagens ficam em img/gibi/); a do Dia 1 tem os três enigmas por cima dos quadros
const PAGINAS = [
  { img: "img/gibi/p01-capa.webp", nome: "CAPA" },
  { img: "img/gibi/p02-capitulo-1.webp", nome: "CAPÍTULO 1" },
  { img: "img/gibi/p03-capitulo-2.webp", nome: "CAPÍTULO 2" },
  { img: "img/gibi/p04-dia-1.webp", nome: "DIA 1 · CAIRO", enigmas: true },
  { contra: true, nome: "FIM DO DIA 1" }
];
// quadros dos enigmas na página do Dia 1 (em % da página) e as respostas (a primeira é a certa)
const ENIGMAS = [
  { box: [1.2, 49.6, 32.5, 18.6], p: "O que voa sem asas, brilha sem ser fogo e aquece sem tocar?", ops: ["O Sol", "A Lua", "O vento"], dica: "Olhe o último hieróglifo do quadro: um círculo." },
  { box: [33.4, 49.6, 31.7, 18.6], p: "Sou porta sem ser madeira, sou chave sem abrir nada. O que sou?", ops: ["O ankh, a chave da vida", "Uma pirâmide", "Um escaravelho"], dica: "É o primeiro símbolo do quadro." },
  { box: [66.1, 49.6, 33.3, 18.6], p: "Quanto mais tira, mais deixa pra trás. O que é?", ops: ["Os passos", "A areia", "O tempo"], dica: "Quem caminha pelo deserto deixa marcas." }
];
const $ = id => document.getElementById(id), livro = $("livro");
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [x, v] of Object.entries(a)) x === "class" ? e.className = v : x.startsWith("on") ? e[x] = v : e.setAttribute(x, v); e.append(...k); return e; };
const resolvidos = new Set();
let lidas = 0; // quantas folhas já viraram

// o símbolo da Caravana desenhado em três partes que acendem com os enigmas
const SIMB = ["M30 4 V52 M16 6 L30 22 L44 6", "M8 26 H24 M8 32 H24 M30 30 L40 20 L46 30 L56 22", "M30 40 L22 48 M30 40 L38 48 M30 40 L20 40 M30 40 L40 40 M30 40 L30 52"];
function pintaSimbolo() {
  $("simbolo").innerHTML = SIMB.map((d, i) => `<path d="${d}" fill="none" stroke="${i < resolvidos.size ? "#E9B949" : "#5E4E36"}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
  $("pecas").textContent = resolvidos.size + " de 3";
  const g = document.querySelector(".contra .grande svg"); if (g) g.innerHTML = $("simbolo").innerHTML;
}

// som de papel virando (ruído filtrado), só depois do primeiro toque
let audio = null;
function somPapel() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume();
    const n = audio.sampleRate * .35, b = audio.createBuffer(1, n, audio.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) { const t = i / n; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2) * (t < .08 ? t / .08 : 1); }
    const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = .7; g.gain.value = .35; s.buffer = b; s.connect(f); f.connect(g); g.connect(audio.destination); s.start();
  } catch (e) {}
}

// monta as folhas: a primeira página fica por cima de todas
const folhas = PAGINAS.map((p, i) => {
  const frente = el("div", { class: "face frente" });
  if (p.contra) frente.append(el("div", { class: "contra" },
    el("span", { class: "grande" }, el("span", {})),
    el("h2", { id: "contra-t" }, "Continua amanhã…"),
    el("p", { id: "contra-p" }, "Decifre os três enigmas do Dia 1 para acender o símbolo da Caravana."),
    el("button", { type: "button", id: "contra-b", hidden: "", onclick: e => { e.stopPropagation(); e.currentTarget.textContent = "EM BREVE: O MAPA DA JORNADA"; } }, "ABRIR O MAPA DA JORNADA")));
  else frente.append(el("img", { src: p.img, alt: p.nome, draggable: "false", decoding: "async" }));
  if (p.enigmas) ENIGMAS.forEach((q, k) => {
    const b = el("button", { class: "alvo", type: "button", "aria-label": "Enigma " + (k + 1), style: `left:${q.box[0]}%;top:${q.box[1]}%;width:${q.box[2]}%;height:${q.box[3]}%` }, el("span", { class: "carimbo" }, "DECIFRADO!"));
    b.addEventListener("pointerdown", e => e.stopPropagation());
    b.onclick = e => { e.stopPropagation(); abreEnigma(k, b); };
    frente.append(b);
  });
  frente.append(el("span", { class: "luz" }));
  const f = el("div", { class: "folha" }, frente, el("div", { class: "face verso" }, el("span", { class: "luz" })));
  f.style.zIndex = String(PAGINAS.length - i);
  livro.append(f); return f;
});
document.querySelector(".contra .grande span").replaceWith(document.createElementNS("http://www.w3.org/2000/svg", "svg"));
document.querySelector(".contra .grande svg").setAttribute("viewBox", "0 0 60 56");
pintaSimbolo();

function pos(i, giro, anima) {
  const f = folhas[i]; f.classList.toggle("anima", !!anima); f.classList.toggle("virando", giro !== 0 && giro !== -180);
  f.style.transform = `rotateY(${giro}deg)`;
  // a folha virada passa para trás das que ainda não viraram
  f.style.zIndex = anima === false && giro > -180 && giro < 0 ? "99" : giro <= -90 ? String(i + 1) : String(PAGINAS.length - i + 10);
}
function mostra() {
  folhas.forEach((f, i) => pos(i, i < lidas ? -180 : 0, true));
  $("pag").textContent = PAGINAS[lidas].nome; $("volta").disabled = $("ant").disabled = lidas === 0; $("prox").disabled = lidas === PAGINAS.length - 1;
  $("dica").textContent = PAGINAS[lidas].enigmas && resolvidos.size < 3 ? "Toque nos quadros dos enigmas para decifrar" : "";
}
function vira(dir) {
  const n = lidas + dir; if (n < 0 || n > PAGINAS.length - 1) return mostra();
  lidas = n; somPapel(); mostra();
}
$("volta").onclick = $("ant").onclick = () => vira(-1); $("prox").onclick = () => vira(1);

// arrastar com o dedo: a página acompanha; passando da metade, vira
let ini = null;
livro.addEventListener("pointerdown", e => { ini = { x: e.clientX, t: Date.now(), w: livro.clientWidth }; livro.setPointerCapture(e.pointerId); });
livro.addEventListener("pointermove", e => {
  if (!ini) return; const dx = e.clientX - ini.x;
  if (dx < 0 && lidas < PAGINAS.length - 1) pos(lidas, Math.max(-180, dx / ini.w * 180), false);
  else if (dx > 0 && lidas > 0) pos(lidas - 1, Math.min(0, -180 + dx / ini.w * 180), false);
});
const solta = e => {
  if (!ini) return; const dx = e.clientX - ini.x, rapido = Date.now() - ini.t < 300 && Math.abs(dx) > 30; ini = null;
  if (Math.abs(dx) < 8) { if (e.clientX - livro.getBoundingClientRect().left > livro.clientWidth * .5) vira(1); else vira(-1); return; }
  if (dx < 0 && (dx < -ini_w() * .35 || rapido)) vira(1); else if (dx > 0 && (dx > ini_w() * .35 || rapido)) vira(-1); else mostra();
};
const ini_w = () => livro.clientWidth;
livro.addEventListener("pointerup", solta); livro.addEventListener("pointercancel", solta);
addEventListener("keydown", e => { if (e.key === "ArrowRight") vira(1); if (e.key === "ArrowLeft") vira(-1); if (e.key === "Escape") $("janela").hidden = true; });

function abreEnigma(k, alvo) {
  if (resolvidos.has(k)) return;
  const q = ENIGMAS[k], ops = q.ops.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
  $("enigma-t").textContent = "Enigma " + (k + 1); $("enigma-p").textContent = q.p; $("enigma-msg").textContent = "";
  $("enigma-ops").replaceChildren(...ops.map(o => el("button", { type: "button", class: "op", onclick: e => {
    const b = e.currentTarget;
    if (o === q.ops[0]) {
      b.classList.add("certa"); resolvidos.add(k); alvo.classList.add("ok"); pintaSimbolo(); $("enigma-msg").textContent = "Uma parte do símbolo acendeu.";
      try { navigator.vibrate && navigator.vibrate([30, 40, 60]); } catch (x) {}
      if (resolvidos.size === 3) { $("contra-t").textContent = "O mapa está nas suas mãos"; $("contra-p").textContent = "Os três enigmas acenderam o símbolo da Caravana. Amanhã, a jornada começa de verdade."; $("contra-b").hidden = false; }
      setTimeout(() => { $("janela").hidden = true; mostra(); }, 1100);
    } else { b.classList.remove("erro"); void b.offsetWidth; b.classList.add("erro"); $("enigma-msg").textContent = q.dica; try { navigator.vibrate && navigator.vibrate(80); } catch (x) {} }
  } }, o)));
  $("janela").hidden = false;
}
$("fecha").onclick = () => { $("janela").hidden = true; };
$("janela").onclick = e => { if (e.target === $("janela")) $("janela").hidden = true; };
mostra();
</script>
</body></html>
