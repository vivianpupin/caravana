<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5EFE4">
<title>Achado de Passagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F5EFE4; --panel:#FFFCF7; --panel2:#FBF6EE; --panel3:#EFE6D6;
  --ink:#282722; --soft:#6B6556; --faint:#9A917F;
  --moss:#3F4938; --terra:#8A3F32; --gold:#A8843E; --ok:#3F6B3A; --err:#A0402F;
  --line:rgba(40,39,34,.10); --line2:rgba(40,39,34,.18);
  --shadow:0 1px 2px rgba(40,39,34,.05),0 8px 28px rgba(40,39,34,.07);
  --display:"Lora",Georgia,serif; --ui:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.2;text-wrap:balance}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:28px 0 18px}
header h1{font-size:30px}
header p{margin:6px 0 0;color:var(--soft)}
.aviso{background:#FFF4D6;border:1px solid #E9D49A;color:#5E4A12;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.busca{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:14px}
label.campo{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--soft)}
select,input[type=date]{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--panel2);font-size:16px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel3);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:40px;font-size:14px;font-weight:500;color:var(--soft);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--moss)}
.botao{border:0;border-radius:14px;background:var(--moss);color:#FFFCF7;min-height:52px;font-weight:600;font-size:16px;cursor:pointer}
.botao:disabled{opacity:.6}
.oculto{display:none!important}
.topo-res{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.topo-res h2{font-size:22px}
.topo-res small{display:block;color:var(--soft);font-size:13px;font-family:var(--ui)}
.filtros{display:flex;gap:6px}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.lista{display:grid;gap:10px}
.voo{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(40,39,34,.04)}
.voo:hover{border-color:var(--line2)}
.bandeira{font-size:28px;line-height:1}
.voo h3{font-size:18px}
.voo .info{color:var(--soft);font-size:13px;margin-top:2px}
.preco{text-align:right;white-space:nowrap}
.preco b{display:block;font-size:20px;font-weight:600}
.preco span{font-size:11.5px;color:var(--faint)}
.selo{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:2px;font-family:var(--ui)}
.selo.menor{background:#E3EDDC;color:var(--ok)}
.selo.oferta{background:#F6E2DA;color:var(--terra)}
.vazio,.carregando{color:var(--soft);text-align:center;padding:30px 10px}
.erro{color:var(--err)}
/* detalhe do destino */
.fundo{position:fixed;inset:0;background:rgba(30,26,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.folha{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px 28px}
@media(min-width:760px){.fundo{align-items:center}.folha{border-radius:22px}}
.folha-topo{display:flex;justify-content:space-between;align-items:start;gap:10px}
.folha-topo h2{font-size:24px}
.folha-topo p{margin:2px 0 0;color:var(--soft);font-size:13.5px}
.fechar{border:0;background:var(--panel3);border-radius:99px;width:38px;height:38px;font-size:20px;cursor:pointer;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:16px 0 6px}
.cal .sem{font-size:11px;color:var(--faint);text-align:center;font-weight:500}
.dia{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:54px;padding:4px 2px;display:grid;align-content:center;justify-items:center;gap:1px;cursor:pointer;font-size:12px}
.dia b{font-size:13px;font-weight:600}
.dia small{font-size:10.5px;color:var(--soft)}
.dia.sem-preco{background:transparent;cursor:default;color:var(--faint)}
.dia.barato{background:#E3EDDC;border-color:#BCD3AE}
.dia.barato small{color:var(--ok);font-weight:600}
.dia[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:-1px}
.legenda{font-size:12px;color:var(--soft);margin-bottom:14px}
.escolhido{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.escolhido .linha{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.escolhido .valor{font-size:26px;font-weight:600}
.lojas{display:grid;gap:8px}
.lojas a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--panel2);font-weight:500}
.lojas a.principal{background:var(--terra);color:#FFFCF7;border-color:var(--terra)}
.nota{font-size:12px;color:var(--faint);margin:4px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Achado de Passagens</h1>
    <p>Escolha de onde sai e quando. O app mostra os destinos mais baratos.</p>
  </header>

  <div class="aviso oculto" id="aviso">Estes preços são <b>de exemplo</b>: ainda falta ligar a chave do Travelpayouts no Netlify. O app funciona igual, mas os valores são inventados.</div>

  <form class="busca" id="busca">
    <label class="campo">Saindo de
      <select id="origem"></select>
    </label>
    <div class="seg" role="group" aria-label="Tipo de viagem">
      <button type="button" data-viagem="ida-volta" aria-pressed="true">Ida e volta</button>
      <button type="button" data-viagem="so-ida" aria-pressed="false">Só ida</button>
    </div>
    <div class="seg" role="group" aria-label="Datas">
      <button type="button" data-quando="mes" aria-pressed="true">Mês inteiro</button>
      <button type="button" data-quando="datas" aria-pressed="false">Datas exatas</button>
    </div>
    <div id="quando-mes" class="dupla">
      <label class="campo">Ida em
        <select id="mes-ida"></select>
      </label>
      <label class="campo" id="campo-mes-volta">Volta em
        <select id="mes-volta"></select>
      </label>
    </div>
    <div id="quando-datas" class="dupla oculto">
      <label class="campo">Ida
        <input type="date" id="data-ida">
      </label>
      <label class="campo" id="campo-data-volta">Volta
        <input type="date" id="data-volta">
      </label>
    </div>
    <label class="check"><input type="checkbox" id="direto"> Só voos diretos (sem parada)</label>
    <button class="botao" id="buscar">Buscar destinos mais baratos</button>
  </form>

  <section id="resultado" class="oculto">
    <div class="topo-res">
      <h2 id="titulo-res">Destinos mais baratos<small></small></h2>
      <div class="filtros" role="group" aria-label="Filtrar destinos">
        <button class="chip" data-filtro="todos" aria-pressed="true">Todos</button>
        <button class="chip" data-filtro="brasil" aria-pressed="false">Brasil</button>
        <button class="chip" data-filtro="exterior" aria-pressed="false">Exterior</button>
      </div>
    </div>
    <div class="lista" id="lista"></div>
  </section>
</div>

<div class="fundo oculto" id="fundo">
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="det-titulo">
    <div class="folha-topo">
      <div><h2 id="det-titulo"></h2><p id="det-sub"></p></div>
      <button class="fechar" id="fechar" aria-label="Fechar">×</button>
    </div>
    <div id="det-corpo"></div>
  </div>
</div>

<script type="module">
import { CIDADES, CIAS } from "./cidades.js";

const $ = s => document.querySelector(s);
const API = "/.netlify/functions/ofertas";
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const MESES_LONGOS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const PAISES = new Intl.DisplayNames(["pt-BR"], { type: "region" });
const real = n => "R$ " + n.toLocaleString("pt-BR");
const bandeira = p => p ? String.fromCodePoint(...[...p.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : "✈️";
const cidade = c => CIDADES[c] || { nome: c, pais: "" };
const pais = p => { try { return p ? PAISES.of(p) : ""; } catch { return ""; } };
const dataCurta = d => d ? +d.slice(8, 10) + " " + MESES[+d.slice(5, 7) - 1] : "";
const paradas = n => n ? n + (n > 1 ? " paradas" : " parada") : "direto";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const estado = { viagem: "ida-volta", quando: "mes", filtro: "todos", voos: [], busca: null };
let lembrar = {};
try { lembrar = JSON.parse(localStorage.getItem("passagens") || "{}"); } catch {}

// ---------- formulário ----------
$("#origem").innerHTML = Object.entries(CIDADES).filter(([, c]) => c.pais === "BR")
  .sort((a, b) => a[1].nome.localeCompare(b[1].nome, "pt-BR"))
  .map(([k, c]) => `<option value="${k}">${c.nome}</option>`).join("");
$("#origem").value = lembrar.origem && CIDADES[lembrar.origem] ? lembrar.origem : "SAO";

const hoje = new Date();
const meses = Array.from({ length: 12 }, (_, i) => {
  const d = new Date(hoje.getFullYear(), hoje.getMonth() + i, 1);
  return { valor: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"), nome: MESES_LONGOS[d.getMonth()] + (d.getFullYear() !== hoje.getFullYear() ? " de " + d.getFullYear() : "") };
});
const opcoesMes = meses.map(m => `<option value="${m.valor}">${m.nome}</option>`).join("");
$("#mes-ida").innerHTML = opcoesMes;
$("#mes-volta").innerHTML = opcoesMes;
$("#mes-ida").value = meses[1].valor;
$("#mes-volta").value = meses[1].valor;
$("#mes-ida").addEventListener("change", () => { if ($("#mes-volta").value < $("#mes-ida").value) $("#mes-volta").value = $("#mes-ida").value; });

const iso = d => d.toISOString().slice(0, 10);
const amanha = new Date(hoje); amanha.setDate(hoje.getDate() + 1);
$("#data-ida").min = $("#data-volta").min = iso(amanha);
$("#data-ida").addEventListener("change", () => {
  $("#data-volta").min = $("#data-ida").value;
  if ($("#data-volta").value && $("#data-volta").value < $("#data-ida").value) $("#data-volta").value = "";
});

function alternar(grupo, valor) {
  document.querySelectorAll(`[data-${grupo}]`).forEach(b => b.setAttribute("aria-pressed", b.dataset[grupo] === valor));
}
document.querySelectorAll("[data-viagem]").forEach(b => b.onclick = () => {
  estado.viagem = b.dataset.viagem; alternar("viagem", estado.viagem);
  const soIda = estado.viagem === "so-ida";
  $("#campo-mes-volta").classList.toggle("oculto", soIda);
  $("#campo-data-volta").classList.toggle("oculto", soIda);
});
document.querySelectorAll("[data-quando]").forEach(b => b.onclick = () => {
  estado.quando = b.dataset.quando; alternar("quando", estado.quando);
  $("#quando-mes").classList.toggle("oculto", estado.quando !== "mes");
  $("#quando-datas").classList.toggle("oculto", estado.quando !== "datas");
});
document.querySelectorAll("[data-filtro]").forEach(b => b.onclick = () => {
  estado.filtro = b.dataset.filtro; alternar("filtro", estado.filtro); mostrarLista();
});

// ---------- busca ----------
async function pedir(q) {
  const r = await fetch(API + "?" + new URLSearchParams(q));
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.erro || "Não consegui buscar os preços agora.");
  $("#aviso").classList.toggle("oculto", !j.exemplo);
  return j.voos;
}

$("#busca").addEventListener("submit", async ev => {
  ev.preventDefault();
  const soIda = estado.viagem === "so-ida";
  const q = { tipo: "destinos", origem: $("#origem").value };
  if (estado.quando === "mes") {
    q.ida = $("#mes-ida").value;
    if (!soIda) q.volta = $("#mes-volta").value;
  } else {
    if (!$("#data-ida").value) return $("#data-ida").focus();
    q.ida = $("#data-ida").value;
    if (!soIda) { if (!$("#data-volta").value) return $("#data-volta").focus(); q.volta = $("#data-volta").value; }
  }
  if (soIda) q.soida = "1";
  if ($("#direto").checked) q.direto = "1";
  try { localStorage.setItem("passagens", JSON.stringify({ origem: q.origem })); } catch {}

  estado.busca = q;
  $("#resultado").classList.remove("oculto");
  $("#lista").innerHTML = `<div class="carregando">Procurando as menores tarifas…</div>`;
  $("#buscar").disabled = true;
  const quando = estado.quando === "mes" ? "em " + MESES_LONGOS[+q.ida.slice(5, 7) - 1] : "de " + dataCurta(q.ida) + (q.volta ? " a " + dataCurta(q.volta) : "");
  $("#titulo-res").innerHTML = `Destinos mais baratos<small>saindo de ${esc(cidade(q.origem).nome)}, ${quando} · ${soIda ? "só ida" : "ida e volta"}</small>`;
  try {
    estado.voos = await pedir(q);
    mostrarLista();
  } catch (e) {
    $("#lista").innerHTML = `<div class="vazio erro">${esc(e.message)}</div>`;
  } finally {
    $("#buscar").disabled = false;
    $("#resultado").scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

function mostrarLista() {
  const voos = estado.voos.filter(v => estado.filtro === "todos" || (estado.filtro === "brasil") === (cidade(v.destino).pais === "BR"));
  if (!voos.length) {
    $("#lista").innerHTML = `<div class="vazio">Nenhuma tarifa encontrada para essa busca. Tente outro mês, as datas flexíveis ou tire o "só voos diretos".</div>`;
    return;
  }
  // "oferta": bem abaixo do preço comum entre os destinos do mesmo lado (Brasil ou exterior)
  const mediana = lado => { const p = estado.voos.filter(v => (cidade(v.destino).pais === "BR") === lado).map(v => v.preco).sort((a, b) => a - b); return p[Math.floor(p.length / 2)] || 0; };
  const med = { true: mediana(true), false: mediana(false) };
  const menor = Math.min(...voos.map(v => v.preco));
  $("#lista").innerHTML = voos.map((v, i) => {
    const c = cidade(v.destino), nacional = c.pais === "BR";
    const selo = v.preco === menor ? `<span class="selo menor">Menor preço</span>`
      : v.preco <= med[nacional] * .65 ?`<span class="selo oferta">🔥 Oferta</span>` : "";
    return `<button class="voo" data-i="${estado.voos.indexOf(v)}">
      <span class="bandeira" aria-hidden="true">${bandeira(c.pais)}</span>
      <span><h3>${esc(c.nome)}${selo}</h3>
        <div class="info">${nacional ? "" : esc(pais(c.pais)) + " · "}${dataCurta(v.ida)}${v.volta ? " → " + dataCurta(v.volta) : ""} · ${paradas(v.paradas)}${v.cia ? " · " + esc(CIAS[v.cia] || v.cia) : ""}</div></span>
      <span class="preco"><b>${real(v.preco)}</b><span>${v.volta ? "ida e volta" : "só ida"}</span></span>
    </button>`;
  }).join("");
}
$("#lista").addEventListener("click", ev => {
  const b = ev.target.closest(".voo");
  if (b) abrir(estado.voos[+b.dataset.i]);
});

// ---------- destino escolhido: calendário do mês ----------
async function abrir(voo) {
  const c = cidade(voo.destino), q = estado.busca;
  $("#det-titulo").textContent = `${bandeira(c.pais)} ${c.nome}`;
  $("#det-sub").textContent = `Saindo de ${cidade(voo.origem).nome} · preço mais baixo de cada dia de ida`;
  $("#det-corpo").innerHTML = `<div class="carregando">Montando o calendário…</div>`;
  $("#fundo").classList.remove("oculto");
  document.body.style.overflow = "hidden";
  const mes = (voo.ida || q.ida).slice(0, 7);
  let dias = [];
  try {
    dias = await pedir({ tipo: "calendario", origem: voo.origem, destino: voo.destino, ida: mes, ...(q.soida ? { soida: "1" } : {}), ...(q.direto ? { direto: "1" } : {}) });
  } catch {}
  calendario(voo, mes, dias);
}

function calendario(voo, mes, dias) {
  const porDia = Object.fromEntries(dias.map(d => [d.ida.slice(0, 10), d]));
  // o voo da lista sempre aparece, mesmo se o calendário vier sem aquele dia
  if (voo.ida && !porDia[voo.ida.slice(0, 10)] && voo.ida.startsWith(mes)) porDia[voo.ida.slice(0, 10)] = voo;
  const precos = Object.values(porDia).map(d => d.preco).sort((a, b) => a - b);
  const barato = precos[Math.max(0, Math.ceil(precos.length / 4) - 1)] ?? 0;
  const [ano, m] = mes.split("-").map(Number), total = new Date(ano, m, 0).getDate(), primeiro = new Date(ano, m - 1, 1).getDay();
  let html = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"].map(s => `<div class="sem">${s}</div>`).join("") + "<div></div>".repeat(primeiro);
  for (let d = 1; d <= total; d++) {
    const k = mes + "-" + String(d).padStart(2, "0"), v = porDia[k];
    html += v ? `<button class="dia${v.preco <= barato ? " barato" : ""}" data-dia="${k}"><b>${d}</b><small>${(v.preco / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} mil</small></button>`
      : `<div class="dia sem-preco"><b>${d}</b><small>–</small></div>`;
  }
  $("#det-corpo").innerHTML = `
    <div class="cal">${html}</div>
    <div class="legenda">${MESES_LONGOS[m - 1]} de ${ano} · verde = dias mais baratos · toque num dia para ver o voo</div>
    <div id="escolhido"></div>`;
  const escolher = k => {
    document.querySelectorAll(".dia[data-dia]").forEach(b => b.setAttribute("aria-pressed", b.dataset.dia === k));
    detalhe(porDia[k]);
  };
  $("#det-corpo").querySelectorAll(".dia[data-dia]").forEach(b => b.onclick = () => escolher(b.dataset.dia));
  const inicial = voo.ida && porDia[voo.ida.slice(0, 10)] ? voo.ida.slice(0, 10) : Object.keys(porDia).sort((a, b) => porDia[a].preco - porDia[b].preco)[0];
  if (inicial) escolher(inicial);
  else $("#escolhido").innerHTML = `<div class="vazio">Sem tarifas guardadas para este mês.</div>`;
}

function detalhe(v) {
  const ida = v.ida.slice(0, 10), volta = v.volta ? v.volta.slice(0, 10) : "";
  const o = v.origem, d = v.destino, c = cidade(d);
  const google = `https://www.google.com/travel/flights?hl=pt-BR&curr=BRL&q=${encodeURIComponent(`voos de ${o} para ${d} em ${ida}${volta ? " volta " + volta : " só ida"}`)}`;
  const curta = s => s.slice(2).replaceAll("-", "");
  const sky = `https://www.skyscanner.com.br/transporte/passagens-aereas/${o.toLowerCase()}/${d.toLowerCase()}/${curta(ida)}/${volta ? curta(volta) + "/" : ""}`;
  const decolar = volta ? `https://www.decolar.com/shop/flights/results/roundtrip/${o}/${d}/${ida}/${volta}/1/0/0`
    : `https://www.decolar.com/shop/flights/results/oneway/${o}/${d}/${ida}/1/0/0`;
  $("#escolhido").innerHTML = `<div class="escolhido">
    <div class="linha"><div><div class="valor">${real(v.preco)}</div><div class="info" style="color:var(--soft);font-size:13px">${volta ? "ida e volta" : "só ida"}, por pessoa</div></div>
      <div style="text-align:right;font-size:14px">Ida ${dataCurta(ida)} às ${v.ida.slice(11, 16)}${volta ? `<br>Volta ${dataCurta(volta)}` : ""}<br><span style="color:var(--soft)">${paradas(v.paradas)}${v.cia ? " · " + esc(CIAS[v.cia] || v.cia) : ""}</span></div></div>
    <div class="lojas">
      ${v.link ? `<a class="principal" href="${esc(v.link)}" target="_blank" rel="noopener">Ver esta tarifa e comprar <span>↗</span></a>` : ""}
      <a href="${esc(google)}" target="_blank" rel="noopener">Comparar no Google Voos <span>↗</span></a>
      <a href="${esc(decolar)}" target="_blank" rel="noopener">Comparar na Decolar <span>↗</span></a>
      <a href="${esc(sky)}" target="_blank" rel="noopener">Comparar no Skyscanner <span>↗</span></a>
    </div>
    <p class="nota">Este é o menor preço encontrado recentemente para ${esc(c.nome)}. Como as tarifas mudam o tempo todo, confira o valor final no site antes de pagar.</p>
  </div>`;
}

function fechar() { $("#fundo").classList.add("oculto"); document.body.style.overflow = ""; }
$("#fechar").onclick = fechar;
$("#fundo").addEventListener("click", ev => { if (ev.target.id === "fundo") fechar(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") fechar(); });
</script>
</body>
</html>
