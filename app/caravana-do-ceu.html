<title>Caravana Índia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@400;500;600&display=swap">
<style>
/* Visual único e escuro da Travessia da Índia Sagrada. */
:root{
  color-scheme:dark;
  --bg:#0a0806; --panel:#120e0a; --panel2:#18130d; --panel3:#211a12;
  --ink:#e6dac1; --soft:#a89a82; --faint:#6f6454;
  --gold:#d6a649; --gold-lt:#ecc062; --gold-deep:#a67d33; --line:rgba(200,146,42,.15); --line2:rgba(200,146,42,.38);
  --oxblood:#c8553f; --sage:#a9b98f; --on-gold:#120e0a; --seal:#c2412f;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:400;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "main" "nav";background:var(--bg)}
.top{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(10,8,6,.92)}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.topside{display:flex;min-width:0}.topside.right{justify-content:flex-end}
.brand img{width:34px;height:auto;flex:none;filter:drop-shadow(0 0 10px rgba(200,146,42,.35))}
.brand b{display:block;font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.brand span{display:block;font-family:var(--label);font-size:10.5px;color:var(--soft);letter-spacing:.3em;text-transform:uppercase}
.me{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;font-size:11px;color:var(--soft);min-width:0;max-width:100%}
.me img{width:34px;height:34px;border-radius:50%;flex:none;background:var(--panel3);border:1px solid var(--gold-deep)}
.me b{font-family:var(--label);color:var(--gold);font-weight:600;letter-spacing:.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
.me span{display:none}
.me b{font-size:10.5px}
main{grid-area:main;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.view{padding:22px 16px 48px;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

nav.tabs{grid-area:nav;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#050403;padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--ui);font-size:12px;font-weight:400;letter-spacing:.02em;color:var(--soft);min-width:0}
nav.tabs .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:var(--ink);transition:background .2s,color .2s}
nav.tabs button svg{width:27px;height:27px}
nav.tabs button[aria-current="page"]{color:var(--gold-lt)}
nav.tabs button[aria-current="page"] .ic{background:linear-gradient(160deg,var(--gold-lt),var(--gold-deep));color:var(--on-gold);box-shadow:0 4px 18px rgba(200,146,42,.35)}
@media (min-width:900px){
  .app{grid-template-columns:210px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top top" "nav main"}
  nav.tabs{grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding:18px 10px;gap:4px}
  nav.tabs{background:var(--bg)}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:6px 8px}
}

/* tipografia de apoio */
.eyebrow{font-family:var(--label);font-size:12px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.rule{display:flex;align-items:center;gap:12px}
.rule::after{content:"";flex:1;height:1px;background:var(--line)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:clamp(28px,6vw,38px);font-weight:300;letter-spacing:.02em}
.lede{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.5;color:var(--soft);max-width:60ch}
.small{font-size:13px;color:var(--soft)}
.msg{font-size:13.5px}
.msg.err{color:var(--oxblood)}
.msg.ok{color:var(--sage)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:2px;padding:9px 16px;border:1px solid var(--line2);background:none;font-family:var(--label);font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold-lt),var(--gold));border-color:var(--gold);color:var(--on-gold)}
.btn.ghost{border-color:transparent;padding-inline:6px;color:var(--soft)}
.btn.danger{color:var(--oxblood);border-color:var(--oxblood)}
.panel{background:var(--panel);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:24px}
.empty{border:1px dashed var(--line2);padding:28px 20px;text-align:center;color:var(--soft);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:21px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:2px;padding:11px 12px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}

/* Travessia: abertura */
.hero{position:relative;text-align:center;padding:30px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:12px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-20px -40px 0;z-index:-1;background:radial-gradient(ellipse at 50% 38%,rgba(200,146,42,.16),transparent 62%)}
.hero .logo{width:84px;height:auto;filter:drop-shadow(0 0 18px rgba(200,146,42,.4))}
.hero h1{font-weight:300;font-size:clamp(30px,8vw,48px);letter-spacing:.06em;text-transform:uppercase;line-height:1.02}
.hero .route{font-family:var(--display);font-style:italic;font-size:19px;color:var(--gold)}
.hero .line{width:1px;height:36px;background:linear-gradient(var(--gold),transparent)}
.hero .intro{font-family:var(--display);font-style:italic;font-size:18px;line-height:1.45;color:var(--ink);max-width:34ch}
.clock{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--line);gap:1px}
.clock div{background:var(--panel);padding:12px 8px;text-align:center}
.clock b{display:block;font-family:var(--display);font-size:28px;font-weight:400;color:var(--gold-lt);line-height:1.1;font-variant-numeric:tabular-nums}
.clock span{font-family:var(--label);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;width:64px;background:none;border:0;padding:0}
.strip img{width:100%;height:auto;display:block}
.strip img.off{filter:grayscale(1) brightness(.35)}
.daychips{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 12px;background:rgba(10,8,6,.95);border-block:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.daychips button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:6px 8px;font-family:var(--label);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.daychips button b{font-weight:600;color:var(--soft);margin-right:4px}
.daychips button[aria-current="true"]{color:var(--gold-lt);border-bottom-color:var(--gold)}
.daychips button.today b{color:var(--gold-lt)}

/* Travessia: dias */
.days{display:flex;flex-direction:column;gap:2px}
.day{background:var(--panel);border:1px solid var(--line);scroll-margin-top:56px}
.day.open{border-color:var(--line2)}
.day.is-today{box-shadow:inset 3px 0 0 var(--gold)}
.dayhead{width:100%;display:grid;grid-template-columns:58px 1fr 24px;gap:0;align-items:stretch;background:none;border:0;padding:0;text-align:left}
.dnum{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);padding:14px 4px;background:rgba(0,0,0,.2)}
.dnum small{font-family:var(--label);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.dnum b{font-family:var(--display);font-size:30px;font-weight:400;color:rgba(214,166,73,.45);line-height:1;font-variant-numeric:tabular-nums}
.day.open .dnum b,.day.is-today .dnum b{color:var(--gold-lt)}
.dtit{padding:13px 14px 12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.dtit h3{font-size:21px;font-weight:500}
.dtit .fr{font-family:var(--display);font-style:italic;font-size:16px;line-height:1.35;color:var(--soft)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--line2);color:var(--soft)}
.tag.date{color:var(--gold-lt);border-color:var(--gold-deep);background:rgba(200,146,42,.08)}
.tag.today{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.chev{align-self:center;color:var(--faint);transition:transform .25s}
.day.open .chev{transform:rotate(180deg);color:var(--gold)}
.daybody{padding:4px 16px 22px;display:flex;flex-direction:column;gap:22px}
.logi{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--label);font-size:13px;letter-spacing:.08em;color:var(--soft);border-bottom:1px solid var(--line);padding-bottom:12px}
.logi b{color:var(--ink);font-weight:500}
.per{font-family:var(--label);font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:4px 0 6px}
ul.items{list-style:none;margin:0 0 6px;padding:0}
ul.items li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
ul.items li:first-child{border-top:0}
ul.items .h{font-family:var(--label);font-weight:600;color:var(--gold-lt);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.place{border-left:2px solid var(--gold);padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:8px}
.place .sub{font-family:var(--label);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.place h4{margin:0;font-family:var(--display);font-size:23px;font-weight:500;color:#fff;line-height:1.15}
.place p{font-weight:300;font-size:15.5px;line-height:1.7;color:#d3c7ae}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:4px}
.stats div{background:var(--panel2);padding:10px 8px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:22px;font-weight:500;color:var(--gold-lt);line-height:1.1}
.stats span{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.note{border:1px solid var(--line2);background:rgba(200,146,42,.05);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.note .t{font-family:var(--label);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.note p{font-weight:300;line-height:1.65}
.cer{position:relative;border:1px solid var(--line2);border-left:3px solid var(--gold-lt);background:linear-gradient(135deg,rgba(200,146,42,.09),rgba(200,146,42,.02));padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.cer .t{font-family:var(--label);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.cer h4{margin:0;font-family:var(--display);font-size:23px;font-weight:600;color:var(--gold-lt)}
.cer p{font-weight:300;line-height:1.65;color:#dccfb5}
.cer .q{font-family:var(--label);font-size:12.5px;letter-spacing:.1em;color:var(--gold);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.gods{margin:0 -16px;background:#050403;border-block:1px solid var(--line2);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.gods .intro{font-family:var(--display);font-style:italic;font-size:17px;color:var(--soft)}
.godrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.god{width:min(30%,140px);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.god img{width:100%;height:auto;display:block;box-shadow:0 4px 16px rgba(0,0,0,.6),0 0 0 1px rgba(200,146,42,.25)}
.god span{font-family:var(--label);font-size:11.5px;letter-spacing:.08em;color:var(--soft);font-style:italic}
.gods .story{border-left:2px solid var(--gold-deep);padding-left:14px}
.gods .story h5{margin:0 0 4px;font-family:var(--display);font-style:italic;font-weight:500;font-size:19px;color:var(--gold-lt)}
.gods .story p{font-weight:300;line-height:1.7;color:#cdbfa4}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:2px}
@media (max-width:420px){.checks{grid-template-columns:1fr}}
.checks label{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.02);border:1px solid var(--line);cursor:pointer;font-weight:300;font-size:14.5px}
.checks input{appearance:none;width:16px;height:16px;border:1px solid var(--line2);flex:none;display:grid;place-items:center;margin:0}
.checks input:checked{background:var(--gold);border-color:var(--gold)}
.checks input:checked::after{content:"";width:8px;height:4px;border:2px solid var(--on-gold);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.checks input:checked+span{color:var(--faint);text-decoration:line-through}
.seals{display:flex;gap:14px;flex-wrap:wrap}
.seals button{background:none;border:0;padding:0;width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--label);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.seals img{width:100%;height:auto}
.seals img.off{filter:grayscale(1) brightness(.35)}
details.guide{background:var(--panel);border:1px solid var(--line)}
details.guide summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary b{font-family:var(--display);font-size:20px;font-weight:500}
details.guide summary span{font-size:13px;color:var(--soft);display:block}
details.guide[open]{border-color:var(--line2)}
details.guide .gb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details.guide .gb p{font-weight:300;line-height:1.7;color:#d3c7ae}
.foot{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 8px}
.foot img.s{width:48px;opacity:.6}
.foot q{font-family:var(--display);font-style:italic;font-size:20px;color:var(--gold-lt);quotes:none;max-width:30ch}
.orn{display:block;margin:0 auto;max-width:min(100%,420px);height:auto;opacity:.9;mix-blend-mode:lighten}

/* Passaporte */
.cover{display:block;width:100%;max-width:100%;height:auto;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.datapage{position:relative;overflow:hidden;background:#efe4cc;color:#2b2217;padding:18px 18px 12px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.55);
  background-image:repeating-radial-gradient(circle at 80% 20%,rgba(166,125,51,.10) 0 1px,transparent 1px 9px),repeating-linear-gradient(115deg,rgba(166,125,51,.06) 0 1px,transparent 1px 7px)}
.datapage .top2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid rgba(43,34,23,.25);padding-bottom:8px;margin-bottom:12px}
.datapage .top2 b{font-family:var(--label);letter-spacing:.3em;text-transform:uppercase;font-size:12px}
.datapage .top2 span{font-family:var(--label);letter-spacing:.2em;font-size:11px;text-transform:uppercase;color:#6d5a3c}
.dp{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start}
.dp img{width:96px;height:120px;object-fit:cover;border:1px solid rgba(43,34,23,.35);background:#d9ccb0;filter:sepia(.25)}
.dp dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.dp dt{font-family:var(--label);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7a6546}
.dp dd{margin:0;font-family:var(--display);font-size:18px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.dp .wide{grid-column:1/-1}
.mrz{margin-top:14px;font-family:ui-monospace,"Courier New",monospace;font-size:clamp(10px,2.9vw,13px);letter-spacing:.12em;color:#3b2f20;white-space:pre;overflow:hidden}
.pages{background:#0d0a07;border:1px solid var(--line2);padding:20px 12px 26px}
.pages .ph{text-align:center;display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.pages .ph h2{font-style:italic;font-size:24px;color:var(--gold-lt)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
.slot{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.slot img.pin{width:100%;max-width:150px;height:auto;display:block;transition:filter .3s,transform .3s}
.slot.off img.pin{filter:grayscale(1) brightness(.3) contrast(1.1)}
.slot.on img.pin{filter:drop-shadow(0 0 14px rgba(200,146,42,.45))}
.slot:hover img.pin{transform:translateY(-2px)}
.slot small{font-family:var(--label);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.slot.on small{color:var(--gold)}
.stamp{position:absolute;top:30%;left:50%;width:74px;height:74px;margin-left:-37px;border-radius:50%;border:2.5px solid var(--seal);color:var(--seal);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-14deg);background:rgba(10,8,6,.35);font-family:var(--label);text-transform:uppercase;line-height:1.05;pointer-events:none;box-shadow:inset 0 0 0 3px rgba(10,8,6,.2),inset 0 0 0 4px rgba(194,65,47,.55)}
.stamp b{font-size:12px;font-weight:600;letter-spacing:.14em}
.stamp i{font-style:normal;font-size:9.5px;letter-spacing:.12em}
@media (prefers-reduced-motion:no-preference){
  .stamp.new{animation:carimbo .55s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes carimbo{0%{opacity:0;transform:rotate(-30deg) scale(2)}60%{opacity:1}100%{opacity:1;transform:rotate(-14deg) scale(1)}}
}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.roster li{display:grid;grid-template-columns:40px 36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.roster li:first-child{border-top:0}
.roster .n{font-family:var(--display);color:var(--gold-lt);font-size:19px;font-variant-numeric:tabular-nums;text-align:right}
.roster img{width:36px;height:36px;border-radius:50%;background:var(--panel3)}
.roster small{display:block;color:var(--soft);font-size:12.5px}
.roster .c{font-family:var(--label);font-size:13px;letter-spacing:.08em;color:var(--gold);white-space:nowrap}

/* Mapa */
.mapwrap{display:grid;gap:16px}
@media (min-width:980px){.mapwrap{grid-template-columns:1fr 330px;align-items:start}}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1px solid var(--line2);background:none;padding:6px 12px;font-family:var(--label);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.pick button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.map{background:#0d0906;border:1px solid var(--line2);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map .contour{fill:none;stroke:rgba(200,146,42,.09);stroke-width:1.2}
.map .route{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:2 10;stroke-linecap:round;opacity:.75}
.map .pin{cursor:pointer}

<script>
(function(){
"use strict";

// ---------- estado ----------
const S = {
  tab: "travessia",
  roteiro: null, roteiroErro: false,
  dias: [], cidades: [], locais: [], ens: [], chat: [], posicoes: [], viajantes: [],
  vReady: false, dbReady: false, pularCadastro: false,
  uid: null, me: null, isOwner: false, canChat: null,
  db: null, user: null, assets: null, perfis: {},
  diaAberto: null, ensSel: null, cidadeSel: "india", localSel: null,
  unlockMsg: null, novoSelo: null, marcando: false, posMsg: null, pontoAberto: false, proj: null, local: {}, checks: {}
};
try { const t = localStorage.getItem("cdi-tab2"); if (t) S.tab = t; } catch (e) {}
try { S.local = JSON.parse(localStorage.getItem("cdi-ins") || "{}") || {}; } catch (e) {}
try { S.checks = JSON.parse(localStorage.getItem("cdi-checks") || "{}") || {}; } catch (e) {}

const SVGTAGS = new Set(["svg","g","path","circle","text","line","rect","title","image"]);
function h(tag, attrs, ...kids) {
  const el = SVGTAGS.has(tag) ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}
const $ = s => document.querySelector(s);
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const byOrdem = (a, b) => (a.ordem ?? 999) - (b.ordem ?? 999);
const blob = id => "/_blob/" + id;
const badgeSrc = l => l && l.insignia ? `insignias/${l.insignia}.webp` : null;
const deusSrc = n => "deuses/" + norm(n) + ".webp";
const FRESCO = 3 * 60 * 60 * 1000;
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
const nn = n => String(n).padStart(2, "0");
const MES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const dataSelo = ts => { const d = new Date(ts); return nn(d.getDate()) + " " + MES[d.getMonth()] + " " + String(d.getFullYear()).slice(2); };

// ---------- quem é quem ----------
const eu = () => S.viajantes.find(v => v.id === S.uid);
function numeros() { const m = {}; S.viajantes.filter(v => !v.lider).sort((a, b) => (a.ts || 0) - (b.ts || 0)).forEach((v, i) => m[v.id] = i + 1); return m; }
function rotulo(id) {
  const v = S.viajantes.find(x => x.id === id);
  if (v && v.lider) return "Líder da travessia";
  const n = numeros()[id]; return n ? "Viajante nº " + nn(n) : "";
}
function nomeDe(id) {
  if (id === S.uid) return "Você";
  const v = S.viajantes.find(x => x.id === id);
  return (v && v.nome) || S.perfis[id]?.name || "Viajante";
}
perfis.pend = new Set();
async function perfis(ids) {
  const falta = [...new Set(ids)].filter(id => id && !S.perfis[id] && !perfis.pend.has(id));
  if (!falta.length || !S.user) return;
  falta.forEach(id => perfis.pend.add(id));
  Object.assign(S.perfis, await S.user.profiles(falta)); render();
}
const avatar = id => S.perfis[id]?.avatarUrl || BLANK;

// ---------- selos ----------
const minhas = () => ({ ...S.local, ...((eu() && eu().insignias) || {}) });
const aberto = l => !!(l && (l.aberto || minhas()[l.id]));
const conquistasDe = v => S.locais.filter(l => l.insignia && (l.aberto || (v.insignias || {})[l.id])).length;
const insigniaLocais = () => S.locais.filter(l => l.insignia).sort(byOrdem);
const localDe = id => S.locais.find(l => l.id === id);
const cidadeDe = id => S.cidades.find(c => c.id === id);
const hojeIso = () => new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
const diaDe = n => (S.roteiro?.dias || []).find(d => d.n === n);
function disponivel(l) {
  if (S.isOwner || l.aberto) return true;
  const d = diaDe(l.dia); return !d || hojeIso() >= d.iso;
}
async function selar(l, palavra) {
  if (norm(palavra) !== norm(l.codigo)) return { ok: false, text: "Essa não é a palavra deste lugar. Confira com a líder e tente de novo." };
  const ts = Date.now();
  S.local = { ...S.local, [l.id]: ts };
  try { localStorage.setItem("cdi-ins", JSON.stringify(S.local)); } catch (e) {}
  if (S.db && S.uid && eu()) { try { await S.db.doc("viajantes/" + S.uid).update({ insignias: { [l.id]: ts } }); } catch (e) {} }
  S.novoSelo = l.id;
  return { ok: true, text: "Selo carimbado no seu passaporte." };
}

// ---------- relógios ----------
const IST = () => new Date().toLocaleTimeString("pt-BR", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit" });
const BRT = () => new Date().toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit" });
const faltam = () => Math.ceil((new Date("2026-11-04T00:00:00+05:30").getTime() - Date.now()) / 86400000);

// ---------- navegação ----------
function go(tab) {
  S.tab = tab; try { localStorage.setItem("cdi-tab2", tab); } catch (e) {}
  render(); $("#main").scrollTop = 0;
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (!b) return; if (b.dataset.tab === "ensinamentos") S.ensSel = null; go(b.dataset.tab); });
$("#me").addEventListener("click", () => go("passaporte"));

function render() {
  for (const b of document.querySelectorAll("#tabs button")) {
    if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  }
  const act = document.activeElement, actId = act && act.id, sel = act && "selectionStart" in act ? [act.selectionStart, act.selectionEnd] : null;
  const draft = act && actId && act.value !== undefined ? act.value : null;
  const chatDraft = $("#chat-input")?.value;
  const main = $("#main"), scroll = main.scrollTop;
  pintaMe();
  const precisaCadastro = S.db && S.uid && S.vReady && !eu() && !S.pularCadastro;
  main.replaceChildren(precisaCadastro ? vCadastro() :
    S.tab === "passaporte" ? vPassaporte() : S.tab === "ensinamentos" ? vSaberes() : S.tab === "mapa" ? vMapa() : S.tab === "conversa" ? vConversa() : vTravessia());
  main.scrollTop = scroll;
  if (S.tab === "conversa") {
    const inp = $("#chat-input"); if (inp && chatDraft) inp.value = chatDraft;
    const log = $("#chatlog"); if (log) log.scrollTop = log.scrollHeight;
  }
  const el = actId && document.getElementById(actId);
  if (el && el !== act) { if (draft != null && "value" in el && el.type !== "file" && el.type !== "checkbox") el.value = draft; el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
}
function pintaMe() {
  const b = $("#me"), v = eu();
  if (!S.uid) { b.hidden = true; return; }
  b.hidden = false;
  b.setAttribute("aria-label", v ? "Meu passaporte" : "Emitir passaporte");
  b.replaceChildren(h("img", { src: avatar(S.uid), alt: "" }), h("b", { text: v ? (v.lider ? "Líder" : "Nº " + nn(numeros()[S.uid] || 0)) : "Emitir" }));
}
function carregando(txt) {
  return h("div", { class: "empty" }, h("h3", { text: S.dbReady ? "Nada por aqui ainda" : "Abrindo a travessia…" }),
    h("p", { text: txt || (S.dbReady ? "Quando a líder publicar, aparece aqui." : "Se demorar, abra este aplicativo pelo link do Claude, com a sua conta.") }));
}

// ---------- cadastro ----------
function vCadastro() {
  const nome = h("input", { type: "text", id: "cad-nome", maxlength: "40", autocomplete: "given-name", placeholder: "Como a caravana vai te chamar" });
  const cid = h("input", { type: "text", id: "cad-cidade", maxlength: "40", placeholder: "Ex.: São Paulo" });
  const erro = h("p", { class: "msg err", role: "alert" });
  if (S.me && S.me.name) nome.value = S.me.name.split(" ")[0];
  return h("section", { class: "welcome" },
    h("img", { class: "cover", src: "img/passaporte.webp", alt: "Passaporte da Caravana" }),
    h("p", { class: "eyebrow", text: "Emissão do passaporte" }),
    h("h1", { text: "Seu passaporte da Índia Sagrada" }),
    h("p", { class: "lede", text: "Com ele você recebe seu número de viajante, conversa com a caravana e carimba os selos de cada lugar sagrado da travessia." }),
    h("form", { onsubmit: async e => {
      e.preventDefault();
      if (!nome.value.trim()) { erro.textContent = "Escreva seu nome."; return; }
      const doc = { nome: nome.value.trim(), cidade: cid.value.trim(), ts: Date.now(), insignias: { ...S.local } };
      if (S.isOwner) doc.lider = true;
      try { await S.db.doc("viajantes/" + S.uid).set(doc); S.tab = "passaporte"; }
      catch (err) { erro.textContent = "Não consegui emitir seu passaporte. Peça à líder um convite com permissão para participar."; }
    } },
      h("label", { for: "cad-nome" }, "Seu nome", nome),
      h("label", { for: "cad-cidade" }, "De onde você vem", cid),
      erro, h("button", { class: "btn gold", type: "submit" }, "Emitir meu passaporte")),
    h("button", { class: "btn ghost", type: "button", onclick: () => { S.pularCadastro = true; render(); } }, "Agora não, só quero olhar"));
}

// ---------- Travessia ----------
function vTravessia() {
  const R = S.roteiro;
  if (!R) return h("section", { class: "view" }, carregando(S.roteiroErro ? "Não consegui carregar o roteiro. Feche e abra o aplicativo de novo." : ""));
  const dias = R.dias, hoje = hojeIso(), f = faltam();
  if (S.diaAberto == null) S.diaAberto = (dias.find(d => d.iso === hoje) || dias.find(d => d.iso > hoje) || dias[0]).n;
  const ins = insigniaLocais();
  const abrir = n => { S.diaAberto = S.diaAberto === n ? 0 : n; render(); if (S.diaAberto) requestAnimationFrame(() => document.getElementById("dia-" + n)?.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" })); };
  return h("section", { class: "view" },
    h("div", { class: "hero" },
      h("img", { class: "logo", src: "img/simbolo.png", alt: "" }),
      h("p", { class: "eyebrow", text: "Temporada 2026 · Turma 1" }),
      h("h1", null, "Travessia da", h("br"), "Índia Sagrada"),
      h("p", { class: "route", text: "Delhi · Agra · Jaipur · Varanasi · Rishikesh" }),
      h("span", { class: "line" }),

async function reduzir(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 2.5e6) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
  } catch (e) { return file; }
}
async function subirFoto(file) { if (!S.assets) throw { code: "not_granted" }; return (await S.assets.upload(await reduzir(file))).id; }
function erroFoto(e) {
  const c = e && e.code;
  return c === "too_large" ? "A foto é grande demais. Tente uma menor." : c === "unsupported_type" ? "Esse formato não funciona. Use JPG ou PNG." :
    c === "quota_or_state" ? "O espaço de fotos do aplicativo acabou." : "Não consegui enviar a foto. Tente de novo.";
}

// ---------- Editor (só a líder) ----------
function editar(tipo, item) {
  item = item || {};
  const cids = S.cidades.slice().sort(byOrdem), locs = S.locais.slice().sort(byOrdem);
  const INS = ["", "india", "taj-mahal", "jaipur", "galta-ji", "varanasi", "ganga-aarti", "manikarnika", "batismo", "beatles-ashram", "rishikesh", "kunjapuri", "caverna"];
  const F = {
    dia: { col: "dias", t: "dia", campos: [["n", "Número do dia", "num"], ["iso", "Data (AAAA-MM-DD)"], ["data", "Data por extenso (ex.: Quarta · 4 nov)"], ["cidade", "Cidade(s)"], ["titulo", "Título"],
      ["itens", "Programação (uma linha por item: 18:00 | Ganga Aarti)", "linhas"], ["nota", "Nota", "area"], ["ordem", "Ordem", "num"]], obrig: "titulo" },
    local: { col: "locais", t: "lugar", campos: [["nome", "Nome"], ["cidadeId", "Cidade", "sel", cids.map(c => [c.id, c.nome])], ["insignia", "Insígnia (vazio = hotel ou ponto de apoio)", "sel", INS.map(i => [i, i || "Nenhuma"])],
      ["dia", "Dia do roteiro", "num"], ["ordem", "Ordem", "num"], ["lat", "Latitude", "num"], ["lng", "Longitude", "num"], ["busca", "Busca no Google Maps"],
      ["dica", "Dica enquanto não conquistada", "area"], ["descricao", "Texto depois de conquistada", "area"], ["codigo", "Palavra do lugar"], ["aberto", "Liberada para todos", "chk"]], obrig: "nome" },
    ens: { col: "ensinamentos", t: "ensinamento", campos: [["titulo", "Título"], ["categoria", "Categoria"],
      ["localId", "Abre com a insígnia de (vazio = sempre aberto)", "sel", [["", "Sempre aberto"], ...locs.filter(l => l.insignia).map(l => [l.id, l.nome])]],
      ["resumo", "Resumo curto"], ["texto", "Texto (separe parágrafos com uma linha em branco)", "area"], ["foto", "Foto", "foto"], ["fonte", "Fontes"], ["ordem", "Ordem", "num"]], obrig: "titulo" }
  }[tipo];
  const inputs = {};
  const campos = F.campos.map(([k, label, kind, opts]) => {
    const id = `ed-${tipo}-${k}`; let el;
    if (kind === "foto") {
      const prev = h("img", { alt: "", hidden: !item[k], src: item[k] ? blob(item[k]) : null }), st = h("span", { class: "small", role: "status" });
      const tirar = h("button", { class: "btn ghost", type: "button", hidden: !item[k], onclick: () => { el.dataset.id = ""; prev.hidden = true; tirar.hidden = true; } }, "Tirar foto");
      const fi = h("input", { type: "file", accept: "image/*", id, onchange: async () => {
        const f = fi.files[0]; if (!f) return; st.textContent = "Enviando…";
        try { const nid = await subirFoto(f); el.dataset.id = nid; prev.src = blob(nid); prev.hidden = false; tirar.hidden = false; st.textContent = "Foto pronta. Toque em Salvar."; } catch (e) { st.textContent = erroFoto(e); }
      } });
      el = h("div", { class: "fotofield" }, prev, S.assets ? fi : h("span", { class: "small", text: "O envio de fotos não está disponível nesta visualização." }), h("div", { class: "actions" }, tirar, st));
      el.dataset.id = item[k] || ""; inputs[k] = [el, kind];
      return h("div", { class: "fotofield" }, h("span", { class: "small", text: label }), el);
    }
    if (kind === "area" || kind === "linhas") el = h("textarea", { id, rows: kind === "linhas" ? "8" : "4" });
    else if (kind === "sel") el = h("select", { id }, opts.map(([v, t]) => h("option", { value: v, text: t })));
    else if (kind === "chk") el = h("input", { id, type: "checkbox" });
    else el = h("input", { id, type: kind === "num" ? "number" : "text", step: kind === "num" ? "any" : null });
    if (kind === "chk") el.checked = !!item[k];
    else if (kind === "linhas") el.value = (item[k] || []).map(it => (it.hora ? it.hora + " | " : "") + it.texto).join("\n");
    else el.value = item[k] ?? "";
    inputs[k] = [el, kind];
    return kind === "chk" ? h("label", { class: "chk", for: id }, el, label) : h("label", { for: id }, label, el);
  });
  let conf = false;
  const del = item.id ? h("button", { class: "btn danger", type: "button", onclick: async () => {
    if (!conf) { conf = true; del.textContent = "Toque de novo para apagar"; return; }
    await S.db.doc(`${F.col}/${item.id}`).delete().catch(() => {}); closeSheets();
  } }, "Apagar") : h("span");
  const erro = h("p", { class: "msg err", role: "alert" });
  const form = h("form", { onsubmit: async e => {
    e.preventDefault(); const data = {};
    for (const k in inputs) { const [el, kind] = inputs[k];
      if (kind === "chk") data[k] = el.checked;
      else if (kind === "foto") { if (el.dataset.id) data[k] = el.dataset.id; }
      else if (kind === "num") { if (el.value !== "") data[k] = Number(el.value); }
      else if (kind === "linhas") data[k] = el.value.split("\n").map(s => s.trim()).filter(Boolean).map(s => { const i = s.indexOf("|"); return i > -1 ? { hora: s.slice(0, i).trim(), texto: s.slice(i + 1).trim() } : { hora: "", texto: s }; });
      else if (el.value.trim() !== "") data[k] = el.value.trim(); }
    if (!data[F.obrig]) { erro.textContent = "Preencha o campo " + F.obrig + "."; return; }
    try { await (item.id ? S.db.doc(`${F.col}/${item.id}`) : S.db.collection(F.col).doc()).set(data); closeSheets(); }
    catch (err) { erro.textContent = "Não consegui salvar. Confira a conexão e tente de novo."; }
  } },
    h("h2", { text: (item.id ? "Editar " : "Novo ") + F.t }),
    h("p", { class: "small", text: "Só você, líder da travessia, vê este formulário." }),
    campos, erro,
    h("div", { class: "foot" }, del, h("div", { class: "actions" }, h("button", { class: "btn", type: "button", onclick: closeSheets }, "Cancelar"), h("button", { class: "btn gold", type: "submit" }, "Salvar"))));
  closeSheets();
  const sheet = h("div", { class: "sheet", onclick: e => { if (e.target === sheet) closeSheets(); } }, form);
  document.body.append(sheet);
  form.querySelector("input,select,textarea")?.focus();
}

// ---------- dados ----------
function listen(col, key, q, after) {
  (q || S.db.collection(col)).onSnapshot(snap => {
    S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.dbReady = true; if (after) after(); render(); refreshSheet();
  }, () => { S.dbReady = true; if (after) after(); render(); });
}

fetch("dados/travessia.json").then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(j => { S.roteiro = j; render(); }).catch(() => { S.roteiroErro = true; render(); });
render();
(async () => {
  const [db, user, assets] = await Promise.all(["db", "user", "assets"].map(n => window.claude?.use?.(n) ?? null));
  S.db = db; S.user = user; S.assets = assets;
  if (user) { const me = await user.me(); S.me = me; S.uid = me.id; S.isOwner = me.isOwner; perfis([me.id]); }
  if (!db) { S.dbReady = true; render(); return; }
  listen("cidades", "cidades"); listen("locais", "locais"); listen("ensinamentos", "ens");
  listen("viajantes", "viajantes", null, () => { S.vReady = true; });
  listen("chat", "chat", db.collection("chat").orderBy("ts", "desc").limit(400));
  listen("posicoes", "posicoes");
  setInterval(() => { if ((S.tab === "mapa" || S.tab === "travessia") && !document.activeElement?.matches?.("input,textarea,select") && !document.querySelector(".sheet")) render(); }, 60000);
})();
})();
</script>
