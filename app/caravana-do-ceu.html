<title>Caravana Índia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Visual único e escuro, como O Mapa da Travessia. */
:root{
  color-scheme:dark;
  --bg:#0b0806; --panel:#140f0a; --panel2:#1c150d; --panel3:#241b11;
  --ink:#e7d9b7; --soft:#b7a37a; --faint:#7d6e52;
  --gold:#cb9d4d; --gold-deep:#a67d33; --line:rgba(203,157,77,.22); --line2:rgba(203,157,77,.45);
  --oxblood:#bb6144; --sage:#a9b98f; --on-gold:#140f0a;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --read:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0;line-height:1.2;letter-spacing:.04em}
p{margin:0}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "main" "nav";
  background:var(--bg) url("img/textura.jpg") center top/cover no-repeat}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(11,8,6,.82)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:auto;flex:none}
.brand b{display:block;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.brand span{display:block;font-size:11px;color:var(--soft);letter-spacing:.08em;text-transform:uppercase}
.me{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:12px;color:var(--soft);min-width:0}
.me img{width:26px;height:26px;border-radius:50%;flex:none}
.me b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{grid-area:main;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{padding:22px 16px 40px;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

nav.tabs{grid-area:nav;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(11,8,6,.94);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--faint);letter-spacing:.03em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--gold)}
@media (min-width:900px){
  .app{grid-template-columns:210px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top top" "nav main"}
  nav.tabs{grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding:18px 10px;gap:4px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:10px 12px;border-radius:10px}
  nav.tabs button[aria-current="page"]{background:var(--panel2)}
}

.eyebrow{font-family:var(--display);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:clamp(24px,5.5vw,34px)}
.lede{font-family:var(--read);font-size:18px;line-height:1.5;color:var(--soft);max-width:60ch}
.orn{display:block;margin:0 auto;max-width:min(100%,420px);height:auto;opacity:.9}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:8px 16px;border:1px solid var(--line2);background:none;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.ghost{border-color:transparent;padding-inline:8px;color:var(--soft)}
.btn.danger{color:var(--oxblood);border-color:var(--oxblood)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--soft)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip.today{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.panel{background:rgba(20,15,10,.9);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:21px}
.small{font-size:12.5px;color:var(--soft)}
.msg{font-size:13px}
.msg.err{color:var(--oxblood)}
.msg.ok{color:var(--sage)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:28px 20px;text-align:center;color:var(--soft);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:18px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}

/* Roteiro */
.clock{display:flex;gap:10px;flex-wrap:wrap}
.clock div{flex:1 1 140px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(20,15,10,.85)}
.clock b{display:block;font-family:var(--display);font-size:22px;font-weight:500;color:var(--gold);font-variant-numeric:tabular-nums}
.clock span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.days{display:flex;flex-direction:column;gap:10px}
details.day{background:rgba(20,15,10,.9);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.day[open]{border-color:var(--line2)}
details.day.is-today{border-color:var(--gold)}
details.day summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:14px 16px}
details.day summary::-webkit-details-marker{display:none}
.dnum{font-family:var(--display);text-align:center;line-height:1}
.dnum small{display:block;font-size:10px;letter-spacing:.2em;color:var(--soft)}
.dnum b{font-size:28px;font-weight:500;color:var(--gold);font-variant-numeric:tabular-nums}
.dtit h3{font-size:17px}
.dtit p{font-size:12.5px;color:var(--soft)}
.dbadges{display:flex;gap:4px}
.dbadges img{width:30px;height:auto}
.dbadges img.off{filter:grayscale(1) brightness(.45)}
.dbody{padding:0 16px 16px 86px;display:flex;flex-direction:column;gap:12px}
@media (max-width:520px){.dbody{padding-left:16px}}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.items li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
ul.items li:first-child{border-top:0}
ul.items .h{font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums;font-size:13px}
.nota{font-family:var(--read);font-style:italic;font-size:16px;color:var(--soft);border-left:2px solid var(--gold-deep);padding-left:12px}

/* Mapa */
.mapwrap{display:grid;gap:16px}
@media (min-width:980px){.mapwrap{grid-template-columns:1fr 330px;align-items:start}}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{border-radius:999px;border:1px solid var(--line2);background:none;padding:6px 14px;font-size:13px;color:var(--soft)}
.pick button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.map{background:#100b07;border:1px solid var(--line2);border-radius:16px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map .contour{fill:none;stroke:rgba(203,157,77,.10);stroke-width:1.2}
.map .route{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:2 10;stroke-linecap:round;opacity:.75}
.map .pin{cursor:pointer}
.map .pin .ring{fill:#100b07;stroke:var(--gold);stroke-width:2.5}
.map .pin.off .ring{stroke:var(--faint);stroke-dasharray:4 4}
.map .pin .n{font:600 17px var(--ui);fill:var(--faint);text-anchor:middle;dominant-baseline:central}
.map .pin .lbl{font:500 18px var(--ui);fill:var(--ink);paint-order:stroke;stroke:#100b07;stroke-width:6px;stroke-linejoin:round}
.map .pin.off .lbl{fill:var(--soft)}
.map .pin .halo{fill:none;stroke:var(--gold);stroke-width:2;opacity:0}
.map .pin.sel .halo{opacity:1}
.map .hotel rect{fill:var(--panel3);stroke:var(--soft);stroke-width:2}
.map .hotel text{font:500 15px var(--ui);fill:var(--soft);paint-order:stroke;stroke:#100b07;stroke-width:5px}
.map .city .dot{fill:var(--gold)}
.map .city text{font:500 22px var(--display);fill:var(--ink);letter-spacing:.08em;paint-order:stroke;stroke:#100b07;stroke-width:6px}
.map .city .cnt{font:600 15px var(--ui);fill:var(--soft)}
.map .ui{fill:var(--soft);font:500 15px var(--ui)}
.map .ui-line{stroke:var(--soft);stroke-width:2}
.map .person circle{stroke:#100b07;stroke-width:3}
.map .person text{font:600 13px var(--ui);fill:#fff;text-anchor:middle;dominant-baseline:central}
.map .person .pring{fill:none;stroke-width:2;opacity:.5}
.map.marking svg{cursor:crosshair}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.people li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.people img{width:36px;height:36px;border-radius:50%}
.people b{font-weight:600}
.people small{display:block;color:var(--soft);font-size:12px}
.share{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}

/* Insígnias */
.passport{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:rgba(20,15,10,.92);border:1px solid var(--line2);border-radius:18px;padding:18px}
.passport img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid var(--line2)}
.passport .num{font-family:var(--display);font-size:13px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.passport h2{font-size:24px;margin:2px 0}
.bar{height:6px;border-radius:6px;background:var(--panel3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,150px),1fr));gap:18px 14px}
.badge{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.badge .art{width:100%;max-width:150px;aspect-ratio:3/4;display:grid;place-items:center;position:relative}
.badge .art img{max-width:100%;max-height:100%;width:auto;height:auto}
.badge.off .art img{filter:grayscale(1) brightness(.35) contrast(1.1)}
.badge.off .art::after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:#100b07 url("img/cristal.jpg") center/cover;border:1px solid var(--line2)}
.badge b{font-family:var(--display);font-size:13px;font-weight:500;letter-spacing:.06em}
.badge small{font-size:11.5px;color:var(--soft)}
.badge.off b{color:var(--soft)}
@media (prefers-reduced-motion:no-preference){.badge .art img{transition:transform .25s}.badge:not(.off):hover .art img{transform:rotate(-2deg) scale(1.03)}}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.roster li{display:grid;grid-template-columns:44px 36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.roster li:first-child{border-top:0}
.roster .n{font-family:var(--display);color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
.roster img{width:36px;height:36px;border-radius:50%}
.roster small{display:block;color:var(--soft);font-size:12px}
.roster .c{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Conversa */
.chatview{padding:0;max-width:none;height:100%;display:grid;grid-template-rows:auto 1fr auto auto;gap:0}
.chathead{padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(11,8,6,.85)}
.chatlog{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.bubble{display:grid;grid-template-columns:32px 1fr;gap:10px;max-width:640px}
.bubble>img{width:32px;height:32px;border-radius:50%}
.bubble .b{background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;min-width:0}
.bubble.me{margin-left:auto;grid-template-columns:1fr}
.bubble.me>img{display:none}
.bubble.me .b{background:#2a2012;border-color:var(--line2);border-radius:14px 4px 14px 14px}
.bubble .h{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--soft)}
.bubble .h b{color:var(--gold);font-weight:600}
.bubble .t{white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .del{margin-left:auto;background:none;border:0;color:var(--faint);font-size:11px;padding:0}
.bubble .ponto{display:flex;flex-direction:column;gap:6px}
.bubble .ponto b{font-family:var(--display);font-size:15px;font-weight:500;color:var(--ink)}
.bubble .chatfoto{display:block;max-width:100%;width:280px;border-radius:10px;margin-top:4px}
.dayline{align-self:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.picker{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;background:var(--panel)}
.picker select,.picker input{flex:1 1 180px;min-width:0}
.composer{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:flex-end;background:var(--panel)}
.composer textarea{min-height:44px;max-height:140px;border-radius:22px;padding:10px 16px}
.composer .note{font-size:13px;color:var(--soft);padding:4px 2px}
.composer .note:empty{display:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:none;display:grid;place-items:center;flex:none;color:var(--soft)}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}

/* Ensinamentos */
.cats{display:flex;flex-direction:column;gap:26px}
.cat>h2{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.card{background:rgba(20,15,10,.9);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.card h3{font-size:16.5px;grid-column:1}
.card p{grid-column:1;color:var(--soft);font-family:var(--read);font-size:16px;line-height:1.35}
.card img{grid-column:2;grid-row:1/span 3;width:46px;height:auto}
.card .chip{grid-column:1;justify-self:start}
.card.locked{border-style:dashed;background:none}
.card.locked h3{color:var(--soft)}
.card.locked img{filter:grayscale(1) brightness(.4)}
.card:not(.locked):hover{border-color:var(--line2)}
.reader{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.reader .top-badge{width:110px;height:auto;align-self:center}
.reader h1{font-size:clamp(26px,6vw,38px);text-align:center}
.reader .eyebrow{text-align:center}
.reader .body p{font-family:var(--read);font-size:20px;line-height:1.7;margin-bottom:1em}
.reader .src{font-size:13px;color:var(--soft);border-top:1px solid var(--line);padding-top:12px}
.photo{display:block;width:100%;max-width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px}

/* Cadastro e editor */
.welcome{max-width:520px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:18px;text-align:center}
.welcome .emb{width:min(100%,300px);height:auto;margin:0 auto;border-radius:50%}
.welcome h1{font-size:clamp(26px,6vw,34px)}
.welcome form{display:flex;flex-direction:column;gap:12px;text-align:left}
.welcome label,.sheet label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--soft);letter-spacing:.04em}
.sheet{position:fixed;inset:0;background:rgba(5,4,3,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}}
.sheet>div,.sheet form{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:20px;width:100%;max-width:560px;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet .chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.sheet .foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:6px}
.sheet .big{width:min(60%,220px);height:auto;margin:0 auto}
.fotofield{display:flex;flex-direction:column;gap:8px}
.fotofield img{width:100%;max-width:100%;max-height:200px;object-fit:cover;border-radius:10px}
.unlock{display:flex;gap:8px;flex-wrap:wrap}
.unlock input{flex:1 1 160px;min-width:0}
.secret{font-size:12px;color:var(--soft);border-top:1px dashed var(--line2);padding-top:10px}
.secret code{font-family:ui-monospace,Menlo,monospace;background:var(--panel3);padding:1px 6px;border-radius:4px;color:var(--ink)}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><img src="img/simbolo.png" alt=""><div><b>Caravana do Céu</b><span>Índia · 4 a 16 nov 2026</span></div></div>
    <button class="me" id="me" type="button" hidden></button>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Seções">
    <button data-tab="roteiro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Roteiro</button>
    <button data-tab="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>Mapa</button>
    <button data-tab="insignias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v10.5a6 6 0 0 1-12 0z"/><path d="M9.5 10l1.8 1.8 3.4-3.6"/></svg>Insígnias</button>
    <button data-tab="conversa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a7.5 7.5 0 0 1-11 6.6L4 20l1.4-4.6A7.5 7.5 0 1 1 20 12z"/></svg>Conversa</button>
    <button data-tab="ensinamentos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/></svg>Ensinamentos</button>
  </nav>
</div>

<script>
(function(){
"use strict";

// ---------- estado ----------
const S = {
  tab: "roteiro",
  dias: [], cidades: [], locais: [], ens: [], chat: [], posicoes: [], viajantes: [],
  vReady: false, dbReady: false, pularCadastro: false,
  uid: null, me: null, isOwner: false, canChat: null,
  db: null, user: null, assets: null, perfis: {},
  cidadeSel: "india", localSel: null, ensSel: null, badgeSel: null,
  unlockMsg: null, marcando: false, posMsg: null, pontoAberto: false, proj: null, local: {}
};
try { const t = localStorage.getItem("cdi-tab"); if (t) S.tab = t; } catch (e) {}

      : h("div", { class: "composer" }, h("p", { class: "note", text: !S.db ? "A conversa aparece quando você abre o aplicativo pelo link do Claude, com a sua conta." :
          !eu() ? "Faça seu cadastro de viajante para conversar com a caravana." : "Para escrever aqui, peça à líder um convite com permissão para participar." }),
          S.db && S.uid && !eu() ? h("button", { class: "btn gold", type: "button", onclick: () => { S.pularCadastro = false; render(); } }, "Fazer cadastro") : null));
}

// ---------- fotos ----------
async function reduzir(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 2.5e6) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
  } catch (e) { return file; }
}
async function subirFoto(file) { if (!S.assets) throw { code: "not_granted" }; return (await S.assets.upload(await reduzir(file))).id; }
function erroFoto(e) {
  const c = e && e.code;
  return c === "too_large" ? "A foto é grande demais. Tente uma menor." : c === "unsupported_type" ? "Esse formato não funciona. Use JPG ou PNG." :
    c === "quota_or_state" ? "O espaço de fotos do aplicativo acabou." : "Não consegui enviar a foto. Tente de novo.";
}

// ---------- Ensinamentos ----------
function vEnsinamentos() {
  const e = S.ens.find(x => x.id === S.ensSel);
  if (e && (ensLiberado(e) || S.isOwner)) {
    const l = e.localId && localDe(e.localId);
    return h("section", { class: "view" },
      h("div", { class: "actions" },
        h("button", { class: "btn ghost", type: "button", onclick: () => { S.ensSel = null; render(); } }, "← Todos os ensinamentos"),
        S.isOwner ? h("button", { class: "btn ghost", type: "button", onclick: () => editar("ens", e) }, "Editar") : null),
      h("article", { class: "reader" },
        l && l.insignia ? h("img", { class: "top-badge", src: badgeSrc(l), alt: "" }) : null,
        h("p", { class: "eyebrow", text: [e.categoria, l && l.nome].filter(Boolean).join(" · ") }),
        h("h1", { text: e.titulo }),
        e.foto ? h("img", { class: "photo", src: blob(e.foto), alt: "" }) : null,
        h("div", { class: "body" }, String(e.texto || "").split(/\n\s*\n/).map(p => h("p", { text: p.trim() }))),
        e.fonte ? h("p", { class: "src", text: "Fontes: " + e.fonte }) : null),
      h("img", { class: "orn", src: "img/mantra-vasudeva.webp", alt: "Om Namo Bhagavate Vasudevaya" }));
  }
  const cats = {};
  for (const x of S.ens.slice().sort(byOrdem)) (cats[x.categoria || "Ensinamentos"] ||= []).push(x);
  return h("section", { class: "view" },
    h("div", { class: "head" },
      h("div", null, h("p", { class: "eyebrow", text: "Para ler pelo caminho" }), h("h1", { text: "Ensinamentos" })),
      adminBtn("Novo ensinamento", () => editar("ens"))),
    h("p", { class: "lede", text: "O guia da travessia fica aberto desde já. Os saberes de cada lugar se abrem junto com a insígnia dele." }),
    Object.keys(cats).length ? h("div", { class: "cats" }, Object.entries(cats).map(([cat, xs]) => h("section", { class: "cat" },
      h("h2", { text: cat }),
      h("div", { class: "cards" }, xs.map(x => {
        const lib = ensLiberado(x), l = x.localId && localDe(x.localId);
        return h("button", { class: "card" + (lib ? "" : " locked"), type: "button", "aria-disabled": String(!lib && !S.isOwner),
          onclick: () => { if (lib || S.isOwner) { S.ensSel = x.id; render(); $("#main").scrollTop = 0; } } },
          l && l.insignia ? h("img", { src: badgeSrc(l), alt: "" }) : null,
          h("h3", { text: x.titulo }),
          h("p", { text: lib ? (x.resumo || "") : "Abre com a insígnia " + (l ? l.nome : "") + "." }),
          lib ? null : h("span", { class: "chip", text: l && l.dia ? "Dia " + l.dia : "Em breve" }));
      }))))) : carregando(),
    h("img", { class: "orn", src: "img/mantra-vasudeva.webp", alt: "Om Namo Bhagavate Vasudevaya" }));
}

// ---------- Editor (só a líder) ----------
function editar(tipo, item) {
  item = item || {};
  const cids = S.cidades.slice().sort(byOrdem), locs = S.locais.slice().sort(byOrdem);
  const INS = ["", "india", "taj-mahal", "jaipur", "galta-ji", "varanasi", "ganga-aarti", "manikarnika", "batismo", "beatles-ashram", "rishikesh", "kunjapuri", "caverna"];
  const F = {
    dia: { col: "dias", t: "dia", campos: [["n", "Número do dia", "num"], ["iso", "Data (AAAA-MM-DD)"], ["data", "Data por extenso (ex.: Quarta · 4 nov)"], ["cidade", "Cidade(s)"], ["titulo", "Título"],
      ["itens", "Programação (uma linha por item: 18:00 | Ganga Aarti)", "linhas"], ["nota", "Nota", "area"], ["ordem", "Ordem", "num"]], obrig: "titulo" },
    local: { col: "locais", t: "lugar", campos: [["nome", "Nome"], ["cidadeId", "Cidade", "sel", cids.map(c => [c.id, c.nome])], ["insignia", "Insígnia (vazio = hotel ou ponto de apoio)", "sel", INS.map(i => [i, i || "Nenhuma"])],
      ["dia", "Dia do roteiro", "num"], ["ordem", "Ordem", "num"], ["lat", "Latitude", "num"], ["lng", "Longitude", "num"], ["busca", "Busca no Google Maps"],
      ["dica", "Dica enquanto não conquistada", "area"], ["descricao", "Texto depois de conquistada", "area"], ["codigo", "Palavra do lugar"], ["aberto", "Liberada para todos", "chk"]], obrig: "nome" },
    ens: { col: "ensinamentos", t: "ensinamento", campos: [["titulo", "Título"], ["categoria", "Categoria"],
      ["localId", "Abre com a insígnia de (vazio = sempre aberto)", "sel", [["", "Sempre aberto"], ...locs.filter(l => l.insignia).map(l => [l.id, l.nome])]],
      ["resumo", "Resumo curto"], ["texto", "Texto (separe parágrafos com uma linha em branco)", "area"], ["foto", "Foto", "foto"], ["fonte", "Fontes"], ["ordem", "Ordem", "num"]], obrig: "titulo" }
  }[tipo];
  const inputs = {};
  const campos = F.campos.map(([k, label, kind, opts]) => {
    const id = `ed-${tipo}-${k}`; let el;
    if (kind === "foto") {
      const prev = h("img", { alt: "", hidden: !item[k], src: item[k] ? blob(item[k]) : null }), st = h("span", { class: "small", role: "status" });
      const tirar = h("button", { class: "btn ghost", type: "button", hidden: !item[k], onclick: () => { el.dataset.id = ""; prev.hidden = true; tirar.hidden = true; } }, "Tirar foto");
      const fi = h("input", { type: "file", accept: "image/*", id, onchange: async () => {
        const f = fi.files[0]; if (!f) return; st.textContent = "Enviando…";
        try { const nid = await subirFoto(f); el.dataset.id = nid; prev.src = blob(nid); prev.hidden = false; tirar.hidden = false; st.textContent = "Foto pronta. Toque em Salvar."; } catch (e) { st.textContent = erroFoto(e); }
      } });
      el = h("div", { class: "fotofield" }, prev, S.assets ? fi : h("span", { class: "small", text: "O envio de fotos não está disponível nesta visualização." }), h("div", { class: "actions" }, tirar, st));
      el.dataset.id = item[k] || ""; inputs[k] = [el, kind];
      return h("div", { class: "fotofield" }, h("span", { class: "small", text: label }), el);
    }
    if (kind === "area" || kind === "linhas") el = h("textarea", { id, rows: kind === "linhas" ? "8" : "4" });
    else if (kind === "sel") el = h("select", { id }, opts.map(([v, t]) => h("option", { value: v, text: t })));
    else if (kind === "chk") el = h("input", { id, type: "checkbox" });
    else el = h("input", { id, type: kind === "num" ? "number" : "text", step: kind === "num" ? "any" : null });
    if (kind === "chk") el.checked = !!item[k];
    else if (kind === "linhas") el.value = (item[k] || []).map(it => (it.hora ? it.hora + " | " : "") + it.texto).join("\n");
    else el.value = item[k] ?? "";
    inputs[k] = [el, kind];
    return kind === "chk" ? h("label", { class: "chk", for: id }, el, label) : h("label", { for: id }, label, el);
  });
  let conf = false;
  const del = item.id ? h("button", { class: "btn danger", type: "button", onclick: async () => {
    if (!conf) { conf = true; del.textContent = "Toque de novo para apagar"; return; }
    await S.db.doc(`${F.col}/${item.id}`).delete().catch(() => {}); closeSheets();
  } }, "Apagar") : h("span");
  const erro = h("p", { class: "msg err", role: "alert" });
  const form = h("form", { onsubmit: async e => {
    e.preventDefault(); const data = {};
    for (const k in inputs) { const [el, kind] = inputs[k];
      if (kind === "chk") data[k] = el.checked;
      else if (kind === "foto") { if (el.dataset.id) data[k] = el.dataset.id; }
      else if (kind === "num") { if (el.value !== "") data[k] = Number(el.value); }
      else if (kind === "linhas") data[k] = el.value.split("\n").map(s => s.trim()).filter(Boolean).map(s => { const i = s.indexOf("|"); return i > -1 ? { hora: s.slice(0, i).trim(), texto: s.slice(i + 1).trim() } : { hora: "", texto: s }; });
      else if (el.value.trim() !== "") data[k] = el.value.trim(); }
    if (!data[F.obrig]) { erro.textContent = "Preencha o campo " + F.obrig + "."; return; }
    try { await (item.id ? S.db.doc(`${F.col}/${item.id}`) : S.db.collection(F.col).doc()).set(data); closeSheets(); }
    catch (err) { erro.textContent = "Não consegui salvar. Confira a conexão e tente de novo."; }
  } },
    h("h2", { text: (item.id ? "Editar " : "Novo ") + F.t }),
    h("p", { class: "small", text: "Só você, líder da travessia, vê este formulário." }),
    campos, erro,
    h("div", { class: "foot" }, del, h("div", { class: "actions" }, h("button", { class: "btn", type: "button", onclick: closeSheets }, "Cancelar"), h("button", { class: "btn gold", type: "submit" }, "Salvar"))));
  closeSheets();
  const sheet = h("div", { class: "sheet", onclick: e => { if (e.target === sheet) closeSheets(); } }, form);
  document.body.append(sheet);
  form.querySelector("input,select,textarea")?.focus();
}

// ---------- dados ----------
function listen(col, key, q, after) {
  (q || S.db.collection(col)).onSnapshot(snap => {
    S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.dbReady = true; if (after) after(); render(); refreshSheet();
  }, () => { S.dbReady = true; if (after) after(); render(); });
}

render();
(async () => {
  const [db, user, assets] = await Promise.all(["db", "user", "assets"].map(n => window.claude?.use?.(n) ?? null));
  S.db = db; S.user = user; S.assets = assets;
  if (user) { const me = await user.me(); S.me = me; S.uid = me.id; S.isOwner = me.isOwner; perfis([me.id]); }
  if (!db) { S.dbReady = true; render(); return; }
  listen("dias", "dias"); listen("cidades", "cidades"); listen("locais", "locais"); listen("ensinamentos", "ens");
  listen("viajantes", "viajantes", null, () => { S.vReady = true; });
  listen("chat", "chat", db.collection("chat").orderBy("ts", "desc").limit(400));
  listen("posicoes", "posicoes");
  setInterval(() => { if ((S.tab === "mapa" || S.tab === "roteiro") && !document.activeElement?.matches?.("input,textarea,select") && !document.querySelector(".sheet")) render(); }, 60000);
})();
})();
</script>
