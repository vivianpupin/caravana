<title>Caravana Índia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@400;500;600&family=Cinzel:wght@600;700;900&family=Jost:wght@500;600&family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Visual claro da Caravana do Céu: papel, carvão, musgo, terracota e areia. */
:root{
  color-scheme:light;
  --bg:#F5EFE4; --panel:#FFFCF7; --panel2:#FBF6EE; --panel3:#EFE6D6;
  --ink:#282722; --soft:#6B6556; --faint:#9A917F;
  --moss:#3F4938; --terra:#8A3F32; --sand:#C7B493; --paper:#E5DAC5; --gold:#A8843E;
  --line:rgba(40,39,34,.10); --line2:rgba(40,39,34,.18);
  --ok:#3F6B3A; --err:#A0402F; --seal:#A33A2A; --on-dark:#FFFCF7;
  --shadow:0 1px 2px rgba(40,39,34,.05),0 8px 28px rgba(40,39,34,.07);
  --display:"Lora",Georgia,"Times New Roman",serif;
  --ui:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:400;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--terra)}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
h1,h2,h3,h4,h5{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "main" "nav";background:var(--bg)}
.top{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 14px;background:rgba(245,239,228,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topside{display:flex;min-width:0}.topside.right{justify-content:flex-end}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;flex:none}
.brand b{display:block;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;line-height:1.1}
.brand span{display:block;font-size:11px;color:var(--soft);letter-spacing:.14em;text-transform:uppercase}
.me{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:12px;color:var(--soft);min-width:0;box-shadow:var(--shadow)}
.me img{width:28px;height:28px;border-radius:50%;flex:none;background:var(--panel3)}
.me b{font-weight:600;color:var(--moss);font-size:12px;white-space:nowrap}
.me span{display:none}
main{grid-area:main;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.view{padding:22px 16px 48px;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

nav.tabs{grid-area:nav;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,252,247,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--soft);min-width:0}
nav.tabs .ic{width:52px;height:34px;border-radius:999px;display:grid;place-items:center;transition:background .2s,color .2s}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ic{background:var(--moss);color:var(--on-dark)}
@media (min-width:900px){
  .app{grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top top" "nav main"}
  nav.tabs{grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding:18px 12px;gap:6px;background:var(--bg)}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px}
}

.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--terra)}
.rule{display:flex;align-items:center;gap:12px}
.rule::after{content:"";flex:1;height:1px;background:var(--line2)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:clamp(28px,6.5vw,36px)}
.lede{font-family:var(--display);font-style:italic;font-size:18px;line-height:1.55;color:var(--soft);max-width:60ch}
.small{font-size:13px;color:var(--soft)}
.msg{font-size:13.5px}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 18px;border:1px solid var(--line2);background:var(--panel);font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--moss)}
.btn.gold{background:var(--moss);border-color:var(--moss);color:var(--on-dark)}
.btn.gold:hover{background:#34402E}
.btn.ghost{background:none;border-color:transparent;padding-inline:6px;color:var(--soft)}
.btn.danger{color:var(--err);border-color:var(--err);background:none}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:22px}
.empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--soft);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:20px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:11px 14px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--moss);outline:none;box-shadow:0 0 0 3px rgba(63,73,56,.12)}

/* Roteiro: abertura */
.hero{text-align:center;padding:18px 8px 4px;display:flex;flex-direction:column;align-items:center;gap:10px}
.hero .logo{width:56px;height:auto}
.hero h1{font-family:"Jost",system-ui,sans-serif;font-weight:500;font-size:clamp(32px,8.5vw,48px);line-height:1.05;letter-spacing:.005em;color:#3B2A1C}
.hero .route{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--moss)}
.hero .line{display:none}
.hero .intro{font-family:var(--display);font-style:italic;font-size:18px;line-height:1.5;color:var(--soft);max-width:34ch}
.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.clock div{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:14px 8px;text-align:center}
.clock b{display:block;font-family:var(--display);font-size:28px;font-weight:500;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.clock span{font-size:11px;letter-spacing:.06em;color:var(--soft)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;width:62px;background:none;border:0;padding:0}
.strip img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 8px rgba(40,39,34,.18))}
.strip img.off{filter:grayscale(1) opacity(.35)}
.daychips{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 12px;background:rgba(245,239,228,.94);backdrop-filter:blur(10px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.daychips button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--soft);white-space:nowrap}
.daychips button b{font-weight:600;color:var(--ink);margin-right:4px}
.daychips button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daychips button[aria-current="true"] b{color:var(--bg)}
.daychips button.today{border-color:var(--terra)}

/* Roteiro: dias */
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);scroll-margin-top:60px;overflow:hidden}
.day.is-today{box-shadow:0 0 0 2px var(--terra),var(--shadow)}
.dayhead{width:100%;display:grid;grid-template-columns:62px 1fr 28px;align-items:center;background:none;border:0;padding:14px 12px 14px 0;text-align:left}
.dnum{display:flex;flex-direction:column;align-items:center;justify-content:center}
.dnum small{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.dnum b{font-family:var(--display);font-size:30px;font-weight:500;color:var(--sand);line-height:1;font-variant-numeric:tabular-nums}
.day.open .dnum b,.day.is-today .dnum b{color:var(--terra)}
.dtit{min-width:0;display:flex;flex-direction:column;gap:4px}
.dtit h3{font-size:20px}
.dtit .fr{font-family:var(--display);font-style:italic;font-size:15.5px;line-height:1.4;color:var(--soft)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--panel3);color:var(--soft)}
.tag.date{background:rgba(138,63,50,.10);color:var(--terra)}
.tag.today{background:var(--terra);color:var(--on-dark)}
.chev{color:var(--faint);transition:transform .25s;justify-self:center}
.day.open .chev{transform:rotate(180deg);color:var(--ink)}
.daybody{padding:2px 18px 22px;display:flex;flex-direction:column;gap:22px;border-top:1px solid var(--line)}
.logi{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--soft);padding-top:14px}
.logi b{color:var(--ink);font-weight:500}
.per{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--moss);margin:10px 0 4px}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
ul.items li:first-child{border-top:0}
ul.items .h{font-weight:600;color:var(--terra);font-variant-numeric:tabular-nums}
.place{display:flex;flex-direction:column;gap:8px}
.place .sub{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--terra)}
.place h4{font-size:24px;font-weight:500}
.place p{font-size:15.5px;line-height:1.75;color:#3C3A33}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:4px}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:21px;font-weight:600;color:var(--moss);line-height:1.15}
.stats span{font-size:11.5px;color:var(--soft)}
.note{background:#FFF6E6;border:1px solid rgba(168,132,62,.35);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.note .t{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.note p{line-height:1.65}
.cer{background:var(--moss);color:var(--on-dark);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.cer .t{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sand)}
.cer h4{font-size:23px;font-weight:500;color:#fff}
.cer p{line-height:1.65;color:rgba(255,252,247,.88)}
.cer .q{font-size:12.5px;color:var(--sand);border-top:1px solid rgba(255,255,255,.18);padding-top:8px;margin-top:4px}
.gods{background:var(--paper);border-radius:var(--r);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.gods .intro{font-family:var(--display);font-style:italic;font-size:16.5px;color:#4A463C}
.godrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.god{width:min(31%,150px);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.god img{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 6px 18px rgba(40,39,34,.18)}
.god span{font-size:12px;color:#4A463C;font-weight:500}
.gods .story h5{font-size:19px;font-style:italic;margin-bottom:4px}
.gods .story p{line-height:1.75;color:#3C3A33}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
@media (max-width:420px){.checks{grid-template-columns:1fr}}
.checks label{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px}
.checks input{appearance:none;width:18px;height:18px;border:1.5px solid var(--sand);border-radius:6px;flex:none;display:grid;place-items:center;margin:0;background:#fff}
.checks input:checked{background:var(--moss);border-color:var(--moss)}
.checks input:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.checks input:checked+span{color:var(--faint);text-decoration:line-through}
.seals{display:flex;gap:16px;flex-wrap:wrap}
.seals button{background:none;border:0;padding:0;width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--moss)}
.seals img{width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(40,39,34,.2))}
.seals img.off{filter:grayscale(1) opacity(.35)}
details.guide{background:var(--panel);border-radius:16px;box-shadow:var(--shadow)}
details.guide summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary b{font-family:var(--display);font-size:19px;font-weight:500}
details.guide summary span{font-size:13px;color:var(--soft);display:block}
details.guide .gb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details.guide .gb p{line-height:1.75;color:#3C3A33}
.foot{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0 8px}
.foot img.s{width:64px;height:auto}
.foot q{font-family:var(--display);font-style:italic;font-size:20px;color:var(--ink);quotes:none;max-width:30ch}
.orn{display:none}

/* Passaporte */
.pcover{position:relative;overflow:hidden;border-radius:6px 18px 18px 6px;background:radial-gradient(circle at 30% 20%,#4E5A45,#2F3829 70%);color:#E9D9AE;aspect-ratio:1.55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:0 18px 40px rgba(40,39,34,.28),inset 10px 0 0 rgba(0,0,0,.18)}
.pcover::before{content:"";position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(233,217,174,.35);border-radius:4px 12px 12px 4px}
.pcover img{width:62px;height:auto;filter:sepia(1) saturate(1.6) brightness(1.15)}
.pcover b{font-family:var(--display);font-weight:500;font-size:clamp(18px,5vw,24px);letter-spacing:.2em;text-transform:uppercase}
.pcover span{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
.datapage{position:relative;overflow:hidden;background:#FFFDF8;color:var(--ink);padding:18px 18px 12px;border-radius:var(--r);box-shadow:var(--shadow);
  background-image:repeating-radial-gradient(circle at 85% 15%,rgba(63,73,56,.06) 0 1px,transparent 1px 10px),repeating-linear-gradient(120deg,rgba(138,63,50,.04) 0 1px,transparent 1px 8px)}
.datapage .top2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line2);padding-bottom:8px;margin-bottom:14px}
.datapage .top2 b{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--moss)}
.datapage .top2 span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.dp{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start}
.fotobox{display:flex;flex-direction:column;align-items:center;gap:4px}
.fotobtn{position:relative;width:96px;height:128px;padding:0;border:1.5px dashed var(--sand);border-radius:10px;background:var(--panel3);overflow:hidden;display:grid;place-items:center}
.fotobtn:disabled{cursor:default}
.fotobtn img{width:100%;height:100%;object-fit:cover;display:block}
.fotobtn:has(img){border-style:solid;border-color:var(--line2)}
.fotoadd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--moss);line-height:1.2;padding:4px}
.fotoadd b{font-size:26px;font-weight:400;line-height:1}
.fototroca{position:absolute;left:0;right:0;bottom:0;background:rgba(40,39,34,.6);color:#fff;font-size:11px;padding:3px 0}
.fotost{font-size:11px;color:var(--soft);text-align:center;max-width:110px}
.cadfotobox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cadfoto{width:60px;height:80px;object-fit:cover;border-radius:8px}
.dp dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.dp dt{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.dp dd{margin:0;font-family:var(--display);font-size:18px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.dp .wide{grid-column:1/-1}
.mrz{margin-top:14px;font-family:ui-monospace,"Courier New",monospace;font-size:clamp(10px,2.9vw,13px);letter-spacing:.12em;color:var(--soft);white-space:pre;overflow:hidden}
.pages{background:#FFFDF8;border-radius:var(--r);box-shadow:var(--shadow);padding:22px 12px 26px;background-image:linear-gradient(90deg,transparent calc(50% - 1px),rgba(40,39,34,.06) 50%,transparent calc(50% + 1px))}
.pages .ph{text-align:center;display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.pages .ph h2{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 10px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
.slot{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.slot img.pin{width:100%;max-width:140px;height:auto;display:block;transition:filter .3s,transform .3s}
.slot.off img.pin{filter:grayscale(1) opacity(.28)}
.slot.on img.pin{filter:drop-shadow(0 8px 14px rgba(40,39,34,.25))}
.slot:hover img.pin{transform:translateY(-2px)}
.slot small{font-size:12px;font-weight:500;color:var(--soft)}
.slot.on small{color:var(--moss)}
.stamp{position:absolute;top:30%;left:50%;width:76px;height:76px;margin-left:-38px;border-radius:50%;border:2.5px solid var(--seal);color:var(--seal);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-14deg);background:rgba(255,253,248,.55);text-transform:uppercase;line-height:1.1;pointer-events:none;box-shadow:inset 0 0 0 4px rgba(255,253,248,.4),inset 0 0 0 5px rgba(163,58,42,.5);mix-blend-mode:multiply}
.stamp b{font-size:12px;font-weight:600;letter-spacing:.12em}
.stamp i{font-style:normal;font-size:9.5px;letter-spacing:.08em}
@media (prefers-reduced-motion:no-preference){
  .stamp.new{animation:carimbo .55s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes carimbo{0%{opacity:0;transform:rotate(-30deg) scale(2)}60%{opacity:1}100%{opacity:1;transform:rotate(-14deg) scale(1)}}
}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.roster li{display:grid;grid-template-columns:34px 36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.roster li:first-child{border-top:0}
.roster .n{font-family:var(--display);color:var(--terra);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.roster img{width:36px;height:36px;border-radius:50%;background:var(--panel3)}
.roster small{display:block;color:var(--soft);font-size:12.5px}
.roster .c{font-size:13px;font-weight:600;color:var(--moss);white-space:nowrap}

/* Mapa */
.mapwrap{display:grid;gap:16px}
@media (min-width:980px){.mapwrap{grid-template-columns:1fr 320px;align-items:start}}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--soft)}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.map{background:#EFE6D4;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.map svg{display:block;width:100%;height:auto}
.map .contour{fill:none;stroke:rgba(138,63,50,.10);stroke-width:1.2}
.map .route{fill:none;stroke:var(--terra);stroke-width:2.5;stroke-dasharray:2 10;stroke-linecap:round;opacity:.8}
.map .pin{cursor:pointer}

.map .pin.off .ring{stroke:var(--faint);stroke-dasharray:4 4}
.map .pin .n{font:600 17px var(--ui);fill:var(--faint);text-anchor:middle;dominant-baseline:central}
.map .pin .lbl{font:500 18px var(--ui);fill:var(--ink);paint-order:stroke;stroke:#EFE6D4;stroke-width:6px;stroke-linejoin:round}

.map .pin .halo{fill:none;stroke:var(--terra);stroke-width:2;opacity:0}
.map .pin.sel .halo{opacity:1}
.map .hotel rect{fill:#FFFCF7;stroke:var(--moss);stroke-width:2}
.map .hotel text{font:500 15px var(--ui);fill:var(--moss);paint-order:stroke;stroke:#EFE6D4;stroke-width:5px}
.map .city .dot{fill:var(--terra)}
.map .city text{font:500 24px var(--display);fill:var(--ink);paint-order:stroke;stroke:#EFE6D4;stroke-width:6px}
.map .city .cnt{font:500 15px var(--ui);fill:var(--soft)}
.map .ui{fill:var(--soft);font:500 15px var(--ui)}
.map .ui-line{stroke:var(--soft);stroke-width:2}
.map .person circle{stroke:#FFFCF7;stroke-width:3}
.map .person text{font:600 13px var(--ui);fill:#fff;text-anchor:middle;dominant-baseline:central}
.map .person .pring{fill:none;stroke-width:2;opacity:.5}
.map.marking svg{cursor:crosshair}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.people li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.people img{width:36px;height:36px;border-radius:50%;background:var(--panel3)}
.people b{font-weight:600}
.people small{display:block;color:var(--soft);font-size:12.5px}
.share{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}

/* Chat */
.chatview{padding:0;max-width:none;height:100%;display:grid;grid-template-rows:auto 1fr auto auto;gap:0}
.chathead{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.chatlog{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.bubble{display:grid;grid-template-columns:32px 1fr;gap:10px;max-width:640px}
.bubble>img{width:32px;height:32px;border-radius:50%;background:var(--panel3)}
.bubble .b{background:var(--panel);box-shadow:var(--shadow);border-radius:4px 18px 18px 18px;padding:9px 14px;min-width:0}
.bubble.me{margin-left:auto;grid-template-columns:1fr}
.bubble.me>img{display:none}
.bubble.me .b{background:var(--moss);color:var(--on-dark);border-radius:18px 4px 18px 18px}

.bubble .del{margin-left:auto;background:none;border:0;color:inherit;opacity:.6;font-size:11px;padding:0}
.bubble .ponto{display:flex;flex-direction:column;gap:6px}
.bubble .ponto b{font-family:var(--display);font-size:18px;font-weight:500}
.bubble.me .ponto .eyebrow{color:var(--sand)}
.bubble .chatfoto{display:block;max-width:100%;width:280px;margin-top:4px;border-radius:12px}
.dayline{align-self:center;font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.picker{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;background:var(--panel)}
.picker select,.picker input{flex:1 1 180px;min-width:0}
.picker.loc{flex-direction:column;flex-wrap:nowrap;gap:12px;max-height:60vh;overflow-y:auto}
.locopt{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.eyebrow.vivo::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#C8412F;margin-right:8px;vertical-align:1px;box-shadow:0 0 0 3px rgba(200,65,47,.2)}
.composer{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:flex-end;background:var(--panel)}
.composer textarea{min-height:44px;max-height:140px;border-radius:22px;padding:10px 16px;background:var(--bg)}
.composer .note{font-size:13px;color:var(--soft);padding:4px 2px;background:none;border:0}
.composer .note:empty{display:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;flex:none;color:var(--soft)}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{color:var(--on-dark);background:var(--moss);border-color:var(--moss)}

/* Saberes */
.sabgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.sab{display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:center;background:var(--panel);border:0;border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;text-align:left}
.sab img{width:54px;height:auto}
.sab img.sym{width:44px;height:44px;justify-self:center}
.sab .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.sab b{font-family:var(--display);font-size:18px;font-weight:500;line-height:1.25}
.sab .tx span{font-size:13px;color:var(--soft)}
.sab.locked{background:transparent;box-shadow:none;border:1.5px dashed var(--line2)}
.sab.locked img{filter:grayscale(1) opacity(.35)}
.sab.locked b{color:var(--soft)}
.reader{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.reader .rbadge{width:120px;height:auto;align-self:center;filter:drop-shadow(0 8px 14px rgba(40,39,34,.2))}
.reader .rbadge.sym{width:72px;height:72px;filter:none}
.reader h1{font-size:clamp(28px,7vw,38px);text-align:center}
.reader .body p{font-family:var(--display);font-size:19px;line-height:1.8;margin-bottom:1em;color:#3C3A33}
.reader .src{font-size:13px;color:var(--soft);border-top:1px solid var(--line);padding-top:12px}

/* Cadastro e folhas */
.welcome{max-width:520px;margin:0 auto;padding:26px 16px 40px;display:flex;flex-direction:column;gap:18px;text-align:center}
.welcome h1{font-size:clamp(28px,7vw,36px)}
.welcome form{display:flex;flex-direction:column;gap:12px;text-align:left}
.welcome label,.sheet label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--soft)}
.sheet{position:fixed;inset:0;background:rgba(40,39,34,.35);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}

.sheet>div,.sheet form{background:var(--panel);border-radius:24px;box-shadow:0 20px 60px rgba(40,39,34,.25);padding:24px 20px;width:100%;max-width:500px;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet .chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}

.sheet .bigwrap{position:relative;width:min(56%,200px);margin:0 auto}

.sheet .bigwrap .stamp i{font-size:11px}
.sheet h2{text-align:center;font-size:27px}
.saber{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.saber h3{font-size:22px;font-style:italic}
.saber p{font-family:var(--display);font-size:17.5px;line-height:1.7;color:#3C3A33}
.saber .src{font-family:var(--ui);font-size:12.5px;color:var(--faint)}
.fotofield{display:flex;flex-direction:column;gap:8px}
.fotofield img{width:100%;max-width:100%;max-height:200px;object-fit:cover;border-radius:12px}
.unlock{display:flex;gap:8px;flex-wrap:wrap}
.unlock input{flex:1 1 160px;min-width:0}
.secret{font-size:12.5px;color:var(--soft);border-top:1px dashed var(--line2);padding-top:10px}
.secret code{font-family:ui-monospace,Menlo,monospace;background:var(--panel3);padding:1px 6px;border-radius:6px;color:var(--ink)}

/* Cabeçalho e menu em couro, com latão */
.top{background:linear-gradient(180deg,#3B2A1C,#2E2116);border-bottom:1px solid #1E150D;box-shadow:inset 0 -1px 0 rgba(226,190,120,.25);color:#F1E2BC;backdrop-filter:none}
.top::after{content:"";position:absolute}
.brand img{width:40px;height:auto}
.brand{flex-direction:row;gap:10px;text-align:left}

.brand span{color:#C9A56A;letter-spacing:.24em}
.me{background:rgba(241,226,188,.08);border:1px solid rgba(226,190,120,.35);box-shadow:none}
.me b{color:#E2BE78}
nav.tabs{background:linear-gradient(0deg,#2B1F14,#3B2A1C);border-top:1px solid #1E150D;box-shadow:inset 0 1px 0 rgba(226,190,120,.22);grid-template-columns:repeat(7,minmax(52px,1fr));overflow-x:auto;scrollbar-width:none}

nav.tabs button[aria-current="page"]{color:#F1E2BC}
nav.tabs button[aria-current="page"] .ic{background:linear-gradient(180deg,#E2BE78,#B98A43);color:#2B1F14;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px rgba(0,0,0,.35)}
@media (min-width:900px){nav.tabs{background:linear-gradient(90deg,#2B1F14,#3B2A1C);border-right:1px solid #1E150D;grid-template-columns:1fr}}

/* Mapa da Expedição */
.map{background:#EAD6A8;border-radius:10px;box-shadow:0 10px 30px rgba(59,42,28,.25)}
.map .terra{fill:#E4CC98;stroke:#6B4A2A;stroke-width:1;stroke-linejoin:round;opacity:.75}
.map .terra.india{fill:#EFDDB3;opacity:1;stroke-width:1.6}
.map .rio{fill:none;stroke:#5F8190;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.map .riolbl{font:italic 500 15px var(--display);fill:#3F5E6A;letter-spacing:.06em}
.map .grade line{stroke:#6B4A2A;stroke-width:.5;stroke-dasharray:3 5;opacity:.35}
.map .grade text{font:500 10px var(--ui);fill:#6B4A2A;opacity:.6}
.map .rota{fill:none;stroke:#A3231A;stroke-width:4;stroke-linecap:round;stroke-dasharray:.012 .008}
.map .rota.fina{stroke-width:2.5}
.map .rota-sombra{fill:none;stroke:rgba(90,20,10,.18);stroke-width:8;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .map .rota.desenha{stroke-dasharray:1;stroke-dashoffset:1;animation:traca 3.2s ease-in-out forwards}
  @keyframes traca{to{stroke-dashoffset:0}}
  .explorador .bob{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:scale(.74) translateY(0)}50%{transform:scale(.74) translateY(-3px)}}
  .explorador .vivo{animation:pulso 1.8s ease-out infinite;transform-origin:22px 62px;transform-box:fill-box}
  @keyframes pulso{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
}
.map .vivo{fill:rgba(200,65,47,.45)}
.map .cidade{cursor:pointer}
.map .cidade .c1{fill:#F1E2BC;stroke:#A3231A;stroke-width:2.5}
.map .cidade .c2{fill:#A3231A}
.map .cnome{font:600 21px var(--display);fill:#3B2A1C;letter-spacing:.14em;paint-order:stroke;stroke:#EFDDB3;stroke-width:5px;stroke-linejoin:round}
.map .ccnt{font:italic 500 14px var(--display);fill:#6B4A2A;paint-order:stroke;stroke:#EFDDB3;stroke-width:4px}
.map .cart1{font:600 17px var(--display);fill:#3B2A1C;letter-spacing:.3em}
.map .cart2{font:italic 500 13px var(--display);fill:#6B4A2A}
.map .cmp{font:600 13px var(--display);fill:#3B2A1C}
.map .escala text{font:500 12px var(--ui);fill:#3B2A1C}
.map .pin .ring{fill:#F4E6C4;stroke:#6B4A2A;stroke-width:2}
.map .pin.off .ring{stroke:#A3231A;stroke-dasharray:3 3}
.map .pin .n{font:700 16px var(--ui);fill:#A3231A}
.map .pin .lbl{font:500 17px var(--display);fill:#3B2A1C;stroke:#EAD6A8}
.map .pin .halo{stroke:#A3231A}
.map .hotel rect{fill:#F4E6C4;stroke:#3B2A1C}
.map .hotel text{font:italic 500 15px var(--display);fill:#3B2A1C;stroke:#EAD6A8}
.explorador .etq{fill:#F4E6C4;stroke:#6B4A2A;stroke-width:1}
.explorador .etqt{font:600 10.5px var(--ui);fill:#3B2A1C;text-anchor:middle}
.meuexp{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:4px 14px 4px 6px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.bonecosvg{display:block}
.bonecosvg.mini{width:26px;height:39px}
.bonecosvg.big{width:min(60vw,200px);height:auto;margin:0 auto}

.builder{display:grid;gap:18px}
@media (min-width:720px){.builder{grid-template-columns:260px 1fr;align-items:start}}
.preview{background:radial-gradient(circle at 50% 40%,#F4E6C4,#E4CC98);border-radius:var(--r);padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow)}

.controls{display:flex;flex-direction:column;gap:8px}

.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:13px}

/* Estúdio de fotos */
.estudio{display:grid;gap:18px}
@media (min-width:820px){.estudio{grid-template-columns:1fr 300px;align-items:start}}
.fotoframe{background:#2B1F14;border-radius:var(--r);padding:12px;display:grid;place-items:center;box-shadow:var(--shadow)}

.fotovazia{background:var(--panel);border:1.5px dashed var(--sand);border-radius:var(--r);padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fotovazia img{width:90px;height:auto}
.fotovazia b{font-family:var(--display);font-size:22px;font-weight:500}
.fotovazia span{color:var(--soft);max-width:36ch}

.cover{display:block;width:min(64%,260px);max-width:100%;height:auto;margin:0 auto;border-radius:6px 14px 14px 6px;box-shadow:0 18px 40px rgba(40,39,34,.3)}

/* Passaporte em 3D */
.livrosheet{align-items:center;background:radial-gradient(circle at 50% 40%,rgba(59,42,28,.55),rgba(20,14,8,.85))}
.livrobox{background:none!important;box-shadow:none!important;align-items:center;max-width:460px!important;overflow:visible!important}

.pg{position:relative;width:100%;height:100%;background:#FBF4E4;color:#282722;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  background-image:repeating-radial-gradient(circle at 50% 50%,rgba(122,82,46,.05) 0 1px,transparent 1px 9px),linear-gradient(90deg,rgba(40,28,15,.12),transparent 8%)}

.pg.papel{background-color:#F6EDDA}

.pgfoto img{width:100%;height:100%;object-fit:cover}

.pg dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;margin:8px 0 0;width:100%}
.pg dt{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9A917F;align-self:center}
.pg dd{margin:0;font-family:var(--display);font-size:16px;font-weight:600}
.pgnum{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8A3F32}
.pg.selos{justify-content:space-around}
.pgselo{display:flex;flex-direction:column;align-items:center;gap:2px}
.pgart{position:relative;width:30%;min-width:78px}
.pgart img{width:100%;height:auto;display:block}
.pgselo:not(.on) .pgart img{filter:grayscale(1) opacity(.22)}
.pgart .stamp{width:64px;height:64px;margin-left:-32px}
.pgnome{font-family:var(--display);font-size:15px;font-weight:600}
.pgdia{font-size:11px;color:#6B6556}
.pg.fim{justify-content:center;gap:14px}
.fimsim{width:40%;height:auto;opacity:.85}
.pgfrase{font-family:var(--display);font-style:italic;font-size:18px;line-height:1.4;max-width:22ch}
.livronav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;width:100%}

.livrobox .btn.ghost{color:#E2BE78}

.folhear{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#3B2A1C,#5A4128);color:#F1E2BC;border:0;border-radius:var(--r);padding:14px 18px;text-align:left;box-shadow:var(--shadow)}

/* Passaporte realista: máquina de escrever */
:root{--type:"Special Elite","Courier Prime","Courier New",monospace;--mono:"Courier Prime","Courier New",monospace}

.fds{display:flex;flex-direction:column;gap:7px;min-width:0}

.mrz{font-family:var(--mono)!important;font-size:clamp(9px,2.6vw,12px)!important;color:#3B3328!important}

.pg.dados{justify-content:flex-start;align-items:stretch;text-align:left}

.pg .pgfoto{width:100%;margin:0}
.pg .fv{font-size:11.5px}.pg .fd.big .fv{font-size:13.5px}.pg .fl{font-size:7px}

.pgnome{font-family:var(--type)!important;font-size:13px!important;letter-spacing:.06em}
.pgdia{font-family:var(--mono)!important;font-size:9.5px!important;letter-spacing:.08em;color:#6B5A43!important}

.foot q{font-size:clamp(11px,3vw,14px)!important;white-space:nowrap;max-width:none!important}

.fcats{display:flex;border-bottom:1px solid var(--line2);gap:4px;margin-bottom:4px}

.explorador{cursor:pointer}
.explorador .onl{fill:#3FA34D;stroke:#F4E6C4;stroke-width:1.5}
.balao rect{fill:#FFFDF6;stroke:#3B2A1C;stroke-width:1.2}

@media (prefers-reduced-motion:no-preference){.balao{animation:sobe .35s ease-out both}@keyframes sobe{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

.dot.on{background:#3FA34D;box-shadow:0 0 0 3px rgba(63,163,77,.2)}
.reacoes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.reac{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 4px;font-size:11px;color:var(--soft)}
.reac .e{font-size:22px;line-height:1.1}
.reac:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:#3B2A1C;color:#F1E2BC;padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}


/* Controles do passaporte 3D */
.livrobox{position:relative}
.livrostage{align-items:center;gap:6px}
.livro{margin-left:0!important}
.lvseta{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(233,215,176,.45);background:rgba(20,14,8,.35);color:#F1E2BC;display:grid;place-items:center;backdrop-filter:blur(4px);z-index:5}
.lvseta:disabled{opacity:.25;cursor:default}
.lvseta:not(:disabled):hover{border-color:#E9D7B0;background:rgba(233,215,176,.12)}

.lvponto[aria-current="true"]{background:#E9D7B0;width:20px;border-radius:4px}
@media (max-width:480px){.lvseta{width:34px;height:34px}.livro{width:min(70vw,320px)!important}}


/* Prévia do explorador acompanha a rolagem */

@media (max-width:719px){
  .preview{flex-direction:row;justify-content:center;gap:14px;padding:10px 14px}
  .preview .bonecosvg.big{width:auto;height:150px;margin:0}

}

  </nav>
</div>

<script>
(function(){
"use strict";

// ---------- estado ----------
const S = {
  tab: "travessia",
  roteiro: null, roteiroErro: false,
  dias: [], cidades: [], locais: [], ens: [], chat: [], posicoes: [], viajantes: [],
  vReady: false, dbReady: false, pularCadastro: false,
  uid: null, me: null, isOwner: false, canChat: null,
  db: null, user: null, assets: null, perfis: {},
  diaAberto: null, ensSel: null, cidadeSel: "india", localSel: null,
  unlockMsg: null, novoSelo: null, marcando: false, posMsg: null, pontoAberto: false, proj: null, local: {}, checks: {}
};
try { const t = localStorage.getItem("cdi-tab2"); if (t) S.tab = t; } catch (e) {}
try { S.local = JSON.parse(localStorage.getItem("cdi-ins") || "{}") || {}; } catch (e) {}
try { S.checks = JSON.parse(localStorage.getItem("cdi-checks") || "{}") || {}; } catch (e) {}

const SVGTAGS = new Set(["svg","g","path","circle","ellipse","text","line","rect","title","image"]);
function h(tag, attrs, ...kids) {
  const el = SVGTAGS.has(tag) ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}
const $ = s => document.querySelector(s);
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const byOrdem = (a, b) => (a.ordem ?? 999) - (b.ordem ?? 999);
const blob = id => "/_blob/" + id;
const badgeSrc = l => l && l.insignia ? `insignias/${l.insignia}.webp` : null;
const deusSrc = n => "deuses/" + norm(n) + ".webp";
const FRESCO = 3 * 60 * 60 * 1000;
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
const nn = n => String(n).padStart(2, "0");
const MES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const dataSelo = ts => { const d = new Date(ts); return nn(d.getDate()) + " " + MES[d.getMonth()] + " " + String(d.getFullYear()).slice(2); };

// ---------- quem é quem ----------
const eu = () => S.viajantes.find(v => v.id === S.uid);
function numeros() { const m = {}; S.viajantes.filter(v => !v.lider).sort((a, b) => (a.ts || 0) - (b.ts || 0)).forEach((v, i) => m[v.id] = i + 1); return m; }
function rotulo(id) {
  const v = S.viajantes.find(x => x.id === id);
  if (v && v.lider) return "Líder da travessia";
  const n = numeros()[id]; return n ? "Viajante nº " + nn(n) : "";
}
function nomeDe(id) {
  if (id === S.uid) return "Você";
  const v = S.viajantes.find(x => x.id === id);
  return (v && v.nome) || S.perfis[id]?.name || "Viajante";
}
perfis.pend = new Set();
async function perfis(ids) {
  const falta = [...new Set(ids)].filter(id => id && !S.perfis[id] && !perfis.pend.has(id));
  if (!falta.length || !S.user) return;
  falta.forEach(id => perfis.pend.add(id));
  Object.assign(S.perfis, await S.user.profiles(falta)); render();
}
const avatar = id => { const v = S.viajantes.find(x => x.id === id); return v && v.foto ? blob(v.foto) : (S.perfis[id]?.avatarUrl || BLANK); };
// Foto do passaporte: recorta no centro em 3x4 e reduz antes de enviar.
async function fotoPassaporte(file) {
  const bmp = await createImageBitmap(file), alvo = 3 / 4;
  let w = bmp.width, hh = bmp.height, sx = 0, sy = 0;
  if (w / hh > alvo) { const nw = hh * alvo; sx = (w - nw) / 2; w = nw; } else { const nh = w / alvo; sy = (hh - nh) / 3; hh = nh; }
  const c = document.createElement("canvas"); c.width = 600; c.height = 800;
  c.getContext("2d").drawImage(bmp, sx, sy, w, hh, 0, 0, 600, 800);
  const b = await new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
  return (await S.assets.upload(b)).id;
}
function campoFoto(onId, status) {
  const fi = h("input", { type: "file", accept: "image/*", id: "foto-pass-" + Math.random().toString(36).slice(2), hidden: true, onchange: async () => {
    const f = fi.files[0]; if (!f) return; status.textContent = "Enviando sua foto…";
    try { const id = await fotoPassaporte(f); await onId(id); status.textContent = "Foto pronta."; }
    catch (e) { status.textContent = e && e.code ? erroFoto(e) : "Não consegui usar essa foto. Tente outra, em JPG ou PNG."; }
    fi.value = "";
  } });
  return fi;
}

// ---------- selos ----------
const minhas = () => ({ ...S.local, ...((eu() && eu().insignias) || {}) });
const aberto = l => !!(l && (l.aberto || minhas()[l.id]));
const conquistasDe = v => S.locais.filter(l => l.insignia && (l.aberto || (v.insignias || {})[l.id])).length;
const insigniaLocais = () => S.locais.filter(l => l.insignia).sort(byOrdem);
const localDe = id => S.locais.find(l => l.id === id);
const cidadeDe = id => S.cidades.find(c => c.id === id);
const hojeIso = () => new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
const diaDe = n => (S.roteiro?.dias || []).find(d => d.n === n);
function disponivel(l) {
  if (S.isOwner || l.aberto) return true;
  const d = diaDe(l.dia); return !d || hojeIso() >= d.iso;
}
async function selar(l, palavra) {
  if (norm(palavra) !== norm(l.codigo)) return { ok: false, text: "Essa não é a palavra deste lugar. Confira com a líder e tente de novo." };
  const ts = Date.now();
  S.local = { ...S.local, [l.id]: ts };
  try { localStorage.setItem("cdi-ins", JSON.stringify(S.local)); } catch (e) {}
  if (S.db && S.uid && eu()) { try { await S.db.doc("viajantes/" + S.uid).update({ insignias: { [l.id]: ts } }); } catch (e) {} }
  S.novoSelo = l.id;
  return { ok: true, text: "Selo carimbado no seu passaporte." };
}

// ---------- relógios ----------
const IST = () => new Date().toLocaleTimeString("pt-BR", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit" });
const BRT = () => new Date().toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit" });
const faltam = () => Math.ceil((new Date("2026-11-04T00:00:00+05:30").getTime() - Date.now()) / 86400000);

// ---------- navegação ----------
function go(tab) {
  S.tab = tab; try { localStorage.setItem("cdi-tab2", tab); } catch (e) {}
  render(); $("#main").scrollTop = 0;
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (!b) return; if (b.dataset.tab === "ensinamentos") S.ensSel = null; if (b.dataset.tab === "mapa") S.montando = false; go(b.dataset.tab); });
$("#me").addEventListener("click", () => go("passaporte"));

function render() {
  for (const b of document.querySelectorAll("#tabs button")) {
    if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  }
  const act = document.activeElement, actId = act && act.id, sel = act && "selectionStart" in act ? [act.selectionStart, act.selectionEnd] : null;
  const draft = act && actId && act.value !== undefined ? act.value : null;
  const chatDraft = $("#chat-input")?.value;
  const main = $("#main"), scroll = main.scrollTop;
  pintaMe();
  const precisaCadastro = S.db && S.uid && S.vReady && !eu() && !S.pularCadastro;
  main.replaceChildren(precisaCadastro ? vCadastro() :
    S.tab === "passaporte" ? vPassaporte() : S.tab === "ensinamentos" ? vSaberes() : S.tab === "mapa" ? vMapa() : S.tab === "explorador" ? vExplorador() : S.tab === "fotos" ? vFotos() : S.tab === "conversa" ? vConversa() : vTravessia());
  main.scrollTop = scroll;
  if (S.tab === "conversa") {
    const inp = $("#chat-input"); if (inp && chatDraft) inp.value = chatDraft;
    const log = $("#chatlog"); if (log) log.scrollTop = log.scrollHeight;
  }
  tickRelogios();
  const el = actId && document.getElementById(actId);
  if (el && el !== act) { if (draft != null && "value" in el && el.type !== "file" && el.type !== "checkbox") el.value = draft; el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
}
function pintaMe() {
  const b = $("#me"), v = eu();
  if (!S.uid) { b.hidden = true; return; }
  b.hidden = false;
  b.setAttribute("aria-label", v ? "Meu passaporte" : "Emitir passaporte");
  b.replaceChildren(h("img", { src: avatar(S.uid), alt: "" }), h("b", { text: v ? (v.lider ? "Líder" : "Nº " + nn(numeros()[S.uid] || 0)) : "Emitir" }));
}
function carregando(txt) {
  return h("div", { class: "empty" }, h("h3", { text: S.dbReady ? "Nada por aqui ainda" : "Abrindo a travessia…" }),
    h("p", { text: txt || (S.dbReady ? "Quando a líder publicar, aparece aqui." : "Se demorar, abra este aplicativo pelo link do Claude, com a sua conta.") }));
}

// ---------- cadastro ----------
function vCadastro() {
  const nome = h("input", { type: "text", id: "cad-nome", maxlength: "40", autocomplete: "given-name", placeholder: "Como a caravana vai te chamar" });
  const cid = h("input", { type: "text", id: "cad-cidade", maxlength: "40", placeholder: "Ex.: São Paulo" });
  const erro = h("p", { class: "msg err", role: "alert" });
  if (S.me && S.me.name) nome.value = S.me.name.split(" ")[0];
  return h("section", { class: "welcome" },
    h("img", { class: "cover", src: "img/passaporte-capa.webp", alt: "Passaporte da Travessia · Caravana do Céu" }),
    h("p", { class: "eyebrow", text: "Emissão do passaporte" }),
    h("h1", { text: "Seu passaporte da Índia Sagrada" }),
    h("p", { class: "lede", text: "Com ele você recebe seu número de viajante, conversa com a caravana e carimba os selos de cada lugar sagrado da travessia." }),
    h("form", { onsubmit: async e => {
      e.preventDefault();
      if (!nome.value.trim()) { erro.textContent = "Escreva seu nome."; return; }
      const doc = { nome: nome.value.trim(), cidade: cid.value.trim(), ts: Date.now(), insignias: { ...S.local } };
      if (S.cadFoto) doc.foto = S.cadFoto;
      if (S.isOwner) doc.lider = true;
      try { await S.db.doc("viajantes/" + S.uid).set(doc); S.tab = "passaporte"; }
      catch (err) { erro.textContent = "Não consegui emitir seu passaporte. Peça à líder um convite com permissão para participar."; }
    } },
      h("label", { for: "cad-nome" }, "Seu nome", nome),
      h("label", { for: "cad-cidade" }, "De onde você vem", cid),
      S.assets ? (() => {
        const st = h("span", { class: "small", role: "status" }), prev = h("img", { alt: "", hidden: true, class: "cadfoto" });
        const fi = campoFoto(async id => { S.cadFoto = id; prev.src = blob(id); prev.hidden = false; }, st);
        return h("div", { class: "cadfotobox" }, prev, h("button", { class: "btn", type: "button", onclick: () => fi.click() }, "Foto para o passaporte (opcional)"), fi, st);
      })() : null,
      erro, h("button", { class: "btn gold", type: "submit" }, "Emitir meu passaporte")),
    h("button", { class: "btn ghost", type: "button", onclick: () => { S.pularCadastro = true; render(); } }, "Agora não, só quero olhar"));
}

// ---------- Instrumentos antigos (relógios e contador) ----------
function relogio(tz, nome) {
  const svg = h("svg", { viewBox: "0 0 120 132", class: "relogio", role: "img", "aria-label": "Relógio, hora de " + nome });
  let marcas = "";
  for (let i = 0; i < 60; i++) { const a = i * 6 * Math.PI / 180, r1 = i % 5 ? 43 : 39, r2 = 46; marcas += `<line x1="${60 + Math.sin(a) * r1}" y1="${72 - Math.cos(a) * r1}" x2="${60 + Math.sin(a) * r2}" y2="${72 - Math.cos(a) * r2}" stroke="#3B2A1C" stroke-width="${i % 5 ? .6 : 1.6}"/>`; }

// ---------- fotos ----------
async function reduzir(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 2.5e6) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
  } catch (e) { return file; }
}
async function subirFoto(file) { if (!S.assets) throw { code: "not_granted" }; return (await S.assets.upload(await reduzir(file))).id; }
function erroFoto(e) {
  const c = e && e.code;
  return c === "too_large" ? "A foto é grande demais. Tente uma menor." : c === "unsupported_type" ? "Esse formato não funciona. Use JPG ou PNG." :
    c === "quota_or_state" ? "O espaço de fotos do aplicativo acabou." : "Não consegui enviar a foto. Tente de novo.";
}

// ---------- Editor (só a líder) ----------
function editar(tipo, item) {
  item = item || {};
  const cids = S.cidades.slice().sort(byOrdem), locs = S.locais.slice().sort(byOrdem);
  const INS = ["", "india", "taj-mahal", "jaipur", "galta-ji", "varanasi", "ganga-aarti", "manikarnika", "batismo", "beatles-ashram", "rishikesh", "kunjapuri", "caverna"];

      ["itens", "Programação (uma linha por item: 18:00 | Ganga Aarti)", "linhas"], ["nota", "Nota", "area"], ["ordem", "Ordem", "num"]], obrig: "titulo" },
    local: { col: "locais", t: "lugar", campos: [["nome", "Nome"], ["cidadeId", "Cidade", "sel", cids.map(c => [c.id, c.nome])], ["insignia", "Insígnia (vazio = hotel ou ponto de apoio)", "sel", INS.map(i => [i, i || "Nenhuma"])],
      ["dia", "Dia do roteiro", "num"], ["ordem", "Ordem", "num"], ["lat", "Latitude", "num"], ["lng", "Longitude", "num"], ["busca", "Busca no Google Maps"],
      ["dica", "Dica enquanto não conquistada", "area"], ["descricao", "Texto depois de conquistada", "area"], ["codigo", "Palavra do lugar"], ["aberto", "Liberada para todos", "chk"]], obrig: "nome" },
    ens: { col: "ensinamentos", t: "ensinamento", campos: [["titulo", "Título"], ["categoria", "Categoria"],
      ["localId", "Abre com a insígnia de (vazio = sempre aberto)", "sel", [["", "Sempre aberto"], ...locs.filter(l => l.insignia).map(l => [l.id, l.nome])]],
      ["resumo", "Resumo curto"], ["texto", "Texto (separe parágrafos com uma linha em branco)", "area"], ["foto", "Foto", "foto"], ["fonte", "Fontes"], ["ordem", "Ordem", "num"]], obrig: "titulo" }
  }[tipo];
  const inputs = {};
  const campos = F.campos.map(([k, label, kind, opts]) => {
    const id = `ed-${tipo}-${k}`; let el;
    if (kind === "foto") {
      const prev = h("img", { alt: "", hidden: !item[k], src: item[k] ? blob(item[k]) : null }), st = h("span", { class: "small", role: "status" });
      const tirar = h("button", { class: "btn ghost", type: "button", hidden: !item[k], onclick: () => { el.dataset.id = ""; prev.hidden = true; tirar.hidden = true; } }, "Tirar foto");
      const fi = h("input", { type: "file", accept: "image/*", id, onchange: async () => {

        try { const nid = await subirFoto(f); el.dataset.id = nid; prev.src = blob(nid); prev.hidden = false; tirar.hidden = false; st.textContent = "Foto pronta. Toque em Salvar."; } catch (e) { st.textContent = erroFoto(e); }
      } });
      el = h("div", { class: "fotofield" }, prev, S.assets ? fi : h("span", { class: "small", text: "O envio de fotos não está disponível nesta visualização." }), h("div", { class: "actions" }, tirar, st));
      el.dataset.id = item[k] || ""; inputs[k] = [el, kind];
      return h("div", { class: "fotofield" }, h("span", { class: "small", text: label }), el);
    }
    if (kind === "area" || kind === "linhas") el = h("textarea", { id, rows: kind === "linhas" ? "8" : "4" });
    else if (kind === "sel") el = h("select", { id }, opts.map(([v, t]) => h("option", { value: v, text: t })));
    else if (kind === "chk") el = h("input", { id, type: "checkbox" });
    else el = h("input", { id, type: kind === "num" ? "number" : "text", step: kind === "num" ? "any" : null });
    if (kind === "chk") el.checked = !!item[k];
    else if (kind === "linhas") el.value = (item[k] || []).map(it => (it.hora ? it.hora + " | " : "") + it.texto).join("\n");
    else el.value = item[k] ?? "";
    inputs[k] = [el, kind];
    return kind === "chk" ? h("label", { class: "chk", for: id }, el, label) : h("label", { for: id }, label, el);
  });
  let conf = false;
  const del = item.id ? h("button", { class: "btn danger", type: "button", onclick: async () => {
    if (!conf) { conf = true; del.textContent = "Toque de novo para apagar"; return; }
    await S.db.doc(`${F.col}/${item.id}`).delete().catch(() => {}); closeSheets();
  } }, "Apagar") : h("span");
  const erro = h("p", { class: "msg err", role: "alert" });
  const form = h("form", { onsubmit: async e => {

      else if (kind === "foto") { if (el.dataset.id) data[k] = el.dataset.id; }
      else if (kind === "num") { if (el.value !== "") data[k] = Number(el.value); }
      else if (kind === "linhas") data[k] = el.value.split("\n").map(s => s.trim()).filter(Boolean).map(s => { const i = s.indexOf("|"); return i > -1 ? { hora: s.slice(0, i).trim(), texto: s.slice(i + 1).trim() } : { hora: "", texto: s }; });
      else if (el.value.trim() !== "") data[k] = el.value.trim(); }
    if (!data[F.obrig]) { erro.textContent = "Preencha o campo " + F.obrig + "."; return; }
    try { await (item.id ? S.db.doc(`${F.col}/${item.id}`) : S.db.collection(F.col).doc()).set(data); closeSheets(); }

    campos, erro,
    h("div", { class: "foot" }, del, h("div", { class: "actions" }, h("button", { class: "btn", type: "button", onclick: closeSheets }, "Cancelar"), h("button", { class: "btn gold", type: "submit" }, "Salvar"))));

// ---------- dados ----------
function listen(col, key, q, after) {
  (q || S.db.collection(col)).onSnapshot(snap => {
    S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.dbReady = true; if (after) after(); render(); refreshSheet();
  }, () => { S.dbReady = true; if (after) after(); render(); });
}

fetch("dados/geo.json").then(r => r.ok ? r.json() : null).then(j => { if (j) { S.geo = j; if (S.tab === "mapa") render(); } }).catch(() => {});
fetch("dados/travessia.json").then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(j => { S.roteiro = j; render(); }).catch(() => { S.roteiroErro = true; render(); });
render();
(async () => {
  const [db, user, assets, room] = await Promise.all(["db", "user", "assets", "room"].map(n => window.claude?.use?.(n) ?? null));
  S.db = db; S.user = user; S.assets = assets; S.room = room;
  if (room) {
    room.onPeers(ch => {
      S.online = new Set(ch.peers.map(p => p.by).filter(Boolean));
      for (const p of ch.peers) { const pr = p.presence || {}; if (p.by && !p.isMe && isFinite(pr.lat)) S.aoVivo[p.by] = { lat: pr.lat, lng: pr.lng, cidadeId: pr.cidadeId, ts: Date.now() }; }
      for (const p of ch.left) if (p.by) delete S.aoVivo[p.by];
      if (S.tab === "mapa") render();
    }, () => {});
    room.on("reacao", m => {
      const d = m.data || {}; if (!d.para || !m.by) return;
      const r = REACOES.find(x => x[0] === d.r), texto = d.r === "fala" ? String(d.texto || "").slice(0, 80) : r ? r[1] + " " + r[2] : "";
      S.baloes[d.para] = { de: m.by, r: d.r, texto: d.r === "fala" ? nomeDe(m.by) + ": " + texto : (r ? r[1] : "") + " " + nomeDe(m.by).split(" ")[0], ts: Date.now() };
      if (d.para === S.uid && !m.isMe) avisoReacao(nomeDe(m.by) + ": " + texto);
      if (S.tab === "mapa") { render(); setTimeout(() => { if (S.tab === "mapa") render(); }, 8200); }
    }, () => {});
  }
  if (user) { const me = await user.me(); S.me = me; S.uid = me.id; S.isOwner = me.isOwner; perfis([me.id]); }

})();
