<title>Caravana Índia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@400;500;600&family=Raleway:wght@300&family=Cinzel:wght@500;600;700;900&family=Jost:wght@500;600&family=Julius+Sans+One&family=Caveat:wght@400;600&family=Rock+Salt&family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Visual claro da Caravana do Céu: papel, carvão, musgo, terracota e areia. */
:root{
  color-scheme:light;
  --bg:#F5EFE4; --panel:#FFFCF7; --panel2:#FBF6EE; --panel3:#EFE6D6;
  --ink:#282722; --soft:#6B6556; --faint:#9A917F;
  --moss:#3F4938; --terra:#8A3F32; --sand:#C7B493; --paper:#E5DAC5; --gold:#A8843E;
  --line:rgba(40,39,34,.10); --line2:rgba(40,39,34,.18);
  --ok:#3F6B3A; --err:#A0402F; --seal:#A33A2A; --on-dark:#FFFCF7;
  --shadow:0 1px 2px rgba(40,39,34,.05),0 8px 28px rgba(40,39,34,.07);
  --display:"Lora",Georgia,"Times New Roman",serif;
  --ui:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:400;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--terra)}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
h1,h2,h3,h4,h5{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.app{height:100%;width:100%;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "main" "nav";background:var(--bg)}
.top{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 14px;background:rgba(245,239,228,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topside{display:flex;min-width:0}.topside.right{justify-content:flex-end}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;flex:none}
.brand b{display:block;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;line-height:1.1}
.brand span{display:block;font-size:11px;color:var(--soft);letter-spacing:.14em;text-transform:uppercase}
.me:not(.bubble){display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:12px;color:var(--soft);min-width:0;box-shadow:var(--shadow)}
.me:not(.bubble) img{width:28px;height:28px;border-radius:50%;flex:none;background:var(--panel3)}
.me:not(.bubble) b{font-weight:600;color:var(--moss);font-size:12px;white-space:nowrap}
.me:not(.bubble) span{display:none}
.me[hidden]{display:none!important}
main{grid-area:main;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;min-height:0}
.view{padding:22px 16px 48px;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

nav.tabs{grid-area:nav;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,252,247,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--soft);min-width:0}
nav.tabs .ic{width:52px;height:34px;border-radius:999px;display:grid;place-items:center;transition:background .2s,color .2s}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ic{background:var(--moss);color:var(--on-dark)}
@media (min-width:900px){
  .app{grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top top" "nav main"}
  nav.tabs{grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding:18px 12px;gap:6px;background:var(--bg)}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px}
}

.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--terra)}
.rule{display:flex;align-items:center;gap:12px}
.rule::after{content:"";flex:1;height:1px;background:var(--line2)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:clamp(28px,6.5vw,36px)}
.lede{font-family:var(--display);font-style:italic;font-size:18px;line-height:1.55;color:var(--soft);max-width:60ch}
.small{font-size:13px;color:var(--soft)}
.msg{font-size:13.5px}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 18px;border:1px solid var(--line2);background:var(--panel);font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--moss)}
.btn.gold{background:var(--moss);border-color:var(--moss);color:var(--on-dark)}
.btn.gold:hover{background:#34402E}
.btn.ghost{background:none;border-color:transparent;padding-inline:6px;color:var(--soft)}
.btn.danger{color:var(--err);border-color:var(--err);background:none}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:22px}
.empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--soft);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:20px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:11px 14px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--moss);outline:none;box-shadow:0 0 0 3px rgba(63,73,56,.12)}

/* Roteiro: abertura */
.hero{text-align:center;padding:18px 8px 4px;display:flex;flex-direction:column;align-items:center;gap:10px}
.hero .logo{width:56px;height:auto}
.hero h1{font-family:"Cinzel",Georgia,serif;font-weight:500;font-size:clamp(28px,7.6vw,44px);line-height:1.1;letter-spacing:.04em;color:#3B2A1C}
.hero .route{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--moss)}
.hero .line{display:none}
.hero .intro{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.55;color:var(--soft);max-width:38ch}
.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.clock div{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:14px 8px;text-align:center}
.clock b{display:block;font-family:var(--display);font-size:28px;font-weight:500;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.clock span{font-size:11px;letter-spacing:.06em;color:var(--soft)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;width:62px;background:none;border:0;padding:0}
.strip img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 8px rgba(40,39,34,.18))}
.strip img.off{filter:grayscale(1) opacity(.35)}
.daychips{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 12px;background:rgba(245,239,228,.94);backdrop-filter:blur(10px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.daychips button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--soft);white-space:nowrap}
.daychips button b{font-weight:600;color:var(--ink);margin-right:4px}
.daychips button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daychips button[aria-current="true"] b{color:var(--bg)}
.daychips button.today{border-color:var(--terra)}

/* Roteiro: dias */
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);scroll-margin-top:60px;overflow:hidden}
.day.is-today{box-shadow:0 0 0 2px var(--terra),var(--shadow)}
.dayhead{width:100%;display:grid;grid-template-columns:62px 1fr 28px;align-items:center;background:none;border:0;padding:14px 12px 14px 0;text-align:left}
.dnum{display:flex;flex-direction:column;align-items:center;justify-content:center}
.dnum small{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.dnum b{font-family:var(--display);font-size:30px;font-weight:500;color:var(--sand);line-height:1;font-variant-numeric:tabular-nums}
.day.open .dnum b,.day.is-today .dnum b{color:var(--terra)}
.dtit{min-width:0;display:flex;flex-direction:column;gap:4px}
.dtit h3{font-size:20px}
.dtit .fr{font-family:var(--display);font-style:italic;font-size:15.5px;line-height:1.4;color:var(--soft)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--panel3);color:var(--soft)}
.tag.date{background:rgba(138,63,50,.10);color:var(--terra)}
.tag.today{background:var(--terra);color:var(--on-dark)}
.chev{color:var(--faint);transition:transform .25s;justify-self:center}
.day.open .chev{transform:rotate(180deg);color:var(--ink)}
.daybody{padding:2px 18px 22px;display:flex;flex-direction:column;gap:22px;border-top:1px solid var(--line)}
.logi{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--soft);padding-top:14px}
.logi b{color:var(--ink);font-weight:500}
.per{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--moss);margin:10px 0 4px}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
ul.items li>span:last-child{font-weight:500;color:var(--ink)}
ul.items .h.sem{color:var(--faint);font-weight:400}
ul.items li:first-child{border-top:0}
ul.items .h{font-weight:600;color:var(--terra);font-variant-numeric:tabular-nums}
.place{display:flex;flex-direction:column;gap:8px}
.place .sub{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--terra)}
.place h4{font-size:24px;font-weight:500}
.place p{font-size:15.5px;line-height:1.75;color:#3C3A33}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:4px}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:21px;font-weight:600;color:var(--moss);line-height:1.15}
.stats span{font-size:11.5px;color:var(--soft)}
.note{background:#FFF6E6;border:1px solid rgba(168,132,62,.35);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.note .t{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.note p{line-height:1.65}
.cer{background:var(--moss);color:var(--on-dark);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.cer .t{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sand)}
.cer h4{font-size:23px;font-weight:500;color:#fff}
.cer p{line-height:1.65;color:rgba(255,252,247,.88)}
.cer .q{font-size:12.5px;color:var(--sand);border-top:1px solid rgba(255,255,255,.18);padding-top:8px;margin-top:4px}
.gods{background:var(--paper);border-radius:var(--r);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.gods .intro{font-family:var(--display);font-style:italic;font-size:16.5px;color:#4A463C}
.godrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.god{width:min(31%,150px);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.god img{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 6px 18px rgba(40,39,34,.18)}
.god span{font-size:12px;color:#4A463C;font-weight:500}
.gods .story h5{font-size:19px;font-style:italic;margin-bottom:4px}
.gods .story p{line-height:1.75;color:#3C3A33}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
@media (max-width:420px){.checks{grid-template-columns:1fr}}
.checks label{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px}
.checks input{appearance:none;width:18px;height:18px;border:1.5px solid var(--sand);border-radius:6px;flex:none;display:grid;place-items:center;margin:0;background:#fff}
.checks input:checked{background:var(--moss);border-color:var(--moss)}
.checks input:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.checks input:checked+span{color:var(--faint);text-decoration:line-through}
.seals{display:flex;gap:16px;flex-wrap:wrap}
.seals button{background:none;border:0;padding:0;width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--moss)}
.seals img{width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(40,39,34,.2))}
.seals img.off{filter:grayscale(1) opacity(.35)}
details.guide{background:var(--panel);border-radius:16px;box-shadow:var(--shadow)}
details.guide summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary b{font-family:var(--display);font-size:19px;font-weight:500}
details.guide summary span{font-size:13px;color:var(--soft);display:block}
details.guide .gb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details.guide .gb p{line-height:1.75;color:#3C3A33}
.foot{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0 8px}
.foot img.s{width:64px;height:auto}
.foot q{font-family:var(--display);font-style:italic;font-size:20px;color:var(--ink);quotes:none;max-width:30ch}
.orn{display:none}

/* Passaporte */
.pcover{position:relative;overflow:hidden;border-radius:6px 18px 18px 6px;background:radial-gradient(circle at 30% 20%,#4E5A45,#2F3829 70%);color:#E9D9AE;aspect-ratio:1.55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:0 18px 40px rgba(40,39,34,.28),inset 10px 0 0 rgba(0,0,0,.18)}
.pcover::before{content:"";position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(233,217,174,.35);border-radius:4px 12px 12px 4px}
.pcover img{width:62px;height:auto;filter:sepia(1) saturate(1.6) brightness(1.15)}
.pcover b{font-family:var(--display);font-weight:500;font-size:clamp(18px,5vw,24px);letter-spacing:.2em;text-transform:uppercase}
.pcover span{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
.datapage{position:relative;overflow:hidden;background:#FFFDF8;color:var(--ink);padding:18px 18px 12px;border-radius:var(--r);box-shadow:var(--shadow);
  background-image:repeating-radial-gradient(circle at 85% 15%,rgba(63,73,56,.06) 0 1px,transparent 1px 10px),repeating-linear-gradient(120deg,rgba(138,63,50,.04) 0 1px,transparent 1px 8px)}
.datapage .top2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line2);padding-bottom:8px;margin-bottom:14px}
.datapage .top2 b{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--moss)}
.datapage .top2 span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.dp{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start}
.fotobox{display:flex;flex-direction:column;align-items:center;gap:4px}
.fotobtn{position:relative;width:96px;height:128px;padding:0;border:1.5px dashed var(--sand);border-radius:10px;background:var(--panel3);overflow:hidden;display:grid;place-items:center}
.fotobtn:disabled{cursor:default}
.fotobtn img{width:100%;height:100%;object-fit:cover;display:block}
.fotobtn:has(img){border-style:solid;border-color:var(--line2)}
.fotoadd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--moss);line-height:1.2;padding:4px}
.fotoadd b{font-size:26px;font-weight:400;line-height:1}
.fototroca{position:absolute;left:0;right:0;bottom:0;background:rgba(40,39,34,.6);color:#fff;font-size:11px;padding:3px 0}
.fotost{font-size:11px;color:var(--soft);text-align:center;max-width:110px}
.cadfotobox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cadfoto{width:60px;height:80px;object-fit:cover;border-radius:8px}
.dp dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.dp dt{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.dp dd{margin:0;font-family:var(--display);font-size:18px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.dp .wide{grid-column:1/-1}
.mrz{margin-top:14px;font-family:ui-monospace,"Courier New",monospace;font-size:clamp(10px,2.9vw,13px);letter-spacing:.12em;color:var(--soft);white-space:pre;overflow:hidden}
.pages{background:#FFFDF8;border-radius:var(--r);box-shadow:var(--shadow);padding:22px 12px 26px;background-image:linear-gradient(180deg,#FFFDF8,#FBF3E4 50%,#F6EEDD)}
.pages .ph{text-align:center;display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.pages .ph h2{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 10px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
.checksel{position:absolute;right:2%;bottom:14%;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#8FC27A,#3F7A3A 70%);border:2.5px solid #F4E6C4;box-shadow:0 3px 8px rgba(0,0,0,.35);pointer-events:none}
.checksel svg{width:62%;height:62%}
.checksel.new{animation:checkPop .6s cubic-bezier(.2,1.6,.4,1) both}
.pgart .checksel{width:26px;height:26px}
.sheet .bigwrap .checksel{width:48px;height:48px}
.celcheck{width:74px;height:74px;right:-6px;bottom:8%;border-width:3.5px;animation:checkPop .55s .75s cubic-bezier(.2,1.6,.4,1) both}
.celcheck svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:checkTraco .4s 1.05s ease-out forwards}
@keyframes checkPop{0%{opacity:0;transform:scale(0) rotate(-40deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes checkTraco{to{stroke-dashoffset:0}}
.celebra{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 40%,rgba(80,46,20,.98),rgba(18,10,6,.99));animation:celEntra .35s ease-out both}
.celebra.sai{animation:celSai .35s ease-in both}
.celcont{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:360px}

.sheet{position:fixed;inset:0;background:rgba(40,39,34,.35);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}}
.sheet>div,.sheet form{background:var(--panel);border-radius:24px;box-shadow:0 20px 60px rgba(40,39,34,.25);padding:24px 20px;width:100%;max-width:500px;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet .chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.sheet .foot2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:6px}
.sheet .bigwrap{position:relative;width:min(56%,200px);margin:0 auto}
.sheet .bigwrap img{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(40,39,34,.25))}
.sheet .bigwrap.off img{filter:grayscale(1) opacity(.35)}
.sheet .bigwrap .stamp{width:96px;height:96px;margin-left:-48px}
.sheet .bigwrap .stamp b{font-size:14px}
.sheet .bigwrap .stamp i{font-size:11px}
.sheet h2{text-align:center;font-size:27px}
.sheet>.convite{align-items:center;text-align:center;gap:12px;padding:28px 22px}
.convite .convsimb{width:56px;height:auto}
.convite .btn{width:100%;justify-content:center}
.saber{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.saber h3{font-size:22px;font-style:italic}
.saber p{font-family:var(--display);font-size:17.5px;line-height:1.7;color:#3C3A33}
.saber .src{font-family:var(--ui);font-size:12.5px;color:var(--faint)}
.fotofield{display:flex;flex-direction:column;gap:8px}
.fotofield img{width:100%;max-width:100%;max-height:200px;object-fit:cover;border-radius:12px}
.unlock{display:flex;gap:8px;flex-wrap:wrap}
.unlock input{flex:1 1 160px;min-width:0}
.secret{font-size:12.5px;color:var(--soft);border-top:1px dashed var(--line2);padding-top:10px}
.secret code{font-family:ui-monospace,Menlo,monospace;background:var(--panel3);padding:1px 6px;border-radius:6px;color:var(--ink)}

/* Cabeçalho e menu em couro, com latão */
.top{background:linear-gradient(180deg,#3B2A1C,#2E2116);border-bottom:1px solid #1E150D;box-shadow:inset 0 -1px 0 rgba(226,190,120,.25);color:#F1E2BC;backdrop-filter:none}
.top::after{content:"";position:absolute}
.brand img{width:40px;height:auto}
.brand{flex-direction:row;gap:10px;text-align:left}
.brand b{color:#F1E2BC;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:15.5px;font-weight:600}
.brand span{color:#C9A56A;letter-spacing:.24em}
.me:not(.bubble){background:rgba(241,226,188,.08);border:1px solid rgba(226,190,120,.35);box-shadow:none}
.me:not(.bubble) b{color:#E2BE78}
nav.tabs{background:linear-gradient(0deg,#2B1F14,#3B2A1C);border-top:1px solid #1E150D;box-shadow:inset 0 1px 0 rgba(226,190,120,.22);grid-template-columns:repeat(10,minmax(52px,1fr));overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.navmais{display:none;position:fixed;right:0;bottom:0;width:44px;height:calc(76px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,rgba(43,31,20,0),#2B1F14 65%);color:#E2BE78;font-size:26px;align-items:center;justify-content:flex-end;padding:0 8px calc(env(safe-area-inset-bottom,0px) + 6px) 0;pointer-events:none;z-index:30}
body.navmais-on .navmais{display:flex}
nav.tabs button{color:#BFA67A;font-size:10px}
nav.tabs .ic{width:44px!important}
nav.tabs .ic{width:48px;color:#E9D7B0}
nav.tabs button[aria-current="page"]{color:#F1E2BC}
nav.tabs button[aria-current="page"] .ic{background:linear-gradient(180deg,#E2BE78,#B98A43);color:#2B1F14;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px rgba(0,0,0,.35)}
@media (min-width:900px){nav.tabs{background:linear-gradient(90deg,#2B1F14,#3B2A1C);border-right:1px solid #1E150D;grid-template-columns:1fr}}

/* Mapa da Expedição */
.map{background:#EAD6A8;border-radius:10px;box-shadow:0 10px 30px rgba(59,42,28,.25)}
.map .terra{fill:#E4CC98;stroke:#6B4A2A;stroke-width:1;stroke-linejoin:round;opacity:.75}
.map .terra.india{fill:#EFDDB3;opacity:1;stroke-width:1.6}
.map .rio{fill:none;stroke:#5F8190;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.map .riolbl{display:none}
.map .satelite{opacity:.62;filter:sepia(.55) saturate(.85) contrast(1.05)}
.map .satelite.ruas,.map .satelite.hibrido{opacity:.95;filter:sepia(.18) saturate(.95)}
.map .geo.sat .terra{fill-opacity:.12}
.map .geo.sat .terra.india{fill-opacity:.08}
.map .satcred{font:500 9px var(--ui);fill:#5B3F22;opacity:.8}
.map .grade line{stroke:#6B4A2A;stroke-width:.5;stroke-dasharray:3 5;opacity:.35}
.map .grade text{font:500 10px var(--ui);fill:#6B4A2A;opacity:.6}
.map .rota{fill:none;stroke:#A3231A;stroke-width:4;stroke-linecap:round;stroke-dasharray:.012 .008}
.map .rota.fina{stroke-width:2.5}
.map .rota-sombra{fill:none;stroke:rgba(90,20,10,.18);stroke-width:8;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .map .rota.desenha{stroke-dasharray:1;stroke-dashoffset:1;animation:traca 3.2s ease-in-out forwards}
  @keyframes traca{to{stroke-dashoffset:0}}
  .explorador .bob{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:scale(.74) translateY(0)}50%{transform:scale(.74) translateY(-3px)}}
  .explorador .vivo{animation:pulso 1.8s ease-out infinite;transform-origin:22px 62px;transform-box:fill-box}
  @keyframes pulso{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
}
.map .vivo{fill:rgba(200,65,47,.45)}
.map .cidade{cursor:pointer}
.map .cidade .c1{fill:#F1E2BC;stroke:#A3231A;stroke-width:2.5}
.map .cidade .c2{fill:#A3231A}
.map .cnome{font:600 21px var(--display);fill:#3B2A1C;letter-spacing:.14em;paint-order:stroke;stroke:#EFDDB3;stroke-width:5px;stroke-linejoin:round}
.map .ccnt{font:italic 500 14px var(--display);fill:#6B4A2A;paint-order:stroke;stroke:#EFDDB3;stroke-width:4px}
.map .cart1{font:600 17px var(--display);fill:#3B2A1C;letter-spacing:.3em}
.map .cart2{font:italic 500 13px var(--display);fill:#6B4A2A}
.map .cmp{font:600 13px var(--display);fill:#3B2A1C}
.map .escala text{font:500 12px var(--ui);fill:#3B2A1C}
.map .pin .ring{fill:#F4E6C4;stroke:#6B4A2A;stroke-width:2}
.map .pin.off .ring{stroke:#A3231A;stroke-dasharray:3 3}
.map .pin .n{font:700 16px var(--ui);fill:#A3231A}
.map .pin .lbl{font:500 17px var(--display);fill:#3B2A1C;stroke:#EAD6A8}
.map .pin .halo{stroke:#A3231A}
.map .hotel rect{fill:#F4E6C4;stroke:#3B2A1C}
.map .hotel text{font:italic 500 15px var(--display);fill:#3B2A1C;stroke:#EAD6A8}
.explorador .etq{fill:#F4E6C4;stroke:#6B4A2A;stroke-width:1}
.explorador .etqt{font:600 10.5px var(--ui);fill:#3B2A1C;text-anchor:middle}
#tabs button[data-tab="conversa"]{position:relative}
.pinmsg{position:absolute;top:2px;left:50%;margin-left:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#F2C230;color:#3B2A1C;font:700 10.5px/17px var(--ui);text-align:center;box-shadow:0 0 0 2px #2B1F14,0 0 10px rgba(242,194,48,.7);animation:pinpulsa 2s ease-in-out infinite}
.pinmsg[hidden]{display:none}
@keyframes pinpulsa{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.pinmsg{animation:none}}
.celcard{position:relative;background:var(--panel);border:1px solid var(--line2);border-left:4px solid #F2C230;border-radius:14px;padding:14px 40px 14px 16px;margin:0 0 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.celcard p{margin:0}
.celpassos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.icshare{vertical-align:-3px}
.fixado{position:relative;margin:10px 0 0;background:#FFF6D8;border:1px solid #E9C45A;border-left:4px solid #F2C230;border-radius:14px;padding:10px 38px 10px 14px}
.view>.fixado{margin:0 0 16px}
.fixado.destaque{box-shadow:0 6px 18px rgba(242,194,48,.35)}
.fixado .t{margin:2px 0 0;font-size:15px;white-space:pre-wrap;color:#3B2A1C}
.avisolab{color:#9A6A00!important;margin:0}
.bubble.aviso .b{background:#FFF6D8;border:1px solid #E9C45A;color:#3B2A1C}
.bubble.me.aviso .b{background:#FFF6D8;color:#3B2A1C}
.bubble.me.aviso .h,.bubble.me.aviso .h b{color:#8A6420}
.iconbtn.avisoon{background:#F2C230;color:#3B2A1C;border-color:#F2C230}
.composer{flex-wrap:wrap}
.avisotag{flex-basis:100%;order:-1;margin:0 0 2px 4px;font-size:12px;font-weight:600;color:#9A6A00}
.prhead{display:flex;justify-content:flex-end;gap:6px;font-size:11px;color:var(--soft);font-weight:600}
.roster .rosto{align-self:center}
.prhead span{width:30px;text-align:center;font-size:16px}
.roster.prontos li{grid-template-columns:40px 1fr;align-items:start}
.roster.prontos li > :first-child{margin-top:2px}
.prchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.prchip{font:500 11.5px/1 var(--ui);padding:6px 9px;white-space:nowrap;border-radius:999px;border:1px dashed #CDBFA6;color:#9A8C76;background:transparent}
.prchip.on{border:1px solid #3F4938;background:#3F4938;color:#F4ECD9;font-weight:600}
.prs{display:flex;gap:6px}
.pr{width:30px;text-align:center;font-weight:700;font-size:16px;color:var(--faint)}
.pr.on{color:var(--ok)}
.album{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:4px 0 12px}
.album .small{margin:0}
.imapa{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--terra)}
.abertura{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#1A120B;overflow:hidden;animation:abentra .6s ease both}
.abertura.sai{animation:absai .7s ease both}
.abfundo{position:absolute;inset:-20px;background:var(--abimg,url(img/tenda.webp)) center/cover;filter:blur(1.5px) brightness(.45);transform:scale(1.08);animation:abzoom 9s ease-out both}
.abfundo::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(242,194,48,.18),rgba(20,12,6,.75) 70%)}
.ab-rishikesh .abfundo{filter:blur(1.5px) brightness(1) saturate(1.1)}
.ab-rishikesh .abfundo::after{background:radial-gradient(ellipse at 50% 42%,rgba(242,194,48,.12),rgba(20,12,6,.55) 75%)}
.abconteudo{position:relative;text-align:center;color:#F4E6C4;padding:24px;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:6px}
.absimb{width:74px;height:auto;margin-bottom:10px;filter:drop-shadow(0 0 18px rgba(242,194,48,.45));animation:absimb 1.8s ease both}
.abdia{margin:0;font:600 12px var(--ui);letter-spacing:.38em;text-transform:uppercase;color:#E2BE78;animation:absobe 1.2s .7s ease both}
.abcidade{margin:0;font-family:var(--display);font-weight:400;font-size:44px;letter-spacing:.02em;color:#FFF3D6;animation:absobe 1.2s 1.1s ease both}
.abdata{margin:0 0 14px;font:500 12.5px var(--ui);letter-spacing:.14em;color:rgba(244,230,196,.7);animation:absobe 1.2s 1.4s ease both}
.abfrase{margin:8px 0 0;font-family:var(--display);font-style:italic;font-size:21px;line-height:1.5;color:#FFF3D6;max-width:30ch;text-wrap:pretty;hyphens:none;animation:absobe 1.8s 2.2s ease both}
.absegue{margin-top:26px;background:none;border:1px solid rgba(226,190,120,.6);color:#E2BE78;border-radius:999px;padding:10px 30px;font:600 12px var(--ui);letter-spacing:.3em;text-transform:uppercase;animation:absobe 1.2s 4s ease both,abchama 3.2s 5.2s ease-in-out infinite}
@keyframes abchama{0%,100%{border-color:rgba(226,190,120,.45);box-shadow:0 0 0 rgba(242,194,48,0)}50%{border-color:rgba(242,210,140,.95);box-shadow:0 0 16px rgba(242,194,48,.35),inset 0 0 8px rgba(242,194,48,.12)}}
.absegue:active{background:rgba(226,190,120,.15)}
.abfrase.media{font-size:18.5px;max-width:32ch;line-height:1.48}
.abfrase.longa{font-size:17px;max-width:34ch;line-height:1.45}
@keyframes abentra{from{opacity:0}}@keyframes absai{to{opacity:0;transform:scale(1.03)}}
@keyframes abzoom{from{transform:scale(1.18)}}@keyframes absimb{from{opacity:0;transform:scale(.7)}}
@keyframes absobe{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.abertura,.abertura *{animation:none!important}}
.pgmso{margin:0 0 4px;font:600 11px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:#8A3F32;text-align:center}
.celx{position:absolute;top:6px;right:8px;background:none;border:0;font-size:22px;line-height:1;color:var(--soft);padding:4px 8px}
.meuexp{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:4px 14px 4px 6px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.bonecosvg{display:block}
.bonecosvg.mini{width:26px;height:39px}
.bonecosvg.big{width:min(60vw,200px);height:auto;margin:0 auto}

/* Montador de explorador */
.builder{display:grid;gap:18px}
@media (min-width:720px){.builder{grid-template-columns:260px 1fr;align-items:start}}
.preview{background:radial-gradient(circle at 50% 40%,#F4E6C4,#E4CC98);border-radius:var(--r);padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow)}
.tagname{font-family:var(--display);font-size:20px;font-weight:600;color:#3B2A1C}
.controls{display:flex;flex-direction:column;gap:8px}
.lab{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-top:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:13px}
.opt[aria-pressed="true"]{background:#3B2A1C;color:#F1E2BC;border-color:#3B2A1C}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px #B98A43}

/* Estúdio de fotos */
.estudio{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}.estudio>*{min-width:0}
@media (min-width:820px){.estudio{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.fotoframe{background:transparent;padding:0;display:grid;place-items:center}
.fotofixa{position:sticky;top:0;z-index:3;background:var(--bg,#F5EFE3);padding-top:6px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tirafotos{display:flex;gap:8px;flex-wrap:wrap}.tiramini{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}.tiramini b{color:#A3231A}.tiramini.mais{border-style:dashed;color:var(--soft)}
.intens{display:grid;grid-template-columns:auto 1fr 44px;align-items:center;gap:10px;margin:8px 2px 0;font-size:13px;color:var(--soft)}
.intens input{width:100%;accent-color:#3F4938}
.intens b{text-align:right;color:var(--ink);font-weight:600}
.trocafoto{display:flex;justify-content:center}
.trocafoto .btn{padding:8px 18px;font-size:13.5px}
.adesbox{display:flex;flex-direction:column;gap:8px}
.adesgrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.adesbt{aspect-ratio:1;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:grid;place-items:center;padding:6px}
.adesbt img{max-width:100%;max-height:100%;object-fit:contain}
.adesbt img.carregando{opacity:.15}
.adesbt:active{transform:scale(.94)}
.adessel{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 4px}
.tecladica{margin-top:10px;background:#FFF6D8;border:1px solid #E9C45A;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.45;color:#3B2A1C}
.tecladica .linkbtn{align-self:flex-start;background:none;border:0;padding:4px 0 0;color:var(--terra);font-size:12.5px;text-decoration:underline}
.tradmodo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tradmodo button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);text-align:left;color:var(--ink)}
.tradmodo button span{font-size:12.5px;color:var(--soft)}
.tradmodo button[aria-selected="true"]{background:#3B2A1C;border-color:#3B2A1C;color:#F4E6C4}.tradmodo button[aria-selected="true"] span{color:#E2BE78}
.tradbox textarea{width:100%;font-size:17px;border-radius:12px;padding:12px;border:1px solid var(--line2);background:#FFFCF7;font-family:inherit;resize:vertical}
.tradtxt{font-size:28px;line-height:1.35;margin:0;color:#3B2A1C;font-family:"Poppins","Noto Sans Devanagari",sans-serif;font-weight:500}
.tradrom{margin:0;font-style:italic;color:#8A3F32}
.tradhist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tradhist button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
.tradhist button span{font-size:13px;color:var(--soft)}.tradhist button b{font-weight:500;font-family:"Poppins","Noto Sans Devanagari",sans-serif}
.sheet>.tradgrande{max-width:none;min-height:70%;justify-content:center;align-items:center;text-align:center;background:#FFFCF7}
.tgtxt{font-size:clamp(34px,10vw,64px);line-height:1.3;margin:0;color:#3B2A1C;font-family:"Poppins","Noto Sans Devanagari",sans-serif;font-weight:600}
.tgrom{font-size:20px;color:#8A3F32;font-style:italic;margin:0}
.filmstrip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filmstrip::-webkit-scrollbar{display:none}
.fthumb{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;scroll-snap-align:start;font-size:12px;color:var(--soft);cursor:pointer}
.fthumb img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid transparent;box-shadow:0 2px 6px rgba(40,30,20,.18)}
.fthumb[aria-selected="true"] img{border-color:#B98A43}
.fthumb[aria-selected="true"] span{color:#3B2A1C;font-weight:600}
.fotocanvas{max-width:100%;max-height:38vh;height:auto;display:block}
@media (min-width:820px){.fotocanvas{max-height:70vh}}
/* celular: só a foto acompanha a rolagem (como o bonequinho do Explorador); filtros, adesivos e o resto rolam normalmente */
@media (max-width:819px){
  .fotofixa{display:contents}
  .fotoframe{position:sticky;top:0;z-index:3;padding:6px 0 10px;margin:0 -16px;background:var(--bg,#F5EFE3)}
  .fotoframe .fotocanvas{max-height:46vh}
}
.fcontrols{display:flex;flex-direction:column;gap:8px;min-width:0}
.fotovazia{background:var(--panel);border:1.5px dashed var(--sand);border-radius:var(--r);padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fotovazia img{width:90px;height:auto}
.fotovazia b{font-family:var(--display);font-size:22px;font-weight:500}
.fotovazia span{color:var(--soft);max-width:36ch}

.cover{display:block;width:min(64%,260px);max-width:100%;height:auto;margin:0 auto;border-radius:6px 14px 14px 6px;box-shadow:0 18px 40px rgba(40,39,34,.3)}

/* Passaporte em 3D */
.livrosheet{align-items:center;background:radial-gradient(circle at 50% 40%,rgba(59,42,28,.55),rgba(20,14,8,.85))}

.leaf .face.frente{transition:visibility 0s .42s}.leaf.virada .face.frente{visibility:hidden}

(function(){

// ---------- estado ----------
const S = {

  vReady: false, dbReady: false, pularCadastro: false,

  diaAberto: null, ensSel: null, cidadeSel: "india", localSel: null,
  unlockMsg: null, novoSelo: null, marcando: false, posMsg: null, pontoAberto: false, proj: null, local: {}, checks: {}
};
// o app sempre abre no início do Roteiro (só a notificação leva direto para outra aba)
S.tab = "travessia";
{ const hj = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" }); if (hj >= "2026-11-04" && hj <= "2026-11-16") S.tab = "travessia"; }
try { S.local = JSON.parse(localStorage.getItem("cdi-ins") || "{}") || {}; } catch (e) {}
try { S.checks = JSON.parse(localStorage.getItem("cdi-checks") || "{}") || {}; } catch (e) {}
try { S.lidos = JSON.parse(localStorage.getItem("cdi-lidos") || "{}") || {}; } catch (e) { S.lidos = {}; }
function marcaLido(id) { if (!id || S.lidos[id]) return; S.lidos[id] = Date.now(); try { localStorage.setItem("cdi-lidos", JSON.stringify(S.lidos)); } catch (e) {} }

const SVGTAGS = new Set(["svg","g","path","circle","ellipse","text","line","rect","title","image","filter","feTurbulence","feDisplacementMap","defs","clipPath","radialGradient","linearGradient","stop"]);

  const el = SVGTAGS.has(tag) ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);

    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;

const $ = s => document.querySelector(s);
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const byOrdem = (a, b) => (a.ordem ?? 999) - (b.ordem ?? 999);
const blob = id => window.__blobUrl ? window.__blobUrl(id) : "/_blob/" + id;

const badgeSrc = l => l && l.insignia ? `insignias/${l.insignia}.webp` : null;

const FRESCO = 3 * 60 * 60 * 1000;
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
const nn = n => String(n).padStart(2, "0");
const MES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

function numeros() { const m = {}; S.viajantes.filter(v => !v.lider).sort((a, b) => (a.ts || 0) - (b.ts || 0)).forEach((v, i) => m[v.id] = i + 1); return m; }

  if (id === S.uid) return "Você";
  const v = S.viajantes.find(x => x.id === id);
  return (v && v.nome) || S.perfis[id]?.name || "Viajante";

perfis.pend = new Set();
async function perfis(ids) {
  const falta = [...new Set(ids)].filter(id => id && !S.perfis[id] && !perfis.pend.has(id));
  if (!falta.length || !S.user) return;
  falta.forEach(id => perfis.pend.add(id));
  try { Object.assign(S.perfis, await S.user.profiles(falta)); render(); } catch (e) { falta.forEach(id => perfis.pend.delete(id)); }

// ---------- fotos ----------
async function reduzir(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await abreFoto(file), k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 2.5e6) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
  } catch (e) { return file; }
}
async function subirFoto(file) { if (!S.assets) throw { code: "not_granted" }; return (await S.assets.upload(await reduzir(file))).id; }
function erroFoto(e) {
  const c = e && e.code;
  return c === "too_large" ? "A foto é grande demais. Tente uma menor." : c === "unsupported_type" ? "Esse formato não funciona. Use JPG ou PNG." :
    c === "quota_or_state" ? "O espaço de fotos do aplicativo acabou." : "Não consegui enviar a foto. Tente de novo.";
}

      const fi = h("input", { type: "file", accept: "image/*", id, onchange: async () => {

      el.dataset.id = item[k] || ""; inputs[k] = [el, kind];

    else if (kind === "chk") el = h("input", { id, type: "checkbox" });
    else el = h("input", { id, type: kind === "num" ? "number" : "text", step: kind === "num" ? "any" : null });

    inputs[k] = [el, kind];

  closeSheets();
  const sheet = h("div", { class: "sheet", onclick: e => { if (e.target === sheet) closeSheets(); } }, form);
  document.body.append(sheet);
  form.querySelector("input,select,textarea")?.focus();
}

// ---------- Abertura do dia: 5 segundos de ritual ao abrir o app pela primeira vez no dia ----------
function sino() {
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return false;
    const ctx = S.audio || (S.audio = new A()); if (ctx.state === "suspended") ctx.resume();
    if (ctx.state !== "running") return false;
    const t = ctx.currentTime, out = ctx.createGain(); out.gain.value = .22; out.connect(ctx.destination);
    // sino de templo: fundamental com parciais inarmônicos que somem devagar
    [[392, 1, 4.5], [392 * 2.76, .45, 3.2], [392 * 5.4, .22, 2.2], [392 * 8.93, .1, 1.4], [393.5, .6, 4.5]].forEach(([f, a, d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + d + .1);
    });
    return true;
  } catch (e) { return false; }
}

function aberturaDoDia(forcar) {

function textoRico(txt) {
  return String(txt || "").split(/\n\s*\n/).filter(p => p.trim()).map(p => {
    const el = h("p");
    p.trim().split(/(\*\*[^*]+\*\*|\*[^*]+\*)/).forEach(t => {
      if (!t) return;
      if (t.startsWith("**") && t.endsWith("**")) el.append(h("strong", { text: t.slice(2, -2) }));
      else if (t.startsWith("*") && t.endsWith("*") && t.length > 2) el.append(h("em", { text: t.slice(1, -1) }));
      else el.append(document.createTextNode(t.replace(/\n/g, " ")));
    });
    return el;
  });
}

function promptResumo() {
  const pn = S.pedra.slice().sort((a, b) => a.ts - b.ts).map(p => `- ${nomeReal(p.autor).split(" ")[0]} (${new Date(p.ts).toLocaleDateString("pt-BR")}): ${p.texto}`);

Escreva a Mensagem da Travessia: uma carta para o grupo inteiro, a partir de tudo o que as pessoas escreveram no Mural de pensamentos e no chat da caravana. O objetivo é que cada pessoa sinta: fomos vistos por inteiro, juntos.

Como ler (em silêncio, antes de escrever):
1. Separe as frases mais reveladoras, na grafia exata de quem escreveu; as palavras que se repetem entre pessoas diferentes; e as tensões que apareceram no caminho.
2. Encontre o fio central da caravana e formule como identidade coletiva, no formato "Esta caravana não foi X. Foi Y."
3. Mostre o movimento da travessia de cidade em cidade: o que se abriu em cada etapa, ligando as falas aos lugares.
4. Escolha uma metáfora-mestra da natureza (rio, fogo, semente, montanha, lamparina), desenvolva em duas ou três frases e retome no fecho.

Como escrever:
- Português do Brasil, falando com o grupo ("vocês"), carinhoso e preciso, com reticências e exclamações na medida da Caravana.
- Entre 450 e 750 palavras, em parágrafos curtos.
- Cite entre asteriscos, em itálico, só frases que alguém escreveu de fato, dizendo o primeiro nome de quem escreveu. Nunca invente citação. Cite pessoas diferentes, sem expor nada íntimo demais.
- Negrito com dois asteriscos em no máximo uma frase-tese por parágrafo.
- Reconheça o que o grupo viveu e conquistou antes de apontar o que ainda pede cuidado.
- Termine com uma pergunta-espelho curta, sozinha numa linha, e um pequeno ritual para cada pessoa fazer ao chegar em casa.
- Sem clichês de autoajuda ("acredite em você", "saia da zona de conforto", "gratidão"), sem previsões, sem termos clínicos e sem frases de efeito em sequência.
- Responda somente com a carta, sem título. A primeira linha é "Querida caravana..". A última linha é "Caravana do Céu".

Mural de pensamentos:
${pn.join("\n") || "(vazio)"}

Chat da caravana:
${ch.slice(-400).join("\n") || "(vazio)"}`;
}

    h("p", { class: "small", text: "Dica para os mercados: na Índia, negociar o preço faz parte da compra. Pergunte quanto custa e ofereça mais ou menos a metade do valor pedido. O vendedor vai baixar um pouco, você sobe um pouco, e vocês fecham num valor entre os dois. Negocie com calma e bom humor. Se não chegarem a um acordo, agradeça e siga andando: muitas vezes o vendedor chama de volta com um preço melhor. Em lojas com preço fixo na etiqueta não se negocia. Guarde notas pequenas para gorjetas e tuk-tuks." }));
}
function vRupias() {
  buscaCambio();
  const taxa = S.cambio ? S.cambio.brl : null;
  const inr = h("input", { type: "number", inputmode: "decimal", id: "conv-inr", min: "0", placeholder: "0", value: S.convInr ?? "" });
  const brl = h("input", { type: "number", inputmode: "decimal", id: "conv-brl", min: "0", placeholder: "0", value: S.convInr && taxa ? (S.convInr * taxa).toFixed(2) : "" });
  inr.addEventListener("input", () => { S.convInr = inr.value; if (taxa) brl.value = inr.value ? (+inr.value * taxa).toFixed(2) : ""; });
  brl.addEventListener("input", () => { if (!taxa) return; const v = brl.value ? +brl.value / taxa : ""; S.convInr = v ? Math.round(v) : ""; inr.value = S.convInr; });
  const rapido = v => { S.convInr = v; inr.value = v; if (taxa) brl.value = (v * taxa).toFixed(2); };
  return h("div", { class: "conversor" },
    h("div", { class: "convrow" },
      h("label", { class: "convcampo" }, h("span", { text: "₹ Rúpias" }), inr),
      h("span", { class: "convigual", "aria-hidden": "true", text: "=" }),
      h("label", { class: "convcampo" }, h("span", { text: "R$ Reais" }), brl)),
    h("div", { class: "opts" }, [50, 100, 500, 1000, 2000].map(v => h("button", { type: "button", class: "opt", onclick: () => rapido(v) }, "₹ " + v))),
    h("p", { class: "small", text: taxa ? `₹ 100 ≈ R$ ${(100 * taxa).toFixed(2).replace(".", ",")} · cotação de ${new Date(S.cambio.ts).toLocaleDateString("pt-BR")}${Date.now() - S.cambio.ts > 86400000 ? " (sem internet, usando a última guardada)" : ""}` : "Buscando a cotação do dia…" }));
}

// ---------- dados ----------
// cada coleção só redesenha as abas que mostram aqueles dados (evita a tela pular à toa)
const USA = { posicoes: ["mapa", "explorador"], chat: ["conversa", "mapa"], pedra: ["pedra"], mural: ["fotos"], cartas: ["travessia"], cartasP: ["travessia"] };
function listen(col, key, q, after) {
  let primeira = true;
  (q || S.db.collection(col)).onSnapshot(snap => {
    S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (key === "locais") S.locais = ajustaLocais(S.locais); if (key === "ens") S.ens = ajustaSaberes(S.ens); guardaCache(key);
    S.dbReady = true; if (after) after(); if (key === "chat") marcaChat();
    // aviso novo da líder: redesenha qualquer aba para ele aparecer em destaque na hora
    let avisoNovo = false;
    if (key === "chat") { const av = avisoAtual(); if (av && avisoEmDestaque(av) && S.avisoVisto !== av.id) { S.avisoVisto = av.id; avisoNovo = !primeira; } }
    if (primeira || avisoNovo || !USA[key] || USA[key].includes(S.tab)) render();
    primeira = false; refreshSheet();
  }, () => { S.dbReady = true; if (after) after(); render(); });
}

fetch("dados/geo.json").then(r => r.ok ? r.json() : null).then(j => { if (j) { S.geo = j; if (S.tab === "mapa") render(); } }).catch(() => {});
fetch("dados/travessia.json").then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(j => { S.roteiro = j; try { localStorage.setItem("cdi-c-roteiro", JSON.stringify(j)); } catch (e) {} render(); abreDia(); })
  .catch(() => { try { S.roteiro = JSON.parse(localStorage.getItem("cdi-c-roteiro") || "null"); } catch (e) {} if (!S.roteiro) S.roteiroErro = true; render(); });
render();
(async () => {
  const [db, user, assets, room] = await Promise.all(["db", "user", "assets", "room"].map(n => window.claude?.use?.(n) ?? null));
  S.db = db; S.user = user; S.assets = assets; S.room = room;
  if (room) {
    room.onPeers(ch => {
      S.online = new Set(ch.peers.map(p => p.by).filter(Boolean));
      for (const p of ch.peers) { const pr = p.presence || {}; if (p.by && !p.isMe && isFinite(pr.lat)) S.aoVivo[p.by] = { lat: pr.lat, lng: pr.lng, cidadeId: pr.cidadeId, ts: Date.now() }; }
      for (const p of ch.left) if (p.by) delete S.aoVivo[p.by];
      if (S.tab === "mapa") render();
    }, () => {});
    room.on("reacao", m => {
      const d = m.data || {}; if (!d.para || !m.by) return;
      const r = REACOES.find(x => x[0] === d.r), texto = d.r === "fala" ? String(d.texto || "").slice(0, 80) : r ? r[1] + " " + r[2] : "";
      S.baloes[d.para] = { de: m.by, r: d.r, texto: d.r === "fala" ? nomeDe(m.by) + ": " + texto : (r ? r[1] : "") + " " + nomeDe(m.by).split(" ")[0], ts: Date.now() };
      if (d.para === S.uid && !m.isMe) avisoReacao(nomeDe(m.by) + ": " + texto);
      if (S.tab === "mapa") { render(); setTimeout(() => { if (S.tab === "mapa") render(); }, 8200); }
    }, () => {});
  }
  if (user) { const me = await user.me(); S.me = me; S.uid = me.id; S.isOwner = me.isOwner; perfis([me.id]); }
  if (!db) { S.dbReady = true; render(); return; }
  listen("cidades", "cidades"); listen("locais", "locais"); listen("ensinamentos", "ens");
  listen("viajantes", "viajantes", null, () => {
    S.vReady = true;
    // quem virou líder depois de já ter passaporte (ex.: Vanessa) passa a aparecer como Líder
    const v = eu(); if (S.isOwner && v && !v.lider && !S.virandoLider) { S.virandoLider = true; S.db.doc("viajantes/" + S.uid).update({ lider: true }).catch(() => { S.virandoLider = false; }); }
  });
  listen("chat", "chat", db.collection("chat").orderBy("ts", "desc").limit(400));
  listen("posicoes", "posicoes");
  listen("cartas", "cartas", null, () => {
    setTimeout(checaCorreio, 1200);
    // a carta final foi escrita quando eram doze selos; agora são quinze (a líder corrige uma vez só)
    const f = S.isOwner && S.cartas.find(c => c.id === "final");
    if (f && /(Doze|Treze|Catorze|Quinze) selos/.test(f.texto || "")) S.db.doc("cartas/final").update({ texto: f.texto.replace(/(Doze|Treze|Catorze|Quinze) selos/, "Dezesseis selos") }).catch(() => {});
  });
  // cartas só para uma pessoa: cada viajante lê só as suas; a líder vê todas
  { const cp = db.collection("cartasPessoais"); listen("cartasPessoais", "cartasP", S.isOwner || !cp.where ? cp : cp.where("para", "==", S.uid), () => setTimeout(checaCorreio, 1200)); }
  listen("pensamentos", "pedra");
  if (S.isOwner && window.__SITE) listen("membros", "membros");
  listen("mural", "mural", db.collection("mural").orderBy("ts", "desc").limit(300));
  setInterval(() => {
    if (document.activeElement?.matches?.("input,textarea,select") || document.querySelector(".sheet")) return;
    if (S.tab === "mapa") return render();
    if (S.tab === "travessia") { const k = [hojeIso(), S.isOwner ? S.online.size : 0, (S.cartas || []).length, cartasAbertas().length].join("|"); if (k !== S.chaveHome) { S.chaveHome = k; render(); } }
  }, 60000);
})();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  // procura versão nova sempre que o app abre ou volta para a tela, e recarrega sozinho quando chega
  const tinha = !!navigator.serviceWorker.controller; let recarregou = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (tinha && !recarregou) { recarregou = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then(r => { r.update(); document.addEventListener("visibilitychange", () => { if (!document.hidden) r.update().catch(() => {}); }); }).catch(() => {});
}
// o iPhone às vezes volta para o app sem recarregar: confere a versão publicada e recarrega se mudou
(function () {
  let checando = false;
  const confere = () => {
    if (checando || document.hidden) return; checando = true;
    fetch("versao.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null)
      .then(j => { if (j && j.v && j.v !== window.__VERSAO) location.reload(); })
      .catch(() => {}).finally(() => { checando = false; });
  };
  document.addEventListener("visibilitychange", confere);
  window.addEventListener("pageshow", confere);
  window.addEventListener("focus", confere);
  setInterval(confere, 5 * 60 * 1000);
})();
</script>
