<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osirion</title>
<meta name="description" content="Osirion: sonho lúcido e viagem astral, com o método Arhat, de Vivian Pupin.">
<meta name="theme-color" content="#121427">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Osirion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:ital,wght@0,300;0,400;0,600;1,400&display=swap">
<style>
/* Layout: um celular centrado na noite; telas trocadas pela barra de baixo, práticas abrem por cima. Visual único, noturno. */
:root {
  --ceu: #121427;        /* fundo, o céu das ilustrações escurecido */
  --ceu-2: #1b1e38;      /* superfícies */
  --ceu-3: #272b4d;      /* bordas e trilhos */
  --areia: #eee5d4;      /* texto */
  --areia-2: #b9b2c9;    /* texto secundário */
  --ocre: #d9662f;       /* o laranja das montanhas */
  --cristal: #f5c75b;    /* o dourado do cristal */
  --nevoeiro: #a9b2f0;   /* muda com a escolha da pessoa */
  --display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --corpo: "Karla", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #1d2042 0%, var(--ceu) 60%) fixed, var(--ceu);
  color: var(--areia);
  font: 400 16px/1.5 var(--corpo);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.aviso-prot { max-width: 420px; width: 100%; font-size: 13px; color: var(--areia-2); text-align: center; text-wrap: balance; }
.aviso-prot b { color: var(--cristal); font-weight: 600; }

.celular {
  position: relative; width: 100%; max-width: 400px; height: min(820px, calc(100dvh - 90px)); min-height: 600px;
  border-radius: 34px; overflow: hidden; background: var(--ceu);
  border: 1px solid var(--ceu-3);
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.7), 0 0 0 6px #0b0c18;
  display: flex; flex-direction: column;
}
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* No celular, o app ocupa a tela inteira, sem a moldura. */
@media (max-width: 460px) {
  body { padding: 0; gap: 0; }
  .aviso-prot { display: none; }
  .celular { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; max-width: none; border-radius: 0; border: 0; box-shadow: none; }
}
.nevoa {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(60% 40% at 80% 8%, color-mix(in srgb, var(--nevoeiro) 22%, transparent), transparent 70%),
    radial-gradient(70% 50% at 10% 100%, color-mix(in srgb, var(--nevoeiro) 12%, transparent), transparent 70%);
  transition: background .8s;
}
.telas { position: relative; z-index: 1; flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.tela { padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 18px; }

h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 22px; line-height: 1.2; }
h3 { font-size: 18px; }
p { margin: 0; }
.rotulo { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--nevoeiro); font-weight: 600; }
.suave { color: var(--areia-2); font-size: 14px; }
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 20px; letter-spacing: .3em; }
.marca img { width: 26px; height: 26px; }
.marca-nome { display: flex; flex-direction: column; line-height: 1.1; }
.marca-nome small { font-family: var(--corpo); font-size: 10px; letter-spacing: .08em; color: var(--areia-2); margin-top: 3px; }
.chip-nev { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--areia-2); background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 999px; padding: 5px 10px 5px 6px; cursor: pointer; font-family: inherit; }
.bolinha { width: 16px; height: 16px; border-radius: 50%; background: var(--nevoeiro); box-shadow: 0 0 10px var(--nevoeiro); }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--cristal); outline-offset: 2px; }
.btn { border: 0; border-radius: 14px; padding: 13px 18px; background: var(--cristal); color: #231a07; font-weight: 600; font-size: 15px; }
.btn.fantasma { background: transparent; color: var(--areia); border: 1px solid var(--ceu-3); }
.btn.largo { width: 100%; }

/* Capa do ato */
.capa { position: relative; border-radius: 22px; overflow: hidden; min-height: 210px; display: flex; align-items: flex-end; }
.capa img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.capa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,20,39,0) 30%, rgba(18,20,39,.92) 100%); }
.capa .txt { position: relative; z-index: 1; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.capa .txt .rotulo { color: var(--cristal); }

/* Momentos do dia */
.momento { display: flex; flex-direction: column; gap: 10px; }
.momento-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.hora { font-size: 12px; color: var(--areia-2); font-variant-numeric: tabular-nums; }
.pratica {
  display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px;
  background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 16px; padding: 12px 14px; text-align: left; width: 100%;
}
.pratica .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--nevoeiro) 14%, var(--ceu)); }
.pratica .ico svg { width: 22px; height: 22px; stroke: var(--nevoeiro); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.pratica .nome { font-weight: 600; font-size: 15px; }
.pratica .det { font-size: 13px; color: var(--areia-2); }
.pratica .feito { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ceu-3); display: grid; place-items: center; font-size: 13px; color: transparent; }
.pratica.ok .feito { background: var(--cristal); border-color: var(--cristal); color: #231a07; }
.pratica.ok .nome { color: var(--areia-2); }

/* Notificação do teste de realidade */
.notif { background: color-mix(in srgb, var(--areia) 10%, var(--ceu-2)); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: 34px 1fr; gap: 10px; text-align: left; border: 0; width: 100%; }
.notif .sinal { width: 34px; height: 34px; border-radius: 9px; background: #0b0c18; display: grid; place-items: center; }
.notif .sinal svg { width: 24px; height: 24px; fill: none; stroke: var(--nevoeiro); stroke-width: 1.6; stroke-linecap: round; }
.notif .linha1 { display: flex; justify-content: space-between; font-size: 12px; color: var(--areia-2); }
.notif .msg { font-weight: 600; }

/* Barra de baixo */
.nav { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--ceu-3); background: color-mix(in srgb, var(--ceu) 88%, black); padding: 8px 6px 10px; }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--areia-2); padding: 4px 0; border-radius: 10px; }
.nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--areia); }
.nav button[aria-current="page"] svg { stroke: var(--nevoeiro); filter: drop-shadow(0 0 6px var(--nevoeiro)); }

/* Sobreposições (práticas) */
.sobre { position: absolute; inset: 0; z-index: 5; background: var(--ceu); display: flex; flex-direction: column; overflow-y: auto; }
.sobre .tela { flex: 1; }
.fechar { background: none; border: 0; color: var(--areia-2); font-size: 14px; padding: 4px 0; display: inline-flex; align-items: center; gap: 6px; }

/* Abertura: o nevoeiro */
.abertura { padding: 0; }
.abertura .arte { position: relative; height: 46%; min-height: 250px; }
.abertura .arte img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.abertura .arte::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,20,39,0) 40%, var(--ceu) 100%); }
.abertura .corpo { padding: 0 22px 26px; margin-top: -40px; position: relative; display: flex; flex-direction: column; gap: 14px; }
.cores { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.cor { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2px solid transparent; position: relative; }
.cor[aria-pressed="true"] { border-color: var(--areia); box-shadow: 0 0 16px currentColor; }
.cor-propria { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--areia-2); }
.cor-propria input { width: 44px; height: 30px; border: 1px solid var(--ceu-3); border-radius: 8px; background: none; padding: 0; }

/* Respiração */
.resp { align-items: center; text-align: center; justify-content: center; }
.resp .fechar { align-self: flex-start; }
.circulo-wrap { width: 240px; height: 240px; max-width: 100%; display: grid; place-items: center; position: relative; }
.circulo { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, var(--cristal) 0%, color-mix(in srgb, var(--cristal) 30%, transparent) 55%, transparent 72%); transition: transform 4s ease-in-out; }
.circulo.grande { transform: scale(2.4); }
.contagem { font-family: var(--display); font-size: 40px; font-variant-numeric: tabular-nums; }
.fase { min-height: 48px; max-width: 30ch; color: var(--areia-2); }

/* Teste */
.passos { display: flex; flex-direction: column; gap: 10px; counter-reset: p; }
.passo { background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.passo h3 { font-size: 16px; font-family: var(--corpo); font-weight: 600; }
.letras { font-family: var(--display); font-size: 26px; letter-spacing: .2em; text-align: center; padding: 10px 0; color: var(--cristal); }
.contador { display: flex; gap: 6px; flex-wrap: wrap; }
.contador i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ceu-3); }
.contador i.on { background: var(--nevoeiro); border-color: var(--nevoeiro); }

/* Noite */
.afirm { font-family: var(--display); font-size: 24px; line-height: 1.35; text-align: center; text-wrap: balance; padding: 18px 6px; color: var(--areia); }
.afirm small { display: block; font-family: var(--corpo); font-size: 12px; color: var(--areia-2); margin-top: 10px; letter-spacing: .1em; text-transform: uppercase; }
.player { background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
.player .play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--nevoeiro); color: var(--ceu); font-size: 18px; }
.trilho { height: 4px; background: var(--ceu-3); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.trilho span { display: block; height: 100%; width: 0; background: var(--nevoeiro); transition: width .5s linear; }
ol.roteiro { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: var(--areia); }
ol.roteiro li::marker { color: var(--nevoeiro); font-family: var(--display); }
.texto { display: flex; flex-direction: column; gap: 14px; line-height: 1.65; }
.texto p { max-width: 65ch; }
.texto .afirm { white-space: pre-line; padding: 14px 6px; }
.texto .afirm.longa { font-size: 18px; line-height: 1.55; }
.texto .sub { font-family: var(--display); font-size: 19px; color: var(--cristal); }
.texto .pergunta { font-family: var(--display); font-size: 21px; text-align: center; color: var(--nevoeiro); padding: 6px 0; }
.texto ul.lista { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.texto ul.lista li::marker { color: var(--nevoeiro); }
.cita { margin: 0; padding: 4px 0 4px 16px; border-left: 2px solid var(--cristal); font-family: var(--display); font-size: 19px; line-height: 1.45; color: var(--areia); }
.cita cite { display: block; font-family: var(--corpo); font-style: normal; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--areia-2); margin-top: 8px; }
.intro-ato { font-size: 14px; color: var(--areia-2); }
.ler { display: flex; flex-direction: column; gap: 8px; }
.cap { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 14px; padding: 12px 14px; }
.cap .t { font-family: var(--display); font-size: 17px; }
.cap .seta { color: var(--nevoeiro); flex: none; white-space: nowrap; }
.livro-capa { position: relative; border-radius: 22px; overflow: hidden; min-height: 180px; display: flex; align-items: flex-end; }
.livro-capa img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.livro-capa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,20,39,.1), rgba(18,20,39,.9)); }
.livro-capa .txt { position: relative; z-index: 1; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.nav button { font-size: 10.5px; }

/* Diário */
.diario { background: #0b0c18; }
.gravar { width: 150px; height: 150px; border-radius: 50%; border: 0; align-self: center; background: radial-gradient(circle, color-mix(in srgb, var(--nevoeiro) 50%, #0b0c18) 0%, #0b0c18 70%); box-shadow: 0 0 0 1px var(--ceu-3), 0 0 40px -6px var(--nevoeiro); color: var(--areia); font-family: var(--display); font-size: 17px; display: grid; place-items: center; }
.gravar.ativo { animation: pulsar 1.6s ease-in-out infinite; }
@keyframes pulsar { 50% { box-shadow: 0 0 0 1px var(--nevoeiro), 0 0 70px 0 var(--nevoeiro); } }
.perguntas { display: flex; flex-direction: column; gap: 4px; text-align: center; font-family: var(--display); font-size: 19px; color: var(--areia-2); }
textarea { width: 100%; min-height: 110px; resize: vertical; background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 14px; color: var(--areia); font: inherit; padding: 12px; }
.tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tipo { background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 14px; padding: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; text-align: left; }
.tipo[aria-pressed="true"] { border-color: var(--nevoeiro); background: color-mix(in srgb, var(--nevoeiro) 14%, var(--ceu-2)); }
.tipo canvas { flex: none; }
.entrada { border-top: 1px solid var(--ceu-3); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.entrada .data { font-size: 12px; color: var(--areia-2); display: flex; justify-content: space-between; }
.entrada p { font-size: 14px; }

/* Calendário do diário */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--ceu-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 8px; border-radius: 9px; font-size: 14px; color: var(--areia-2); }
.seg button[aria-pressed="true"] { background: var(--ceu-3); color: var(--areia); }
.mes-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mes-cab button { background: none; border: 1px solid var(--ceu-3); border-radius: 10px; width: 36px; height: 36px; font-size: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dsem { font-size: 11px; color: var(--areia-2); padding-bottom: 2px; }
.cal .dia { aspect-ratio: 1; max-width: 100%; min-width: 0; border: 0; border-radius: 10px; background: var(--ceu-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--areia-2); font-variant-numeric: tabular-nums; padding: 0; }
.cal .vazio { background: none; }
.cal .dia.tem { color: var(--areia); }
.cal .dia.hoje { box-shadow: inset 0 0 0 1px var(--areia-2); }
.cal .dia[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--nevoeiro); }
.simb { font-size: 14px; line-height: 1; height: 14px; }
.simb.t0 { color: rgba(238,229,212,.3); }
.simb.t1 { color: var(--areia); font-size: 9px; height: 14px; display: inline-grid; place-items: center; }
.alvo:has(.simb) { display: inline-flex; align-items: center; gap: 6px; }
.simb.t2 { color: var(--nevoeiro); }
.simb.t3 { color: var(--cristal); text-shadow: 0 0 8px var(--cristal); }
mark { background: color-mix(in srgb, var(--cristal) 35%, transparent); color: var(--areia); border-radius: 3px; padding: 0 2px; }
.palavras { display: flex; flex-direction: column; gap: 8px; }
.busca { width: 100%; background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 12px; color: var(--areia); font: inherit; padding: 10px 12px; }
.cartao { background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.cartao .data { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--areia-2); }
.cartao p { font-size: 15px; }
.selo-ex { font-size: 11px; color: var(--ocre); border: 1px solid color-mix(in srgb, var(--ocre) 50%, transparent); border-radius: 999px; padding: 1px 8px; }
.guardado { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--areia-2); background: color-mix(in srgb, var(--nevoeiro) 8%, var(--ceu-2)); border-radius: 14px; padding: 12px; }
.guardado svg { flex: none; width: 20px; height: 20px; stroke: var(--nevoeiro); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* Cápsulas */
.t-livro { --tema: var(--cristal); }
.t-ciencia { --tema: var(--nevoeiro); }
.t-tradicoes { --tema: var(--ocre); }
.tema-tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--tema); }
.capsula-hoje { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; text-align: left; width: 100%; border-radius: 20px; padding: 16px; border: 1px solid color-mix(in srgb, var(--tema) 45%, var(--ceu-3)); background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--tema) 22%, transparent), transparent 60%), var(--ceu-2); }
.capsula-hoje h2 { grid-column: 1; }
.capsula-hoje .suave { grid-column: 1; }
.capsula-hoje .abrir { grid-row: 1 / span 3; grid-column: 2; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--tema); color: var(--ceu); font-size: 20px; }
.trilha { display: flex; flex-direction: column; gap: 0; position: relative; }
.trilha::before { content: ""; position: absolute; left: 21px; top: 20px; bottom: 20px; width: 1px; background: var(--ceu-3); }
.no { position: relative; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; background: none; border: 0; text-align: left; width: 100%; }
.no .ponto { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ceu); border: 1px solid var(--ceu-3); font-family: var(--display); font-size: 15px; color: var(--areia-2); position: relative; z-index: 1; }
.no.vista .ponto { background: color-mix(in srgb, var(--tema) 20%, var(--ceu)); border-color: var(--tema); color: var(--tema); }
.no.hoje .ponto { background: var(--tema); color: var(--ceu); border-color: var(--tema); box-shadow: 0 0 18px var(--tema); }
.no.fechada { opacity: .5; }
.no .nome { font-family: var(--display); font-size: 17px; }
.no .cadeado { font-size: 12px; }
.legenda-temas { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--areia-2); }
.legenda-temas span { display: inline-flex; align-items: center; gap: 6px; }
.legenda-temas i { width: 10px; height: 10px; border-radius: 50%; background: var(--tema); }

/* Leitor de cápsula (stories) */
.story { background: var(--ceu); }
.story .fundo { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .18; pointer-events: none; }
.story .fundo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--ceu) 0%, transparent 30%, transparent 60%, var(--ceu) 100%); }
.story .tela { position: relative; min-height: 100%; }
.barras { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.barras i { height: 3px; border-radius: 3px; background: var(--ceu-3); }
.barras i.on { background: var(--tema); }
.story-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.carta { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; min-height: 340px; }
.carta .grande { font-family: var(--display); font-size: 25px; line-height: 1.35; text-wrap: pretty; }
.carta .grande.media { font-size: 21px; }
.carta .de { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--tema); }
.carta h1.capa-t { font-size: 36px; }
.opcao { display: block; width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px; background: var(--ceu-2); border: 1px solid var(--ceu-3); font-size: 15px; }
.opcao.certa { border-color: var(--tema); background: color-mix(in srgb, var(--tema) 18%, var(--ceu-2)); }
.opcao.errada { opacity: .5; }
.explica { font-size: 15px; color: var(--areia); background: color-mix(in srgb, var(--tema) 10%, var(--ceu-2)); border-radius: 14px; padding: 12px 14px; }
.resposta { font-size: 16px; line-height: 1.6; border-left: 2px solid var(--tema); padding-left: 14px; }
.timer { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--tema); display: grid; place-items: center; font-family: var(--display); font-size: 30px; align-self: center; background: none; font-variant-numeric: tabular-nums; }
.story-pe { display: flex; gap: 10px; }
.story-pe .btn { flex: 1; }
.story-pe .voltar-c { flex: none; width: 52px; }
.btn.tema { background: var(--tema); color: var(--ceu); }

/* Práticas em passos */
.passo-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 260px; }
.pontos { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.pontos i { width: 6px; height: 6px; border-radius: 50%; background: var(--ceu-3); }
.pontos i.on { background: var(--nevoeiro); }
.texto .grande-p { font-size: 18px; line-height: 1.6; }

/* Céu */
.ceu-box { border-radius: 20px; overflow: hidden; border: 1px solid var(--ceu-3); background: #0b0c18; }
#ceu { display: block; width: 100%; height: auto; max-width: 100%; }
.legenda { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 13px; color: var(--areia-2); }
.legenda div { display: flex; align-items: center; gap: 8px; }
.numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.numeros div { background: var(--ceu-2); border-radius: 14px; padding: 10px; text-align: center; }
.numeros b { display: block; font-family: var(--display); font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
.numeros span { font-size: 12px; color: var(--areia-2); }
.exemplo { font-size: 12px; color: var(--ocre); }

/* Atos */
.ato { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 18px; padding: 12px 14px; text-align: left; width: 100%; }
.ato .num { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-family: var(--display); font-size: 24px; background: color-mix(in srgb, var(--nevoeiro) 12%, var(--ceu)); color: var(--nevoeiro); }
.ato.atual { border-color: var(--nevoeiro); }
.ato.fechado .num { color: var(--areia-2); background: var(--ceu); }
.ato .sub { font-size: 13px; color: var(--areia-2); }
.cadeado { font-size: 12px; color: var(--cristal); white-space: nowrap; }
.oferta { border-radius: 20px; padding: 18px; background: linear-gradient(160deg, color-mix(in srgb, var(--cristal) 18%, var(--ceu-2)), var(--ceu-2)); border: 1px solid color-mix(in srgb, var(--cristal) 40%, var(--ceu-3)); display: flex; flex-direction: column; gap: 10px; }
.oferta ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--areia); display: flex; flex-direction: column; gap: 4px; }
.preco { font-family: var(--display); font-size: 28px; }

/* Socorro e alvos */
.socorro { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.socorro div { background: var(--ceu-2); border-radius: 14px; padding: 12px; font-size: 13px; color: var(--areia-2); display: flex; flex-direction: column; gap: 4px; }
.socorro b { font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--areia); }
.alvos { display: flex; flex-wrap: wrap; gap: 8px; }
.alvo { border: 1px solid var(--ceu-3); background: var(--ceu-2); border-radius: 999px; padding: 7px 12px; font-size: 13px; }
.alvo[aria-pressed="true"] { border-color: var(--cristal); color: var(--cristal); }
.nota-pe { font-size: 12px; color: var(--areia-2); text-align: center; padding-top: 6px; }

@media (prefers-reduced-motion: reduce) {
  .circulo, .trilho span, .nevoa { transition: none; }
  .gravar.ativo { animation: none; }
}
</style>
</head>
<body>

<p class="aviso-prot"><b>Versão de teste do Osirion.</b> O que você anotar fica só neste aparelho.</p>

<div class="celular" id="app">
  <div class="nevoa" aria-hidden="true"></div>
  <div class="telas" id="telas"></div>
  <nav class="nav" id="nav" aria-label="Seções">
    <button data-aba="hoje"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 1 0 9 9 9 9 0 1 1-9-9z"/></svg>Hoje</button>
    <button data-aba="diario"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Diário</button>
    <button data-aba="ceu"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><circle cx="5" cy="18" r="1"/><circle cx="18" cy="17" r="1.4"/></svg>Duat</button>
    <button data-aba="capsulas"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M7 12h10"/></svg>Cápsulas</button>
    <button data-aba="atos"><svg viewBox="0 0 24 24"><path d="M12 2l6 8-2 10H8L6 10z"/><path d="M6 10h12M12 2v18"/></svg>Atos</button>
  </nav>
</div>

<script src="conteudo.js"></script>
<script src="capsulas.js"></script>
<script>
(function () {
  const IMG = { noite: "img/noite.webp", fios: "img/fios.webp", cristal: "img/cristal.png" };
  // Sinal do Osirion: a lua crescente sobre o horizonte da noite (Duat).
  const SINAL = '<span class="sinal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.5 4.5a5.5 5.5 0 1 0 4 9.3 6.5 6.5 0 0 1-4-9.3z"/><path d="M3 19h18"/><path d="M7 21.5h10"/></svg></span>';

  const ICO = {
    sol: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    mao: '<svg viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7 6 6 0 0 1-5-3l-2-4a1.5 1.5 0 0 1 2.6-1.5L8 15"/></svg>',
    lua: '<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 1 0 9 9 9 9 0 1 1-9-9z"/></svg>',
    vela: '<svg viewBox="0 0 24 24"><path d="M12 3c2 2.5 2 4.5 0 6-2-1.5-2-3.5 0-6z"/><rect x="9" y="11" width="6" height="10" rx="1"/></svg>',
    pena: '<svg viewBox="0 0 24 24"><path d="M5 19c7 0 13-6 14-15C10 5 5 11 5 19z"/><path d="M5 19l8-8"/></svg>',
    agua: '<svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>',
    espiral: '<svg viewBox="0 0 24 24"><path d="M12 12a2 2 0 1 1 2-2 4 4 0 1 1-4-4 6 6 0 1 1-6 6"/></svg>',
    luz: '<svg viewBox="0 0 24 24"><path d="M12 2v20M8 4l4 4 4-4M7 22h10"/></svg>',
    raiz: '<svg viewBox="0 0 24 24"><path d="M12 3v8M12 11c-3 2-5 5-6 10M12 11c3 2 5 5 6 10M12 11v10"/></svg>'
  };

  // O conteúdo vem do livro (conteudo.js).
  const ATOS = window.ARHAT.ATOS.map(a => Object.assign({}, a, { capa: IMG[a.capa] }));
  const CAPS = window.CAPSULAS;
  const TEMAS = { livro: "Do livro Arhat", ciencia: "Ciência do sono", tradicoes: "Tradições do sonho" };

  const CORES = [
    { nome: "Lilás", v: "#a9b2f0" }, { nome: "Azul", v: "#6fa8ff" }, { nome: "Dourado", v: "#f5c75b" },
    { nome: "Verde-água", v: "#7fd6c2" }, { nome: "Rosa", v: "#f0a3c4" }, { nome: "Branco", v: "#f2efe8" }
  ];
  const TIPOS = [
    { k: 0, nome: "Noite negra, sem lembranças" }, { k: 1, nome: "Noite com sonhos" },
    { k: 2, nome: "Algum grau de lucidez" }, { k: 3, nome: "Sonho lúcido ou viagem astral" }
  ];
  const ALVOS = window.ARHAT.ALVOS.map(a => a.curto);
  const alvoTexto = curto => (window.ARHAT.ALVOS.find(a => a.curto === curto) || { texto: curto }).texto;

  // Estado guardado só neste aparelho.
  const guardado = (() => { try { return JSON.parse(localStorage.getItem("arhat") || "{}"); } catch (e) { return {}; } })();
  const est = Object.assign({ nevoeiro: null, ato: 1, feitos: {}, testes: 2, diario: [], alvo: null, inicio: null, vistas: {}, adianta: 0 }, guardado);
  if (!est.inicio) { const d = new Date(); est.inicio = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
  // Dia da jornada: conta desde o primeiro dia no app (no protótipo dá para adiantar).
  function diaDaJornada() {
    const [a, m, d] = est.inicio.split("-").map(Number);
    const passados = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(a, m - 1, d).getTime()) / 864e5);
    return Math.min(CAPS.length, Math.max(1, passados + 1 + (est.adianta || 0)));
  }
  function salvar() { try { localStorage.setItem("arhat", JSON.stringify(est)); } catch (e) {} }

  let aba = "hoje";
  const telas = document.getElementById("telas");
  const app = document.getElementById("app");

  function aplicarCor() { app.style.setProperty("--nevoeiro", est.nevoeiro || "#a9b2f0"); }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const nomeCor = () => (CORES.find(c => c.v === est.nevoeiro) || { nome: "o seu" }).nome;

  function topo() {
    return `<div class="topo"><div class="marca"><img src="${IMG.cristal}" alt=""><span class="marca-nome">OSIRION<small>Sonho lúcido e viagem astral</small></span></div>
      <button class="chip-nev" data-acao="nevoeiro"><span class="bolinha"></span>nevoeiro ${esc(nomeCor()).toLowerCase()}</button></div>`;
  }

  function blocos(lista) {
    return `<div class="texto">${lista.map(b => {
      if (b.p) return `<p class="${b.grande ? "grande-p" : ""}">${esc(b.p)}</p>`;
      if (b.afirm) return `<p class="afirm ${b.afirm.length > 120 ? "longa" : ""}">${esc(b.afirm)}${b.fonte ? `<small>${esc(b.fonte)}</small>` : ""}</p>`;
      if (b.passos) return `<ol class="roteiro">${b.passos.map(x => `<li>${esc(x)}</li>`).join("")}</ol>`;
      if (b.lista) return `<ul class="lista">${b.lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
      if (b.sub) return `<h3 class="sub">${esc(b.sub)}</h3>`;
      if (b.cita) return `<blockquote class="cita">“${esc(b.cita)}”${b.autor ? `<cite>${esc(b.autor)}</cite>` : ""}</blockquote>`;
      if (b.pergunta) return `<p class="pergunta">${esc(b.pergunta)}</p>`;
      return "";
    }).join("")}</div>`;
  }
  function cartaoCapsula(c, hoje) {
    return `<button class="capsula-hoje t-${c.tema}" data-capsula="${c.dia}">
      <span class="tema-tag">${hoje ? "Cápsula de hoje · " : ""}Dia ${c.dia} · ${TEMAS[c.tema]}</span>
      <h2>${esc(c.titulo)}</h2>
      <span class="suave">${est.vistas[c.dia] ? "Vista · tocar para rever" : `${c.minutos} min · ${c.cartas.length} cartas`}</span>
      <span class="abrir">${est.vistas[c.dia] ? "✓" : "▶"}</span></button>`;
  }

  // ---------- Telas ----------
  function telaHoje() {
    const a = ATOS[est.ato];
    const feitos = est.feitos[a.id] || {};
    const momentos = a.momentos.map(m => `
      <section class="momento">
        <div class="momento-cab"><h3>${m.quando === "Noite" ? "Abaton" : m.quando}</h3><span class="hora">${m.quando === "Noite" ? "a prática da noite · " + m.hora : m.hora}</span></div>
        ${m.praticas.map(p => `
          <button class="pratica ${feitos[p.k] ? "ok" : ""}" data-pratica="${p.k}">
            <span class="ico">${ICO[p.ico]}</span>
            <span><span class="nome">${p.nome}</span><br><span class="det">${p.det}</span></span>
            <span class="feito">✓</span>
          </button>`).join("")}
      </section>`).join("");
    return `<div class="tela">${topo()}
      <div class="capa"><img src="${a.capa}" alt=""><div class="txt">
        <span class="rotulo">${a.nome} · noite 3</span><h1>${a.frase}</h1></div></div>
      ${cartaoCapsula(CAPS[diaDaJornada() - 1], true)}
      ${a.intro ? `<p class="intro-ato">${esc(a.intro)}</p>` : ""}
      <button class="notif" data-pratica="teste">${SINAL}
        <span><span class="linha1"><span>OSIRION</span><span>agora</span></span>
        <span class="msg">Será que estou sonhando?</span><br><span class="suave">Olhe para as suas mãos e conte os dedos.</span></span></button>
      ${momentos}
      <p class="nota-pe">Hoje: ${est.testes} de 7 a 10 testes de realidade</p>
    </div>`;
  }

  function desenharPonto(ctx, x, y, tipo, cor, escala) {
    escala = escala || 1;
    if (tipo === 0) { ctx.fillStyle = "rgba(238,229,212,.22)"; ctx.beginPath(); ctx.arc(x, y, 1.6 * escala, 0, 7); ctx.fill(); }
    else if (tipo === 1) { ctx.fillStyle = "rgba(238,229,212,.85)"; ctx.beginPath(); ctx.arc(x, y, 2.6 * escala, 0, 7); ctx.fill(); }
    else if (tipo === 2) {
      ctx.fillStyle = cor;
      [[0, 0], [-4, -3], [4, -2], [-2, 4], [3, 4]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(x + dx * escala, y + dy * escala, 1.4 * escala, 0, 7); ctx.fill(); });
    } else {
      const r = 7 * escala;
      ctx.save(); ctx.shadowColor = "#f5c75b"; ctx.shadowBlur = 12 * escala; ctx.fillStyle = "#f5c75b";
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const ang = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r * .32 : r; ctx.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }

  // Noites de exemplo: 9 semanas de prática, ficando mais lúcidas com o tempo.
  function noitesExemplo() {
    let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const n = [];
    for (let i = 0; i < 56; i++) {
      const p = i / 56, r = rnd();
      n.push(r < .45 - p * .35 ? 0 : r < .85 - p * .3 ? 1 : r < .97 - p * .12 ? 2 : 3);
    }
    return n;
  }

  function telaCeu() {
    const ex = noitesExemplo();
    const minhas = est.diario.map(d => d.tipo);
    const todas = ex.concat(minhas);
    const cont = [0, 0, 0, 0]; todas.forEach(t => cont[t]++);
    return `<div class="tela">${topo()}
      <div><span class="rotulo">Duat · o mundo da noite</span><h1>O céu das suas noites</h1></div>
      <p class="suave">Duat era, para os egípcios, o céu por onde o sol viaja à noite até renascer. Aqui é o seu diagrama de vivências: cada manhã vira um ponto. Uma estrela é um sonho lúcido ou uma viagem astral. Com os meses, a sua constelação aparece.</p>
      <div class="ceu-box"><canvas id="ceu" width="720" height="560" aria-label="Céu com ${todas.length} noites registradas"></canvas></div>
      <div class="numeros"><div><b>${todas.length}</b><span>noites</span></div><div><b>${cont[2]}</b><span>com lucidez</span></div><div><b>${cont[3]}</b><span>estrelas</span></div></div>
      <div class="legenda">${TIPOS.map(t => `<div><canvas width="28" height="28" data-ponto="${t.k}"></canvas>${t.nome}</div>`).join("")}</div>
      <p class="exemplo">As primeiras 56 noites são de exemplo. As que você salvar no Diário entram no fim do céu.</p>
    </div>`;
  }

  function pintarCeu() {
    const c = document.getElementById("ceu"); if (!c) return;
    const ctx = c.getContext("2d"), W = c.width, H = c.height;
    const cor = est.nevoeiro || "#a9b2f0";
    const g = ctx.createRadialGradient(W * .7, H * .1, 10, W * .7, H * .1, W);
    g.addColorStop(0, "#1f2346"); g.addColorStop(1, "#0b0c18");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    let s = 3; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 160; i++) { ctx.fillStyle = `rgba(238,229,212,${.05 + rnd() * .1})`; ctx.fillRect(rnd() * W, rnd() * H, 1.2, 1.2); }
    const todas = noitesExemplo().concat(est.diario.map(d => d.tipo));
    const cols = 7, linhas = Math.ceil(todas.length / cols);
    const mx = 70, my = 50, dx = (W - mx * 2) / (cols - 1), dy = (H - my * 2) / Math.max(1, linhas - 1);
    const pos = todas.map((t, i) => {
      const col = i % cols, lin = Math.floor(i / cols);
      return { x: mx + col * dx + (rnd() - .5) * dx * .6, y: my + lin * dy + (rnd() - .5) * dy * .5, t };
    });
    const estrelas = pos.filter(p => p.t === 3);
    ctx.strokeStyle = "rgba(245,199,91,.28)"; ctx.lineWidth = 1.2; ctx.beginPath();
    estrelas.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    pos.forEach(p => desenharPonto(ctx, p.x, p.y, p.t, cor, 1.6));
    const nEx = 56;
    for (let i = nEx; i < pos.length; i++) { ctx.strokeStyle = cor; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(pos[i].x, pos[i].y, 16, 0, 7); ctx.stroke(); }
    document.querySelectorAll("canvas[data-ponto]").forEach(cv => {
      const x = cv.getContext("2d"); x.clearRect(0, 0, 28, 28); desenharPonto(x, 14, 14, +cv.dataset.ponto, cor, 1.1);
    });
  }

  // ---------- Diário: gravar e calendário ----------
  const isoDe = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const deIso = s => { const [a, m, d] = s.split("-").map(Number); return new Date(a, m - 1, d); };
  const hojeIso = isoDe(new Date());
  const SIMB = ["·", "●", "⁘", "✦"];

  // Noites de exemplo nas últimas semanas, para o calendário abrir com vida.
  const EXEMPLOS = [
    [1, 3, "Estava numa feira em Varanasi e o letreiro mudava cada vez que eu olhava. Puxei o dedo e ele esticou. Fiquei lúcida e voei sobre o Ganges.", "dourado"],
    [2, 1, "Uma casa antiga com luz laranja. Minha avó me entregava uma chave.", "dourado"],
    [3, 0, "", ""],
    [4, 2, "Percebi por um instante que era sonho quando o relógio tinha dois ponteiros iguais. Perdi logo.", "lilás"],
    [6, 1, "Água subindo devagar num templo de pedra. Eu não tinha medo.", "lilás"],
    [7, 1, "Viagem de ônibus, gente da caravana, uma estrada de terra vermelha.", "lilás"],
    [9, 3, "Disse “Clareza, agora!” e tudo ficou nítido. Caminhei pela sala da minha casa e vi o tapete com outras cores.", "lilás"],
    [10, 0, "", ""],
    [12, 2, "Ouvi meu nome sendo chamado e senti a vibração no corpo. Um nevoeiro azul.", "azul"],
    [13, 1, "Um bicho grande no fundo do mar, olhando para mim.", "azul"],
    [15, 1, "Montanha laranja e duas figuras brancas flutuando.", "azul"],
    [17, 0, "", ""],
    [18, 1, "Fragmentos: uma porta, um cheiro de incenso.", ""],
    [20, 1, "Escola antiga, prova que eu não estudei.", ""]
  ].map(([dias, tipo, texto, cor]) => {
    const d = new Date(); d.setDate(d.getDate() - dias);
    return { iso: isoDe(d), tipo, texto, cor, exemplo: true };
  });

  function todasEntradas() {
    return est.diario.map(d => Object.assign({ iso: hojeIso }, d)).concat(EXEMPLOS)
      .sort((a, b) => (a.iso < b.iso ? 1 : a.iso > b.iso ? -1 : 0));
  }

  let tipoEscolhido = 1, gravando = false;
  let modoDiario = "gravar", mesVisto = new Date(new Date().getFullYear(), new Date().getMonth(), 1), diaSel = hojeIso, busca = "", filtro = null;

  const semAcento = c => c.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const chave = t => [...t].map(c => semAcento(c).charAt(0) || c).join("");
  function realcar(texto, termo) {
    if (!termo) return esc(texto);
    const t = chave(termo), base = chave(texto);
    let saida = "", i = 0, j;
    while ((j = base.indexOf(t, i)) !== -1) {
      saida += esc(texto.slice(i, j)) + "<mark>" + esc(texto.slice(j, j + t.length)) + "</mark>";
      i = j + t.length;
    }
    return saida + esc(texto.slice(i));
  }
  const PARADAS = new Set("para pelo pela pelos pelas como mais muito muita sobre entre quando onde estava estavam tinha tinham minha minhas meus meu nossa nosso ainda depois antes porque cada outra outro outras outros isso esse essa este esta numa num uma umas uns com sem que não nao sim era eram foi fui vez vezes tudo toda todo todos todas mim ela ele elas eles logo perdi senti percebi".split(" "));
  function palavrasQueSeRepetem() {
    const conta = {};
    todasEntradas().forEach(d => {
      const vistas = new Set((d.texto || "").toLowerCase().match(/[\p{L}]{4,}/gu) || []);
      vistas.forEach(w => { if (!PARADAS.has(semAcento(w))) conta[w] = (conta[w] || 0) + 1; });
    });
    return Object.entries(conta).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 8);
  }

  function cartao(d) {
    const quando = deIso(d.iso).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    return `<div class="cartao"><div class="data"><span>${esc(quando)}</span>${d.exemplo ? '<span class="selo-ex">exemplo</span>' : ""}</div>
      <div style="display:flex;align-items:center;gap:8px"><span class="simb t${d.tipo}">${SIMB[d.tipo]}</span><b style="font-size:14px">${esc(TIPOS[d.tipo].nome)}</b></div>
      ${d.cor ? `<span class="suave">Nevoeiro ${esc(d.cor)}</span>` : ""}
      <p>${d.texto ? realcar(d.texto, busca.trim()) : '<span class="suave">Nada ficou. Continue praticando com convicção.</span>'}</p></div>`;
  }

  function listaCalendario() {
    const todas = todasEntradas();
    const termo = busca.trim().toLowerCase();
    if (termo || filtro !== null) {
      const achadas = todas.filter(d => (filtro === null || d.tipo === filtro) && (!termo || chave(d.texto || "").includes(chave(termo))));
      return `<span class="rotulo">${achadas.length} ${achadas.length === 1 ? "noite encontrada" : "noites encontradas"}</span>${achadas.map(cartao).join("")}`;
    }
    const doDia = todas.filter(d => d.iso === diaSel);
    const titulo = deIso(diaSel).toLocaleDateString("pt-BR", { day: "numeric", month: "long" });
    return doDia.length ? doDia.map(cartao).join("")
      : `<div class="cartao"><div class="data"><span>${esc(titulo)}</span></div><p class="suave">Nenhuma anotação nesta noite.</p></div>`;
  }

  function telaCalendario() {
    const porDia = {};
    todasEntradas().forEach(d => { porDia[d.iso] = Math.max(porDia[d.iso] ?? -1, d.tipo); });
    const ano = mesVisto.getFullYear(), mes = mesVisto.getMonth();
    const dias = new Date(ano, mes + 1, 0).getDate(), inicio = new Date(ano, mes, 1).getDay();
    let celulas = "";
    for (let i = 0; i < inicio; i++) celulas += '<span class="vazio"></span>';
    let anotadas = 0;
    for (let d = 1; d <= dias; d++) {
      const iso = isoDe(new Date(ano, mes, d)), t = porDia[iso];
      if (t !== undefined) anotadas++;
      celulas += `<button class="dia ${t !== undefined ? "tem" : ""} ${iso === hojeIso ? "hoje" : ""}" data-dia="${iso}" aria-pressed="${iso === diaSel && !busca && filtro === null}" aria-label="${d}">
        <span>${d}</span><span class="simb ${t !== undefined ? "t" + t : ""}">${t !== undefined ? SIMB[t] : ""}</span></button>`;
    }
    const nomeMes = mesVisto.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    return `
      <div class="palavras">
        <input class="busca" id="busca" type="search" placeholder="Buscar palavras nos sonhos: água, avó, Egito…" value="${esc(busca)}" aria-label="Buscar palavras nos sonhos">
        ${(() => { const ps = palavrasQueSeRepetem(); return ps.length ? `<span class="rotulo">Palavras que se repetem nos seus sonhos</span>
        <div class="alvos">${ps.map(([w, n]) => `<button class="alvo" data-palavra="${esc(w)}" aria-pressed="${chave(busca.trim()) === chave(w)}">${esc(w)} <span class="suave" style="font-size:12px">${n}</span></button>`).join("")}</div>` : ""; })()}
      </div>
      <div class="mes-cab"><button data-mes="-1" aria-label="Mês anterior">‹</button><h2>${esc(nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1))}</h2><button data-mes="1" aria-label="Próximo mês">›</button></div>
      <div class="cal">${["D", "S", "T", "Q", "Q", "S", "S"].map(s => `<span class="dsem">${s}</span>`).join("")}${celulas}</div>
      <p class="suave" style="text-align:center">${anotadas} ${anotadas === 1 ? "noite anotada" : "noites anotadas"} neste mês</p>
      <div class="alvos">${TIPOS.map(t => `<button class="alvo" data-filtro="${t.k}" aria-pressed="${filtro === t.k}"><span class="simb t${t.k}">${SIMB[t.k]}</span> ${["Sem lembrança", "Sonhos", "Lucidez", "Estrelas"][t.k]}</button>`).join("")}</div>
      <div id="lista-cal" style="display:flex;flex-direction:column;gap:10px">${listaCalendario()}</div>
      <div class="guardado"><svg viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.6-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg>
        <span>No app de verdade, cada noite fica guardada na sua conta: troca de celular e não perde nada, e dá para baixar tudo. Neste protótipo, fica só neste aparelho.</span></div>`;
  }

  function telaDiario() {
    const seg = `<div class="seg" role="group" aria-label="Diário"><button data-modo="gravar" aria-pressed="${modoDiario === "gravar"}">Anotar</button><button data-modo="calendario" aria-pressed="${modoDiario === "calendario"}">Calendário</button></div>`;
    if (modoDiario === "calendario") return `<div class="tela">${topo()}${seg}${telaCalendario()}</div>`;
    return `<div class="tela diario">${seg}
      <div class="topo"><span class="rotulo">Os primeiros 5 minutos</span><span class="hora">05:47</span></div>
      <div class="perguntas"><span>Não levante. Não abra os olhos.</span><span style="color:var(--areia)">Onde eu estava?</span><span style="color:var(--areia)">O que eu estava sentindo?</span></div>
      <button class="gravar ${gravando ? "ativo" : ""}" data-acao="gravar">${gravando ? "Ouvindo…" : "Gravar sonho"}</button>
      <p class="suave" style="text-align:center">${gravando ? "No app de verdade, a sua voz vira texto aqui. No protótipo, escreva abaixo." : "Toque e fale de olhos fechados. Até lembranças pequenas e sem sentido contam."}</p>
      <label for="sonho" class="rotulo">O que veio</label>
      <textarea id="sonho" placeholder="Eu estava numa casa antiga, a luz era laranja…"></textarea>
      <span class="rotulo">Como foi a noite</span>
      <div class="tipos">${TIPOS.map(t => `<button class="tipo" data-tipo="${t.k}" aria-pressed="${t.k === tipoEscolhido}"><canvas width="28" height="28" data-ponto="${t.k}"></canvas>${t.nome}</button>`).join("")}</div>
      <button class="btn largo" data-acao="salvar-sonho">Guardar a noite</button>
    </div>`;
  }

  function telaCapsulas() {
    const hoje = diaDaJornada();
    const nos = CAPS.map(c => {
      const aberta = c.dia <= hoje, vista = est.vistas[c.dia];
      return `<button class="no t-${c.tema} ${vista ? "vista" : ""} ${c.dia === hoje ? "hoje" : ""} ${aberta ? "" : "fechada"}" data-capsula="${c.dia}" ${aberta ? "" : 'aria-disabled="true"'}>
        <span class="ponto">${vista ? "✦" : c.dia}</span>
        <span><span class="tema-tag">${TEMAS[c.tema]}</span><br><span class="nome">${esc(c.titulo)}</span></span>
        <span class="cadeado">${aberta ? "" : "em " + (c.dia - hoje) + (c.dia - hoje === 1 ? " dia" : " dias")}</span></button>`;
    }).join("");
    return `<div class="tela">${topo()}
      <div><span class="rotulo">Cápsulas</span><h1>Um ensinamento por dia</h1></div>
      <p class="suave">Cada dia abre uma cápsula de dois ou três minutos: o livro, a ciência do sono e os povos que honram os sonhos.</p>
      <div class="legenda-temas"><span class="t-livro"><i></i>Do livro Arhat</span><span class="t-ciencia"><i></i>Ciência do sono</span><span class="t-tradicoes"><i></i>Tradições do sonho</span></div>
      <div class="trilha">${nos}</div>
      <button class="btn fantasma largo" data-acao="adiantar">Adiantar um dia (só no protótipo)</button>
    </div>`;
  }

  function telaAtos() {
    const lista = ATOS.map(a => {
      const aberto = a.gratis || est.pago;
      return `<button class="ato ${a.id === est.ato ? "atual" : ""} ${aberto ? "" : "fechado"}" data-ato="${a.id}">
        <span class="num">${a.id === 0 ? "◦" : ["", "I", "II", "III", "IV", "V"][a.id]}</span>
        <span><h3>${a.nome}</h3><span class="sub">${a.sub}</span></span>
        ${aberto ? (a.id === est.ato ? '<span class="cadeado" style="color:var(--nevoeiro)">agora</span>' : "") : '<span class="cadeado">jornada</span>'}
      </button>`;
    }).join("");
    return `<div class="tela">${topo()}
      <div><span class="rotulo">O método Arhat</span><h1>Cinco atos para abrir os olhos</h1></div>
      <p class="suave">Siga em sequência ou fique alguns dias em cada ato. Quanto mais tempo no Arhat, mais você vive os resultados.</p>
      ${lista}
      ${est.pago ? "" : `<div class="oferta"><span class="rotulo" style="color:var(--cristal)">Jornada completa</span>
        <h2>Do Segundo ao Quinto Ato</h2>
        <ul><li>O despertar das 4 da manhã, ato por ato</li><li>As práticas da noite guiadas pela voz da Vivian</li><li>O céu das suas noites sem limite</li><li>Os alvos das viagens e o socorro dentro do sonho</li></ul>
        <span class="preco">R$ 97</span><span class="suave">pagamento único · ou R$ 19,90 por mês</span>
        <button class="btn largo" data-acao="comprar">Abrir a jornada</button>
        <span class="suave" style="font-size:12px">No protótipo o botão só abre os atos, sem cobrar.</span></div>`}
      <section class="momento"><h2>Dentro do sonho</h2>
        <div class="socorro">
          <div><b>“Clareza, agora!”</b>Quando o sonho fica instável e a lucidez escapa.</div>
          <div><b>“Estou protegido.”</b>Quando vier o medo.</div>
          <div><b>Enfrente o pesadelo</b>Em vez de fugir ou acordar, atravesse.</div>
          <div><b>Peça ajuda</b>Os guias estão atentos do outro lado.</div>
        </div>${cartaoCapsula(CAPS[17], false)}</section>
      <section class="momento"><h2>Alvo da noite</h2><p class="suave">Dê o comando antes de dormir e visualize como se já estivesse lá.</p>
        <div class="alvos">${ALVOS.map(t => `<button class="alvo" data-alvo="${esc(t)}" aria-pressed="${est.alvo === t}">${esc(t)}</button>`).join("")}</div></section>
    </div>`;
  }

  // ---------- Sobreposições ----------
  function abrirSobre(html, aoMontar) {
    fecharSobre();
    const d = document.createElement("div"); d.className = "sobre"; d.id = "sobre"; d.innerHTML = html;
    app.appendChild(d); if (aoMontar) aoMontar(d);
    const f = d.querySelector("[data-fechar]"); if (f) f.focus();
  }
  let timers = [];
  function fecharSobre() { timers.forEach(clearTimeout); timers = []; const d = document.getElementById("sobre"); if (d) d.remove(); }
  const voltar = '<button class="fechar" data-fechar>← voltar</button>';

  function abrirNevoeiro() {
    const sel = est.nevoeiro || CORES[0].v;
    abrirSobre(`<div class="tela abertura">
      <div class="arte"><img src="${IMG.noite}" alt="Ilustração: figuras de luz flutuando sobre montanhas sob a lua"></div>
      <div class="corpo">
        <span class="rotulo">O Início · a primeira manhã</span>
        <h1>Qual é a cor do seu nevoeiro?</h1>
        <p class="suave">Ontem à noite, antes de adormecer, uma esfera de luz ocupou a sua tela mental. É o seu limiar. Escolha a cor dele: o Osirion inteiro passa a ter essa luz.</p>
        <div class="cores" role="group" aria-label="Cores do nevoeiro">${CORES.map(c => `<button class="cor" data-cor="${c.v}" aria-label="${c.nome}" aria-pressed="${c.v === sel}" style="background:${c.v};color:${c.v}"></button>`).join("")}</div>
        <label class="cor-propria" for="cor-livre">Outra cor <input type="color" id="cor-livre" value="${sel}"></label>
        <button class="btn largo" data-acao="entrar">Entrar no Osirion</button>
      </div></div>`);
  }

  function acharPratica(k) {
    const a = ATOS[est.ato];
    for (const m of a.momentos) for (const p of m.praticas) if (p.k === k) return { a, m, p };
    return null;
  }

  function abrirPratica(k) {
    const achada = acharPratica(k); if (!achada) return;
    const { a, m, p } = achada;
    if (k === "teste") return abrirTeste();
    if (p.irDiario) { aba = "diario"; modoDiario = "gravar"; render(); return; }
    // Um bloco por tela; um subtítulo vai junto com o bloco seguinte.
    const passos = [];
    (p.texto || []).forEach(b => {
      const ult = passos[passos.length - 1];
      if (ult && ult.length === 1 && ult[0].sub) ult.push(b); else passos.push([b]);
    });
    const respHtml = p.resp ? `<div class="tela resp" style="padding:0;gap:12px">
        <div class="circulo-wrap"><div class="circulo" id="circ"></div></div>
        <div class="contagem" id="cont">0 / ${p.resp.n}</div>
        <p class="fase" id="fase">Leia os passos e depois respire junto.</p>
        <button class="btn" id="iniciar">Começar</button></div>` : "";
    const player = p.audio ? `<div class="player"><button class="play" id="play" aria-label="Ouvir a prática">▶</button>
        <div><b>Prática guiada pela Vivian</b><div class="suave">o áudio será gravado por você</div><div class="trilho"><span id="trilho"></span></div></div></div>` : "";
    const fim = k === "noite" ? "Vou dormir" : k === "madrugada" ? "Voltar a dormir" : k === "diario" ? "Abrir o diário" : "Feito";
    abrirSobre(`<div class="tela">${voltar}
      <span class="rotulo">${esc(a.nome)} · ${m.quando === "Noite" ? "Abaton, a prática da noite" : esc(m.quando)}</span><h1>${esc(p.nome)}</h1>
      ${respHtml}${player}
      <div class="passo-wrap" id="passo"></div>
      <div class="pontos" id="pontos"></div>
      <div class="story-pe"><button class="btn fantasma voltar-c" id="ant" aria-label="Passo anterior">‹</button><button class="btn largo" id="prox"></button></div></div>`, d => {
      let i = 0;
      const mostra = () => {
        const bl = passos[i] || [];
        const alvo = k === "noite" && est.alvo && i === passos.length - 1 ? `<div class="cartao"><span class="rotulo">Alvo desta noite</span><p>${esc(alvoTexto(est.alvo))}</p></div>` : "";
        d.querySelector("#passo").innerHTML = blocos(bl.map(b => b.p && b.p.length < 400 ? Object.assign({}, b, { grande: true }) : b)) + alvo;
        d.querySelector("#pontos").innerHTML = passos.map((_, j) => `<i class="${j <= i ? "on" : ""}"></i>`).join("");
        d.querySelector("#ant").disabled = i === 0;
        d.querySelector("#prox").textContent = i < passos.length - 1 ? "Próximo" : fim;
      };
      d.querySelector("#ant").onclick = () => { if (i > 0) { i--; mostra(); } };
      d.querySelector("#prox").onclick = () => {
        if (i < passos.length - 1) { i++; mostra(); return; }
        marcar(p.k); fecharSobre();
        if (k === "diario") { aba = "diario"; modoDiario = "gravar"; }
        render();
      };
      mostra();
      const play = d.querySelector("#play");
      if (play) play.onclick = () => {
        const t = d.querySelector("#trilho"); let w = 0; play.textContent = "❚❚";
        const anda = () => { w += 4; t.style.width = Math.min(w, 100) + "%"; if (w < 100) timers.push(setTimeout(anda, 500)); else play.textContent = "▶"; };
        anda();
      };
      const ini = d.querySelector("#iniciar");
      if (ini) ini.onclick = () => {
        ini.hidden = true;
        const r = p.resp, circ = d.querySelector("#circ"), cont = d.querySelector("#cont"), fase = d.querySelector("#fase");
        const segura = r.segura ? 3000 : 0;
        let n = 0;
        const ciclo = () => {
          if (n >= r.n) { fase.textContent = r.fim; marcar(p.k); return; }
          n++; cont.textContent = n + " / " + r.n;
          circ.classList.add("grande"); fase.textContent = r.inspire;
          if (segura) timers.push(setTimeout(() => { fase.textContent = r.segurar; }, 4000));
          timers.push(setTimeout(() => { circ.classList.remove("grande"); fase.textContent = r.expire; }, 4000 + segura));
          timers.push(setTimeout(ciclo, 8000 + segura));
        };
        ciclo();
      };
    });
  }

  function abrirCapsula(dia) {
    const c = CAPS[dia - 1]; if (!c || dia > diaDaJornada()) return;
    const fundo = c.tema === "ciencia" ? IMG.fios : IMG.noite;
    abrirSobre(`<div class="story t-${c.tema}" style="position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column">
      <div class="fundo" style="background-image:url('${fundo}')"></div>
      <div class="tela" style="flex:1">
        <div class="barras" id="barras"></div>
        <div class="story-topo"><span class="tema-tag">Dia ${c.dia} · ${TEMAS[c.tema]}</span><button class="fechar" data-fechar>fechar ✕</button></div>
        <div class="carta" id="carta"></div>
        <div class="story-pe"><button class="btn fantasma voltar-c" id="ant" aria-label="Carta anterior">‹</button><button class="btn tema largo" id="prox">Continuar</button></div>
      </div></div>`, d => {
      let i = 0;
      const carta = d.querySelector("#carta");
      const desenha = () => {
        const k = c.cartas[i];
        d.querySelector("#barras").innerHTML = c.cartas.map((_, j) => `<i class="${j <= i ? "on" : ""}"></i>`).join("");
        d.querySelector("#ant").disabled = i === 0;
        const ultima = i === c.cartas.length - 1;
        d.querySelector("#prox").textContent = ultima ? "Concluir cápsula" : k.t === "abre" ? "Começar" : "Continuar";
        const de = k.de ? `<span class="de">${esc(k.de)}</span>` : "";
        if (k.t === "abre") carta.innerHTML = `<span class="rotulo" style="color:var(--tema)">${c.minutos} min</span><h1 class="capa-t">${esc(k.titulo)}</h1><p class="suave" style="font-size:17px">${esc(k.sub)}</p>`;
        else if (k.t === "fala") carta.innerHTML = `<p class="grande ${k.texto.length > 170 ? "media" : ""}">${esc(k.texto)}</p>${de}`;
        else if (k.t === "revela") {
          carta.innerHTML = `<p class="grande media">${esc(k.pergunta)}</p><button class="btn fantasma" id="rev">Revelar</button><p class="resposta" id="resp" hidden>${esc(k.resposta)}</p>`;
          carta.querySelector("#rev").onclick = e => { e.target.hidden = true; carta.querySelector("#resp").hidden = false; };
        } else if (k.t === "quiz") {
          carta.innerHTML = `<p class="grande media">${esc(k.pergunta)}</p><div style="display:flex;flex-direction:column;gap:8px">${k.opcoes.map((o, j) => `<button class="opcao" data-op="${j}">${esc(o)}</button>`).join("")}</div><p class="explica" id="exp" hidden></p>`;
          carta.querySelectorAll(".opcao").forEach(b => b.onclick = () => {
            carta.querySelectorAll(".opcao").forEach(o => { o.disabled = true; o.classList.add(+o.dataset.op === k.certa ? "certa" : "errada"); });
            const ex = carta.querySelector("#exp"); ex.hidden = false;
            ex.textContent = (+b.dataset.op === k.certa ? "Isso. " : "Quase. ") + k.explica;
          });
        } else if (k.t === "faca") {
          carta.innerHTML = `<span class="rotulo" style="color:var(--tema)">Faça · ${esc(k.titulo)}</span><p class="grande media">${esc(k.texto)}</p>${k.segundos ? `<button class="timer" id="tim">${k.segundos}s</button>` : ""}`;
          const tim = carta.querySelector("#tim");
          if (tim) tim.onclick = () => {
            let r = k.segundos; tim.disabled = true;
            const tic = () => { tim.textContent = r + "s"; if (r-- > 0) timers.push(setTimeout(tic, 1000)); else tim.textContent = "✓"; };
            tic();
          };
        } else if (k.t === "leva") carta.innerHTML = `<span class="rotulo" style="color:var(--tema)">Para levar hoje</span><p class="grande">“${esc(k.texto)}”</p>${de}`;
        else if (k.t === "alvo") {
          carta.innerHTML = `<span class="rotulo" style="color:var(--tema)">Escolha o alvo desta noite</span><div class="alvos">${ALVOS.map(t => `<button class="alvo" data-alvo="${esc(t)}" aria-pressed="${est.alvo === t}">${esc(t)}</button>`).join("")}</div><p class="resposta" id="alvo-txt" ${est.alvo ? "" : "hidden"}>${est.alvo ? esc(alvoTexto(est.alvo)) : ""}</p>`;
        }
      };
      d.querySelector("#ant").onclick = () => { if (i > 0) { i--; desenha(); } };
      d.querySelector("#prox").onclick = () => {
        if (i < c.cartas.length - 1) { i++; desenha(); return; }
        est.vistas[c.dia] = true; salvar(); fecharSobre(); render();
      };
      desenha();
    });
  }

  function abrirTeste() {
    const bolas = Array.from({ length: 10 }, (_, i) => `<i class="${i < est.testes ? "on" : ""}"></i>`).join("");
    abrirSobre(`<div class="tela">${voltar}
      <span class="rotulo">Teste de realidade</span><h1>Será que estou sonhando?</h1>
      <p class="suave">Pare. Sinta os pés firmes no chão. Faça uma inspiração consciente.</p>
      <div class="passos">
        <div class="passo"><h3>As mãos</h3><p class="suave">Conte os dedos. Puxe o indicador. Se esticar, ou se houver mais ou menos de dez dedos, você está sonhando.</p></div>
        <div class="passo"><h3>A respiração</h3><p class="suave">Tampe o nariz e tente respirar por ele. Se o ar passar, é sonho.</p></div>
        <div class="passo"><h3>Letras e números</h3><p class="suave">Olhe a palavra, desvie o olhar, olhe de novo. No sonho ela muda.</p>
          <div class="letras" id="letras">OSIRION</div><button class="btn fantasma" id="olhar">Olhar de novo</button></div>
      </div>
      <div><span class="rotulo">Hoje</span><div class="contador" style="margin-top:8px">${bolas}</div></div>
      <button class="btn largo" data-acao="acordado">Não estou sonhando, por enquanto</button></div>`, d => {
      d.querySelector("#olhar").onclick = () => {
        const l = d.querySelector("#letras"); l.style.opacity = .1;
        timers.push(setTimeout(() => { l.style.opacity = 1; l.textContent = "OSIRION"; }, 500));
      };
    });
  }

  // ---------- Navegação ----------
  function render() {
    aplicarCor();
    telas.innerHTML = { hoje: telaHoje, diario: telaDiario, ceu: telaCeu, capsulas: telaCapsulas, atos: telaAtos }[aba]();
    telas.scrollTop = 0;
    document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", b.dataset.aba === aba ? "page" : "false"));
    pintarCeu();
  }
  function marcar(k) { const id = ATOS[est.ato].id; est.feitos[id] = est.feitos[id] || {}; est.feitos[id][k] = true; salvar(); }

  app.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.aba) { fecharSobre(); aba = b.dataset.aba; render(); return; }
    if (b.hasAttribute("data-fechar")) { fecharSobre(); render(); return; }
    if (b.dataset.cor) { est.nevoeiro = b.dataset.cor; aplicarCor(); document.querySelectorAll(".cor").forEach(c => c.setAttribute("aria-pressed", c === b)); const cl = document.getElementById("cor-livre"); if (cl) cl.value = b.dataset.cor; return; }
    if (b.dataset.pratica) { abrirPratica(b.dataset.pratica); return; }
    if (b.dataset.capsula) { abrirCapsula(+b.dataset.capsula); return; }
    if (b.dataset.tipo) { tipoEscolhido = +b.dataset.tipo; document.querySelectorAll(".tipo").forEach(t => t.setAttribute("aria-pressed", t === b)); return; }
    if (b.dataset.alvo) {
      est.alvo = est.alvo === b.dataset.alvo ? null : b.dataset.alvo; salvar();
      document.querySelectorAll(".alvo").forEach(t => t.setAttribute("aria-pressed", t.dataset.alvo === est.alvo));
      const tx = document.getElementById("alvo-txt"); if (tx) { tx.hidden = !est.alvo; tx.textContent = est.alvo ? alvoTexto(est.alvo) : ""; }
      return;
    }
    if (b.dataset.ato) {
      const a = ATOS[+b.dataset.ato];
      if (!a.gratis && !est.pago) { fecharSobre(); aba = "atos"; render(); const o = document.querySelector(".oferta"); if (o) o.scrollIntoView({ block: "center" }); return; }
      est.ato = a.id; salvar(); aba = "hoje"; render(); return;
    }
    if (b.dataset.modo) { modoDiario = b.dataset.modo; render(); return; }
    if (b.dataset.mes) { mesVisto = new Date(mesVisto.getFullYear(), mesVisto.getMonth() + +b.dataset.mes, 1); render(); return; }
    if (b.dataset.dia) { diaSel = b.dataset.dia; busca = ""; filtro = null; render(); return; }
    if (b.dataset.palavra) { busca = chave(busca.trim()) === chave(b.dataset.palavra) ? "" : b.dataset.palavra; filtro = null; render(); return; }
    if (b.dataset.filtro) { filtro = filtro === +b.dataset.filtro ? null : +b.dataset.filtro; render(); return; }
    const acao = b.dataset.acao;
    if (acao === "nevoeiro") abrirNevoeiro();
    else if (acao === "entrar") { est.nevoeiro = est.nevoeiro || CORES[0].v; salvar(); fecharSobre(); aba = "hoje"; render(); }
    else if (acao === "gravar") { gravando = !gravando; const t = document.getElementById("sonho").value; render(); document.getElementById("sonho").value = t; }
    else if (acao === "salvar-sonho") {
      const texto = document.getElementById("sonho").value.trim();
      est.diario.push({ iso: hojeIso, texto, tipo: tipoEscolhido, cor: tipoEscolhido > 0 ? nomeCor().toLowerCase() : "" });
      const ato = ATOS[est.ato].id; est.feitos[ato] = est.feitos[ato] || {}; est.feitos[ato].diario = true;
      salvar(); gravando = false;
      modoDiario = "calendario"; diaSel = hojeIso; busca = ""; filtro = null;
      mesVisto = new Date(new Date().getFullYear(), new Date().getMonth(), 1); render();
    }
    else if (acao === "acordado") { est.testes = Math.min(10, est.testes + 1); if (est.testes >= 7) marcar("teste"); salvar(); fecharSobre(); render(); }
    else if (acao === "adiantar") { est.adianta = (est.adianta || 0) + 1; salvar(); render(); }
    else if (acao === "comprar") { est.pago = true; salvar(); render(); }
    else if (acao === "feito") { const k = b.dataset.k; marcar(k); fecharSobre(); if (k === "diario") { aba = "diario"; modoDiario = "gravar"; } render(); }
  });
  app.addEventListener("input", e => {
    if (e.target.id === "busca") {
      busca = e.target.value;
      document.getElementById("lista-cal").innerHTML = listaCalendario();
      document.querySelectorAll("[data-palavra]").forEach(c => c.setAttribute("aria-pressed", !!busca.trim() && chave(busca.trim()) === chave(c.dataset.palavra)));
      document.querySelectorAll(".cal .dia").forEach(d => d.setAttribute("aria-pressed", !busca && filtro === null && d.dataset.dia === diaSel));
      return;
    }
    if (e.target.id === "cor-livre") { est.nevoeiro = e.target.value; aplicarCor(); document.querySelectorAll(".cor").forEach(c => c.setAttribute("aria-pressed", "false")); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("sobre") && est.nevoeiro) { fecharSobre(); render(); } });

  render();
  if (!est.nevoeiro) abrirNevoeiro();
})();
</script>

</body>
</html>
